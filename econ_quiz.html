<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FB; --grid:#E1E8F1; --ink:#1B2B4B; --muted:#5A6A86;
  --demand:#2F6FDB; --supply:#D9661A; --good:#23845A; --bad:#C2363F;
  --card:#FFFFFF; --line:#C9D4E3; --good-bg:#E6F4EC; --bad-bg:#FBEBEC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111827; --grid:#1C2536; --ink:#E6ECF5; --muted:#9AA8BF;
    --demand:#6EA0F5; --supply:#F0934D; --good:#4CC38A; --bad:#F07178;
    --card:#18213A; --line:#2D3A55; --good-bg:#15332A; --bad-bg:#3A1C22;
  }
}
:root[data-theme="dark"]{
  --paper:#111827; --grid:#1C2536; --ink:#E6ECF5; --muted:#9AA8BF;
  --demand:#6EA0F5; --supply:#F0934D; --good:#4CC38A; --bad:#F07178;
  --card:#18213A; --line:#2D3A55; --good-bg:#15332A; --bad-bg:#3A1C22;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:1.0625rem; line-height:1.55; min-height:100vh;
}
main{max-width:40rem; margin:0 auto; padding:1.5rem 1.1rem 4rem}
h1,h2,.display{font-family:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif; font-weight:700; letter-spacing:-0.01em; margin:0}
h1{font-size:clamp(1.9rem,6vw,2.6rem); line-height:1.05}
h2{font-size:1.35rem; line-height:1.2}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,.chip:focus-within{outline:3px solid var(--demand); outline-offset:2px}

/* hero graph */
.hero{display:grid; grid-template-columns:1fr auto; gap:1rem; align-items:end; margin-bottom:1.75rem}
.hero p{color:var(--muted); margin-top:.5rem}
.graph{width:120px; height:110px}
.graph .axis{stroke:var(--ink); stroke-width:2; fill:none}
.graph .d{stroke:var(--demand); stroke-width:3; fill:none; stroke-linecap:round}
.graph .s{stroke:var(--supply); stroke-width:3; fill:none; stroke-linecap:round}
.graph .eq{fill:var(--ink)}
.graph text{font:700 11px "Atkinson Hyperlegible",sans-serif; fill:var(--muted)}

.panel{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:1.25rem}
.stack>*+*{margin-top:1rem}
.row{display:flex; gap:.6rem; flex-wrap:wrap}

.btn{border:2px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:10px; padding:.7rem 1.1rem; font-weight:700}
.btn.ghost{background:transparent; color:var(--ink)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.small{padding:.4rem .75rem; font-size:.9rem}

.chips{display:flex; flex-wrap:wrap; gap:.5rem}
.chip{position:relative}
.chip input{position:absolute; opacity:0; inset:0; cursor:pointer}
.chip span{display:block; border:1.5px solid var(--line); border-radius:999px; padding:.35rem .85rem; font-size:.95rem; background:var(--paper)}
.chip input:checked + span{background:var(--demand); border-color:var(--demand); color:#fff}
.hint{color:var(--muted); font-size:.92rem}

/* question */
.topbar{display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:.75rem}
.meter{height:6px; background:var(--grid); border-radius:3px; overflow:hidden; margin-bottom:1.25rem}
.meter i{display:block; height:100%; background:var(--demand); width:0; transition:width .25s}
.tag{font-size:.9rem; color:var(--muted)}
.tag b{color:var(--supply)}
.qtext{font-size:1.2rem; line-height:1.45; margin-bottom:1rem}
.qtext strong,.opt strong,.feedback span strong{font-weight:700; color:var(--ink)}
.opts{display:grid; gap:.6rem}
.opt{display:flex; gap:.75rem; align-items:flex-start; text-align:left; width:100%; cursor:pointer;
  background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:.75rem .9rem;
  user-select:text; -webkit-user-select:text}
.opt:focus-visible{outline:3px solid var(--demand); outline-offset:2px}
.opt .k{flex:none; width:1.6rem; height:1.6rem; border-radius:50%; border:1.5px solid var(--line);
  display:grid; place-items:center; font-weight:700; font-size:.85rem; user-select:none; -webkit-user-select:none}
.opt:hover:not(.done){border-color:var(--demand)}
.opt.done{cursor:default}

/* graphs and tables */
.fig{margin:0 0 1rem}
.fig svg{display:block; width:100%; max-width:440px; height:auto; margin:0 auto}
.fig .ax{stroke:var(--ink); stroke-width:1.6; fill:none}
.fig .gd{stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; fill:none}
.fig path.ln{fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.fig path.ln.dash{stroke-dasharray:7 5}
.fig .d{stroke:var(--demand); fill:var(--demand)}
.fig .s{stroke:var(--supply); fill:var(--supply)}
.fig .v{stroke:var(--ink); fill:var(--ink)}
.fig .g{stroke:var(--good); fill:var(--good)}
.fig .m{stroke:var(--muted); fill:var(--muted)}
.fig text{font:700 11px "Atkinson Hyperlegible",sans-serif; stroke:var(--card) !important; stroke-width:3.5px; stroke-linejoin:round; paint-order:stroke}
.fig .tl{fill:var(--muted); font-weight:400}
.fig .pt{fill:var(--ink); stroke:none}
.fig .ar{stroke:var(--ink); stroke-width:1.6; fill:none}
.fig .arh{fill:var(--ink); stroke:none}
.fig table{border-collapse:collapse; width:100%; font-size:.95rem}
.fig th,.fig td{border:1px solid var(--line); padding:.4rem .55rem; text-align:right}
.fig th{background:var(--grid); text-align:center; font-weight:700}
.fig td:first-child,.fig th:first-child{text-align:left}
.fig-scroll{overflow-x:auto}
.feedback .fig{margin:.75rem 0 0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.opt.right{border-color:var(--good); background:var(--good-bg)}
.opt.right .k{background:var(--good); border-color:var(--good); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad); border-color:var(--bad); color:#fff}
.opt.dim{opacity:.55}
.feedback{margin-top:1rem; border-left:4px solid var(--good); padding:.6rem .9rem; background:var(--good-bg); border-radius:0 8px 8px 0}
.feedback.no{border-color:var(--bad); background:var(--bad-bg)}
.feedback > strong{display:block; margin-bottom:.2rem}
.retry-note{color:var(--muted); font-size:.9rem; margin-top:.5rem}
.next{margin-top:1rem; width:100%}

/* results */
.score{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:3.5rem; line-height:1}
.bars{display:grid; gap:.55rem}
.bar{display:grid; grid-template-columns:3.2rem 1fr 3.4rem; gap:.6rem; align-items:center; font-size:.95rem}
.bar .track{height:10px; background:var(--grid); border-radius:5px; overflow:hidden}
.bar .fill{height:100%; background:var(--good)}
.bar.low .fill{background:var(--supply)}
.bar .n{text-align:right; color:var(--muted)}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){ .meter i{transition:none} }
</style>
<script data-goatcounter="https://aurylo06.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <!-- HOME -->
  <section id="home">
    <div class="hero">
      <div>
        <h1>Macro practice quiz</h1>
        <p>Gwartney 18e, chapters 1, 2 and 5–10. Missed questions come back until you get them right.</p>
      </div>
      <svg class="graph" viewBox="0 0 120 110" aria-hidden="true">
        <path class="axis" d="M12 4 V98 H116"/>
        <path class="d" d="M20 16 L104 90"/>
        <path class="s" d="M20 90 L104 16"/>
        <circle class="eq" cx="62" cy="53" r="5"/>
        <text x="106" y="96">Q</text><text x="2" y="12">P</text>
      </svg>
    </div>

    <div class="stack">
      <div class="panel stack">
        <h2>Pick chapters</h2>
        <div class="chips" id="chips"></div>
        <div class="row">
          <button class="btn small ghost" id="selAll">Select all</button>
          <button class="btn small ghost" id="selNone">Clear</button>
        </div>
        <p class="hint" id="count"></p>
        <button class="btn" id="start">Start quiz</button>
      </div>

      <div class="panel stack">
        <h2>Weak spots</h2>
        <p class="hint" id="weakText"></p>
        <div class="row">
          <button class="btn" id="startWeak">Practice weak spots</button>
          <button class="btn ghost" id="saveWeak">Save to notes</button>
          <button class="btn ghost" id="clearWeak">Clear weak spots</button>
        </div>
        <p class="hint hidden" id="saveNote" role="status" aria-live="polite"></p>
      </div>
      <p class="hint">Keyboard: press 1–4 to answer, Enter for the next question. <a href="./" style="color:var(--demand)">How this quiz works</a></p>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="topbar">
      <span class="tag" id="tag"></span>
      <button class="btn small ghost" id="quit">End quiz</button>
    </div>
    <div class="meter"><i id="meter"></i></div>
    <div class="panel">
      <p class="qtext" id="qtext"></p>
      <div id="qfig"></div>
      <div class="opts" id="opts" role="group" aria-label="Answer choices"></div>
      <div id="fb" class="feedback hidden" role="status" aria-live="polite"></div>
      <button class="btn next hidden" id="next">Next question</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden stack">
    <h1>Round finished</h1>
    <div class="panel stack">
      <div><span class="score" id="score"></span></div>
      <p class="hint" id="scoreNote"></p>
      <div class="bars" id="bars"></div>
    </div>
    <div class="row">
      <button class="btn" id="again">Back to start</button>
      <button class="btn ghost" id="weakAfter">Practice weak spots</button>
      <button class="btn ghost" id="saveWeakAfter">Save to notes</button>
    </div>
    <p class="hint hidden" id="saveNoteAfter" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
const DATA = {"qs": [{"id": 0, "ch": 1, "q": "Which best describes the opportunity cost of a choice?", "opts": ["The single highest-valued option given up by making the choice", "The combined value of every alternative that was passed over", "The money price paid to obtain the option that was selected", "The value of the chosen option minus what it cost to obtain"], "exp": "Opportunity cost is the one highest-valued alternative you sacrifice. It's tempting to add up every alternative passed over, but you could only have done one of them instead, so only the best one counts."}, {"id": 1, "ch": 1, "q": "Which of these statements is normative?", "opts": ["Congress ought to bring the inflation rate down", "Raising the money supply tends to push inflation up", "The core of the earth is made mostly of marshmallow", "Higher gasoline prices lead drivers to buy less gas"], "exp": "Normative statements are judgments about what ought to be, so they can't be proved true or false. The marshmallow claim is tempting because it is obviously false, but it is still positive: it is a testable claim about what is."}, {"id": 2, "ch": 1, "q": "The mistaken belief that what is true for one part must also be true for the whole group is called:", "opts": ["The fallacy of composition", "Association is not causation", "Violation of ceteris paribus", "Ignoring secondary effects"], "exp": "The fallacy of composition is assuming that what holds for an individual holds for the group. It matters most when moving from micro units to the whole economy. Association versus causation is a different pitfall: it's about wrongly inferring cause from two things moving together."}, {"id": 3, "ch": 1, "q": "'Ceteris paribus' means:", "opts": ["Other things held constant", "At the margin", "Buyer beware", "Value is subjective"], "exp": "Ceteris paribus = other things constant. Failing to hold other things constant can lead to wrong conclusions about cause and effect.", "retired": true}, {"id": 4, "ch": 1, "q": "When price is used to ration a good, who ends up with it?", "opts": ["Those willing to give up the most other things to obtain it", "Those who arrive first and are willing to wait in line for it", "Those who have the strongest political connections to get it", "Those whose need for the good is judged to be the greatest"], "exp": "Under price rationing, the good goes to those willing to give up other things, by paying the price, to get ownership. Waiting in line describes first-come, first-served rationing, a different method."}, {"id": 5, "ch": 1, "q": "According to Gwartney, how should an economic theory be judged?", "opts": ["By how well it predicts real-world outcomes", "By how realistic each of its assumptions is", "By how many leading experts agree with it", "By whether its policy goals are well-meant"], "exp": "Guidepost 8: the test of a theory is its ability to predict. Realistic assumptions sound appealing, but a theory with simplified assumptions is still useful if its predictions hold up against real-world events."}, {"id": 6, "ch": 2, "q": "A point INSIDE the production possibilities curve represents:", "opts": ["An inefficient use of resources", "An unattainable combination of output", "Full and efficient use of resources", "Economic growth"], "exp": "Inside = inefficient; you could get more of one good without giving up any of the other. On the curve = efficient. Outside = unattainable with current resources.", "retired": true}, {"id": 7, "ch": 2, "q": "Which of these would NOT shift the PPC outward?", "opts": ["Moving resources from producing food to producing clothing", "An advancement in technology", "An increase in the economy's resource base", "Improvements in the rules under which the economy functions"], "exp": "Reallocating resources moves you ALONG the curve. The four outward shifters: more resources, better technology, improved rules/institutions, and working harder (giving up leisure).", "retired": true}, {"id": 8, "ch": 2, "q": "The law of comparative advantage says the joint output of trading partners is greatest when each good is produced by:", "opts": ["The partner with the lower opportunity cost of producing it", "The partner who can make more of it with the same resources", "The partner whose workers earn the lower money wage per hour", "The partner who places the higher value on consuming the good"], "exp": "Comparative advantage is about the lower opportunity cost, not about producing more in absolute terms. It's tempting to pick the bigger producer, but a partner can make more of everything and still be the high opportunity cost producer of one good."}, {"id": 9, "ch": 2, "q": "An economy that chooses more investment goods and fewer consumption goods today will likely:", "opts": ["See its PPC shift outward more in the future", "See its PPC shift inward in the future", "Move to a point inside its PPC", "Have no change in future production possibilities"], "exp": "Investing now (buildings, equipment, training) means greater future output, so the PPC shifts farther out compared with a high-consumption choice.", "retired": true}, {"id": 10, "ch": 2, "q": "Why are people willing to pay middlemen such as grocers, real estate agents, and online marketplaces?", "opts": ["They lower the cost of finding, negotiating, and completing trades", "They produce the physical goods that farmers and factories can't make", "They let buyers avoid paying the opportunity cost of what they buy", "They hold prices fixed so that buyers are protected from scarcity"], "exp": "Middlemen buy and sell or arrange trades, and their value comes from reducing transaction costs. They don't need to produce physical goods to create value: saving buyers' time and effort is a real service."}, {"id": 11, "ch": 2, "q": "Which is **not** one of the elements of private property rights?", "opts": ["A minimum sale price guaranteed by the government", "The right to exclusive use of the property", "Legal protection against people who invade it", "The right to transfer the property to another"], "exp": "Private property rights involve exclusive use, legal protection against invaders, and the right to transfer. A government-guaranteed price is not part of ownership; owners bear the gains and losses of their choices."}, {"id": 12, "ch": 2, "q": "When two people make a voluntary exchange, what does economic reasoning conclude?", "opts": ["Both expect to be better off, or the trade would not take place", "One party's gain must be exactly equal to the other party's loss", "The party with more bargaining power gains at the other's expense", "Neither gains unless new goods are produced as part of the trade"], "exp": "Mutual gain is the foundation of trade: a voluntary exchange happens only if both expect to benefit. Treating trade as one side's gain and the other's loss is the fallacy the Friedmans warned about."}, {"id": 13, "ch": 5, "q": "From the standpoint of economic efficiency, an activity should be carried to the point where:", "opts": ["Its marginal benefit equals its marginal cost", "Its total benefit is as large as it can possibly be", "Its total cost is as small as it can be", "Its average benefit equals its average cost"], "exp": "Expanding an activity is worthwhile as long as the next unit's marginal benefit exceeds its marginal cost, so the efficient level is where MB equals MC. It's tempting to pick maximum total benefit, but pushing that far means producing units whose marginal cost exceeds their marginal benefit."}, {"id": 14, "ch": 5, "q": "When external COSTS (negative externality) are present, the market will produce:", "opts": ["Too many units at too low a price", "Too few units at too high a price", "Too few units at too low a price", "The efficient quantity"], "exp": "The supply curve understates the true cost, so output is too high and price too low. Including all costs shifts supply left (S2): lower Q, higher P.", "retired": true}, {"id": 15, "ch": 5, "q": "When external BENEFITS (positive externality) are present, the market will usually produce:", "opts": ["Too few units", "Too many units", "The efficient quantity", "Nothing at all"], "exp": "The demand curve understates the total value, so units worth more than they cost may not get produced. Counting all benefits shifts demand right.", "retired": true}, {"id": 16, "ch": 5, "q": "The two characteristics that define a public good are:", "opts": ["Nonrival in consumption and nonexcludable", "Provided by government and free of charge to users", "Rival in consumption and nonexcludable", "Nonrival in consumption and excludable"], "exp": "A public good can be enjoyed by many people at once without reducing others' use, and it is costly or impossible to keep nonpayers from using it. Being provided by government is not what makes a good public; it is the good's characteristics, not the sector that produces it."}, {"id": 17, "ch": 5, "q": "A person who enjoys the benefits of a good without helping pay for its cost is called a:", "opts": ["Free rider", "Rent seeker", "Repeat purchaser", "Third party"], "exp": "A free rider receives a good's benefits without contributing to its cost, which is why public goods tend to be underproduced. A rent seeker is someone using the political process to redistribute income toward themselves, a different idea."}, {"id": 18, "ch": 5, "q": "Which of the following is **not** one of the four reasons the invisible hand may fail?", "opts": ["Rent seeking", "Poor information", "Public goods", "Lack of competition"], "exp": "The four reasons markets may fail are lack of competition, externalities, public goods, and poor information. Rent seeking is a source of government failure, covered in the chapter on political action."}, {"id": 19, "ch": 5, "q": "When competition is absent, sellers tend to:", "opts": ["Restrict output and raise prices", "Expand output and lower prices", "Produce the efficient quantity", "Create external benefits"], "exp": "Restricted supply (S2) gives Q2 < Q1 and P2 > P1: too few units at too high a price.", "retired": true}, {"id": 20, "ch": 5, "q": "A legal system that enforces contracts and settles disputes between parties is part of government's:", "opts": ["Protective function", "Productive function", "Regulatory function", "Redistributive function"], "exp": "The protective function covers protecting people and property from aggression, including a legal structure to enforce contracts and settle disputes. The productive function is the provision of goods that are difficult to supply through markets, which is a different role."}, {"id": 21, "ch": 6, "q": "Because a single vote is very unlikely to decide an election, most voters spend little effort learning about issues and candidates. This is the:", "opts": ["Rational ignorance effect", "Special interest effect", "Shortsightedness effect", "Bundle-purchase problem"], "exp": "Gathering information is costly and one vote rarely changes an outcome, so it is rational for most voters to stay uninformed on many issues. The special interest effect is related but describes how small, well-informed groups gain from that voter inattention."}, {"id": 22, "ch": 6, "q": "Representative government is biased toward adopting counterproductive projects when:", "opts": ["Benefits are concentrated and costs are widespread", "Benefits are widespread and costs are concentrated", "Benefits and costs are both widely spread out", "Benefits and costs both fall on a small group"], "exp": "When a small group gains a lot and the cost is spread thinly over many voters, the winners push hard and the losers barely notice, so even inefficient projects pass. Widespread benefits with concentrated costs produce the opposite bias: productive projects tend to be rejected."}, {"id": 23, "ch": 6, "q": "Road project: benefits are Adams $20, Chan $12, Green $4, Lee $2, Diaz $2 (total $40). Under Plan A everyone pays $5 tax. What happens in a majority vote?", "opts": ["It fails 3 to 2, even though it's efficient", "It passes 3 to 2", "It passes unanimously", "It fails unanimously because it's inefficient"], "exp": "Only Adams and Chan gain more than $5. Green, Lee, Diaz vote no, so it fails 3-2 even though total benefits ($40) exceed costs ($25). Under Plan B (taxes proportional to benefits) it passes unanimously.", "retired": true}, {"id": 24, "ch": 6, "q": "Two legislators agree to vote for each other's district projects so that both bills pass. This practice is called:", "opts": ["Logrolling", "Rent seeking", "Crony capitalism", "Rational ignorance"], "exp": "Logrolling is vote trading: each legislator supports the other's project in exchange for support on their own. It strengthens the special interest effect. Rent seeking is broader, describing any effort to reshape policy to redirect income toward oneself."}, {"id": 25, "ch": 6, "q": "Why do politicians find debt financing attractive, according to public choice analysis?", "opts": ["The shortsightedness effect: current benefits now, hard-to-see costs later", "The rational ignorance effect makes debt free", "Debt-financed projects are always efficient", "Bureaucrats prefer smaller budgets"], "exp": "Shortsightedness effect: bias toward clearly defined current benefits with future costs that are hard to identify.", "retired": true}, {"id": 26, "ch": 6, "q": "Efforts by individuals and interest groups to restructure public policy so more income flows to themselves are called:", "opts": ["Rent seeking", "Logrolling", "Pork-barrel spending", "Shortsightedness"], "exp": "Rent seeking uses the political process to redistribute income toward the seeker, and it diverts resources away from productive activities. Logrolling is one tactic legislators use to pass favors, but the term for the income-seeking effort itself is rent seeking."}, {"id": 27, "ch": 6, "q": "The bootlegger-and-Baptist strategy describes:", "opts": ["Self-interested favor seeking packaged as moral behavior", "Moral reformers and business groups openly splitting a subsidy", "Voters trading support across unrelated moral issues", "Regulators siding with consumers against large firms"], "exp": "Opportunistic rent seekers frame their programs around widely supported goals such as child safety or saving family farms, attracting support from idealists, while the real payoff is government favoritism. It's tempting to think the two groups openly share the gains, but the idealists are typically unaware they are serving the special interest."}, {"id": 28, "ch": 6, "q": "The U.S. sugar program (concentrated gains for ~20,000 growers, ~$25 cost per household) illustrates:", "opts": ["The special interest effect", "The rational ignorance effect only", "A public good", "An efficient government program"], "exp": "Large personal benefit for a few + small individual cost spread over many = special interest effect. The program persists even though it's counterproductive.", "retired": true}, {"id": 29, "ch": 6, "q": "Which of the following is a source of **government** failure rather than market failure?", "opts": ["Weak incentives for operational efficiency", "External costs that markets fail to register", "Public goods that invite many free riders", "Sellers restricting output to raise prices"], "exp": "The chapter lists the special interest effect, the shortsightedness effect, rent seeking, and weak incentives for operational efficiency as sources of government failure. Externalities, public goods, and lack of competition are sources of market failure."}, {"id": 30, "ch": 7, "q": "A furniture maker buys lumber and uses it to build tables sold to households. Why does GDP leave out the furniture maker's purchase of the lumber?", "opts": ["The lumber's value is already part of the price of the finished table", "Lumber sold between two businesses is counted under net exports instead", "The furniture maker's purchase is counted as a government purchase", "Business-to-business sales are recorded separately in national income"], "exp": "The lumber is an intermediate good: its value is embodied in the final price of the table, so counting both would double count. It's tempting to say business sales go into some other category, but they are simply excluded; only final-user goods are summed."}, {"id": 31, "ch": 7, "q": "Which item belongs in the resource cost-income approach to GDP rather than in the expenditure approach?", "opts": ["Employee compensation", "Gross private investment", "Exports minus imports", "Government purchases"], "exp": "The expenditure approach adds consumption, gross private investment, government purchases, and net exports. Employee compensation is a cost-income component, along with self-employment income, rents, interest, and corporate profits. Investment is tempting because firms pay for it, but it is spending on final goods, so it is an expenditure item."}, {"id": 32, "ch": 7, "q": "Nominal GDP is $27,361 billion and the GDP deflator is 122.3 (base year = 100). Real GDP in base-year dollars is about:", "opts": ["$22,372 billion", "$33,463 billion", "$27,361 billion", "$24,950 billion"], "exp": "Real GDP = Nominal GDP / (Deflator / 100) = 27,361 / 1.223 = about 22,372. (The 2023 figure in 2017 dollars from your slides.)", "retired": true}, {"id": 33, "ch": 7, "q": "What is the main difference in coverage between the GDP deflator and the consumer price index?", "opts": ["The deflator covers the whole GDP bundle; the CPI tracks household purchases", "The CPI covers the whole GDP bundle; the deflator tracks household purchases", "The deflator tracks capital goods; the CPI tracks consumer services instead", "Both use one identical basket but are published by different agencies"], "exp": "The GDP deflator is the broader index: it reflects the bundle of goods in GDP, while the CPI reflects only the bundle households buy. Students often reverse the two because the CPI is the better-known index, but familiarity does not mean broader coverage."}, {"id": 34, "ch": 7, "q": "Which of these activities adds nothing to measured GDP?", "opts": ["A parent cooking dinner every night for the family", "A family paying a personal chef to prepare their meals", "A restaurant buying a new commercial oven for its kitchen", "A city government paving a neighborhood street"], "exp": "Household production is excluded because no market transaction takes place, even though real value is produced. Paying a cook for the same meals is a market purchase, so it counts. That contrast is why GDP understates total production."}, {"id": 35, "ch": 7, "q": "A hurricane wrecks homes and roads, and a large rebuilding effort follows. How is GDP affected?", "opts": ["No deduction is made for the damage, while rebuilding spending is added", "The damage is subtracted from GDP, while the rebuilding spending is added", "The damage is subtracted from GDP, and rebuilding spending is left out", "Neither the damage nor the rebuilding spending changes measured GDP"], "exp": "GDP measures current production and makes no adjustment for destruction by nature, so the losses are never subtracted while rebuilding counts as new output. It's tempting to think the damage gets subtracted, but GDP has no entry for lost wealth, which is one reason it is an imperfect welfare measure."}, {"id": 36, "ch": 7, "q": "Between 2017 and 2023, nominal GDP rose 39.5%, but real GDP rose only 14.1%. Why?", "opts": ["Prices rose about 22% over the period", "Population fell", "Net exports were negative", "Intermediate goods were excluded"], "exp": "Nominal growth mixes higher output with higher prices. Deflating removes the price increase (deflator went 100 to 122.3).", "retired": true}, {"id": 37, "ch": 8, "q": "Population age 16+ = 250M, employed = 152M, unemployed = 8M. What is the UNEMPLOYMENT rate?", "opts": ["5.0%", "3.2%", "5.3%", "64%"], "exp": "Unemployment rate = unemployed / labor force. Labor force = 152 + 8 = 160M, so 8/160 = 5%. (Dividing by population is a common trap.)", "retired": true}, {"id": 38, "ch": 8, "q": "Same economy: population 16+ = 250M, employed = 152M, unemployed = 8M. What is the LABOR FORCE PARTICIPATION rate?", "opts": ["64%", "60.8%", "95%", "5%"], "exp": "LFPR = labor force / population 16+ = 160 / 250 = 64%. (152/250 = 60.8% is the employment-population ratio.)", "retired": true}, {"id": 39, "ch": 8, "q": "Dana works 20 hours a week for pay at a bookstore and spends her evenings applying for full-time jobs. How is she classified?", "opts": ["Employed", "Unemployed", "Not in the labor force", "Cyclically unemployed"], "exp": "Anyone working for pay at least one hour per week counts as employed, even if they want more hours. Her job search makes unemployed tempting, but the unemployed category is only for people who are not currently employed."}, {"id": 40, "ch": 8, "q": "A full-time college student who isn't working or looking for work is:", "opts": ["Not in the labor force", "Unemployed", "Employed", "Frictionally unemployed"], "exp": "Not working and not seeking work = not in the labor force (same for retirees and homemakers).", "retired": true}, {"id": 41, "ch": 8, "q": "An auto worker is laid off for two weeks while the plant retools and spends the time on vacation, expecting to be called back. How is he classified?", "opts": ["Unemployed", "Employed", "Not in the labor force", "Self-employed"], "exp": "A person on layoff waiting to return to a previous job is counted as unemployed, even if not searching for other work. Not in the labor force is tempting because he is on vacation, but the layoff rule places him in the labor force."}, {"id": 42, "ch": 8, "q": "What is the underlying cause of frictional unemployment?", "opts": ["Imperfect information about available workers and available jobs", "A mismatch between the skills workers have and those jobs require", "A general decline in business activity during a downturn", "Too few total jobs for everyone who would like to work"], "exp": "Frictional unemployment arises because employers do not know about all qualified workers and workers do not know about all openings, so matching takes time. The skills mismatch is structural unemployment, and a general downturn causes cyclical unemployment."}, {"id": 43, "ch": 8, "q": "New production technology sharply cuts the demand for workers with certain skills. Job openings exist, but they call for skills the laid-off workers lack. What type of unemployment is this?", "opts": ["Structural unemployment", "Frictional unemployment", "Cyclical unemployment", "Seasonal unemployment"], "exp": "Structural unemployment comes from changes in products and technology that alter the relative demand for skills, leaving openings that many unemployed workers cannot fill. Frictional is tempting because openings exist, but here more information would not solve the mismatch."}, {"id": 44, "ch": 8, "q": "Which describes an economy operating at full employment?", "opts": ["Frictional and structural unemployment remain, but cyclical does not", "Cyclical and frictional unemployment remain, but structural does not", "The unemployment rate is zero because everyone who wants a job has one", "Actual GDP is below potential GDP because some workers are still idle"], "exp": "Full employment is the level at which unemployment is normal given frictional and structural factors; it matches the natural rate, not zero. Cyclical unemployment is the part that disappears. At full employment, actual and potential output are equal."}, {"id": 45, "ch": 8, "q": "During a recession, which is true?", "opts": ["Actual GDP is below potential GDP", "Actual unemployment is below the natural rate", "Employment exceeds full employment", "Cyclical unemployment is zero"], "exp": "In a recession, actual unemployment rises above the natural rate and actual GDP falls below potential.", "retired": true}, {"id": 46, "ch": 8, "q": "The CPI was 150 at the end of last year and 157.5 at the end of this year. The inflation rate was:", "opts": ["5%", "7.5%", "4.8%", "57.5%"], "exp": "Inflation = (157.5 - 150) / 150 x 100 = 7.5 / 150 = 5%.", "retired": true}, {"id": 47, "ch": 8, "q": "People expected 3% inflation, but prices rose 7%. This is:", "opts": ["Inflation higher than anticipated (unanticipated inflation)", "Anticipated inflation", "Inflation lower than anticipated", "Deflation"], "exp": "Actual exceeded expected, so 4 points of it was a surprise. Unanticipated inflation is what disrupts long-term contracts.", "retired": true}, {"id": 48, "ch": 8, "q": "Starting from the high point, which sequence lists the business cycle phases in the order they occur?", "opts": ["Peak, contraction, recessionary trough, expansion", "Peak, recessionary trough, contraction, expansion", "Peak, expansion, recessionary trough, contraction", "Peak, contraction, expansion, recessionary trough"], "exp": "After a peak or boom, business conditions slow and the contraction phase begins; the bottom is the recessionary trough, followed by expansion back toward the next peak. Students sometimes put the trough before the contraction, but the contraction is the slide that leads to the trough."}, {"id": 49, "ch": 8, "q": "Which of these is **not** one of the reasons high and variable inflation harms an economy?", "opts": ["It makes the payoff on long-term contracts easier to forecast", "It distorts the information that relative prices deliver", "It raises the risk of long-term projects and slows investment", "It shifts effort from producing toward protecting wealth"], "exp": "High inflation is nearly always highly variable and hard to predict, so it makes long-term outcomes harder, not easier, to forecast. The other three are the harms listed: more risk and less investment, distorted price signals, and effort diverted to protecting wealth and income."}, {"id": 50, "ch": 9, "q": "Economists give three reasons the aggregate demand curve slopes downward. Which of the following is **not** one of them?", "opts": ["A lower price level narrows firms' profit margins, so they cut output", "A lower price level raises the purchasing power of a fixed money supply", "A lower price level reduces money demand and lowers the real interest rate", "A lower price level makes domestic goods cheaper relative to foreign goods"], "exp": "The profit-margin argument explains why SRAS slopes upward, not why AD slopes downward. The other three are the AD reasons: greater purchasing power of money, a lower real interest rate, and domestic goods that are cheaper relative to foreign goods. It's tempting to pick the interest rate option because it sounds like a loanable funds idea, but lower money demand at a lower price level is one of the AD channels."}, {"id": 51, "ch": 9, "q": "Why is the long-run aggregate supply (LRAS) curve vertical at the full-employment output rate?", "opts": ["A higher price level does not loosen limits set by resources, technology, and institutions", "Resource prices stay fixed by long-term contracts, so firms are unable to change output", "Buyers purchase the same total quantity of goods regardless of the price level", "Firms earn higher profits at higher price levels and reinvest them to grow their output"], "exp": "YF is set by the resource base, the level of technology, and the efficiency of institutions, none of which change when the price level changes, so a higher price level cannot produce a sustainable increase in output. It's tempting to cite contracts, but contract-fixed prices define the **short** run; in the long run people have had time to adjust."}, {"id": 52, "ch": 9, "q": "In the short run, why do firms supply a larger quantity of output when the price level rises unexpectedly?", "opts": ["Many input costs are locked in by prior contracts, so profit margins widen", "The higher price level expands the economy's resource base and technology", "Households buy more goods because a higher price level raises their wealth", "Firms foresaw the rise and had already built it into their wage contracts"], "exp": "Resource prices such as wages are set by earlier agreements, so an unanticipated rise in product prices improves profitability and firms expand output. If the rise had been fully foreseen, contracts would already reflect it and profit margins would not widen, which is why the SRAS story depends on the change being a surprise."}, {"id": 53, "ch": 9, "q": "The money interest rate is 11% and expected inflation is 5%. The real interest rate is:", "opts": ["6%", "16%", "11%", "2.2%"], "exp": "Real interest rate = money interest rate - inflationary premium = 11% - 5% = 6%.", "retired": true}, {"id": 54, "ch": 9, "q": "If actual inflation turns out HIGHER than anticipated:", "opts": ["Borrowers gain at the expense of lenders", "Lenders gain at the expense of borrowers", "Neither gains, since the interest rate adjusts", "Both gain equally"], "exp": "Borrowers repay with dollars worth less than expected. If inflation is LOWER than anticipated, lenders gain. Correctly anticipated inflation favors neither.", "retired": true}, {"id": 55, "ch": 9, "q": "A firm issued bonds last year paying a fixed 4% interest rate. If interest rates on newly issued bonds rise to 6%, what happens to the market price of the older bonds?", "opts": ["It falls, because the old bonds' fixed payments are now less attractive to buyers", "It rises, because higher interest rates raise the value of interest-paying assets", "It stays the same, because the issuer still owes the original fixed payments", "It rises, because holders of the old bonds will now receive the new 6% rate"], "exp": "Bondholders receive the fixed rate specified on the bond, so when new bonds pay 6%, buyers will take the 4% bonds only at a lower price. Market interest rates and prices of previously issued bonds move in opposite directions. It's tempting to think unchanged payments mean an unchanged price, but the price adjusts precisely because the payments are fixed."}, {"id": 56, "ch": 9, "q": "A country's exchange rate is determined by market forces, and it runs a trade deficit. What must be true of its capital flows?", "opts": ["Capital inflow exceeds capital outflow, so there is a net inflow of capital", "Capital outflow exceeds capital inflow, so there is a net outflow of capital", "Capital inflow equals capital outflow, since the exchange rate clears the market", "The government must run a budget surplus to pay for the extra imports"], "exp": "In foreign exchange equilibrium, imports − exports = capital inflow − capital outflow. A trade deficit makes the left side positive, so net capital inflow on the right side must be positive too. It's tempting to think a market-clearing exchange rate makes capital flows net to zero, but it balances imports plus capital outflow against exports plus capital inflow, not each pair separately."}, {"id": 57, "ch": 9, "q": "When the economy is in long-run equilibrium, which pair of conditions holds?", "opts": ["Actual price level equals the anticipated level; unemployment equals the natural rate", "Actual price level exceeds the anticipated level; unemployment is below the natural rate", "Actual price level equals the anticipated level; the unemployment rate is zero", "Output equals potential GDP; frictional and structural unemployment have disappeared"], "exp": "In long-run equilibrium, people correctly anticipated the price level when they made their agreements, output equals potential GDP, and the actual unemployment rate equals the natural rate. Frictional and structural unemployment are still present; only cyclical unemployment is absent, so a zero unemployment rate is a common trap."}, {"id": 58, "ch": 9, "q": "An unanticipated increase in the price level will, in the short run:", "opts": ["Expand output and employment", "Reduce output and employment", "Have no effect on output", "Permanently increase potential GDP"], "exp": "Real wages and other contracted costs lag, so profits rise and firms expand. In the long run, costs catch up and output returns to potential.", "retired": true}, {"id": 59, "ch": 9, "q": "Using government taxation and spending to achieve macroeconomic goals is:", "opts": ["Fiscal policy", "Monetary policy", "Trade policy", "Rent seeking"], "exp": "Fiscal = taxes and spending. Monetary = control of the money supply and credit conditions.", "retired": true}, {"id": 60, "ch": 9, "q": "A city government sells bonds to savers to pay for a new water treatment plant. In which of the four key macroeconomic markets is this transaction coordinated?", "opts": ["Loanable funds market", "Resource market", "Goods and services market", "Foreign exchange market"], "exp": "Bonds are IOUs, so selling them is borrowing, and the loanable funds market coordinates borrowers and lenders through the interest rate. It's tempting to pick the goods and services market because a plant gets built, but the bond sale itself channels savers' funds to a borrower rather than buying output."}, {"id": 61, "ch": 9, "q": "Are trade deficits necessarily bad?", "opts": ["It depends on whether the borrowed funds go to productive investment", "Yes, always", "No, never", "Only when the exchange rate is fixed"], "exp": "A trade deficit reflects capital inflow (borrowing from foreigners). Productive investment raises future income; funding consumption or unproductive uses lowers it.", "retired": true}, {"id": 62, "ch": 10, "q": "According to the AD–AS model, which of the following would shift the aggregate demand curve to the right?", "opts": ["A decline in the exchange rate value of the nation's currency", "An increase in the real interest rate on loans to business firms", "A shift toward pessimism about future economic conditions", "A decrease in resource prices that lowers production costs"], "exp": "A lower exchange rate value of the currency makes domestic goods cheaper for foreigners and imports pricier at home, so AD increases. A higher real interest rate and growing pessimism shift AD left. It's tempting to pick lower resource prices because they raise output, but they work by shifting SRAS, not AD."}, {"id": 63, "ch": 10, "q": "A decline in the exchange rate value of the dollar will tend to:", "opts": ["Increase AD, because U.S. goods become cheaper to foreigners", "Decrease AD, because imports become cheaper", "Shift LRAS to the right", "Have no effect on AD"], "exp": "A weaker dollar makes U.S. exports cheaper and imports pricier, so net exports and AD rise.", "retired": true}, {"id": 64, "ch": 10, "q": "Which of the following would shift **both** the LRAS and SRAS curves to the right?", "opts": ["Institutional changes that improve the efficiency of resource use", "A season of favorable weather that boosts this year's harvest", "A temporary drop in the world price of a key imported resource", "A reduction in the expected rate of inflation among most businesses"], "exp": "The LRAS shifters are the supply of resources, technology and productivity, and institutional efficiency, and an LRAS shift moves SRAS in the same direction. Favorable weather, cheaper imported resources, and lower expected inflation are SRAS shifters only, because they don't change the economy's sustainable capacity."}, {"id": 65, "ch": 10, "q": "A severe drought cuts this year's crop output, but normal rainfall is expected next year. How does this affect aggregate supply?", "opts": ["SRAS shifts to the left while LRAS stays where it was", "Both SRAS and LRAS shift to the left by the same amount", "LRAS shifts to the left while SRAS stays where it was", "AD shifts to the left as farmers earn less income this year"], "exp": "A temporary unfavorable supply shock reduces current productive capability, so SRAS shifts left, but the economy's long-run capacity is unchanged. It's tempting to shift LRAS too, but LRAS moves only when the change in resources, technology, or institutions is lasting."}, {"id": 66, "ch": 10, "q": "Steady, predictable growth from capital formation and better technology will:", "opts": ["Shift LRAS right without disrupting macro equilibrium", "Cause a recession", "Cause an unsustainable boom", "Shift only SRAS"], "exp": "Anticipated changes let decision makers adjust ahead of time, so equilibrium isn't disrupted. Full-employment output rises from YF1 to YF2.", "retired": true}, {"id": 67, "ch": 10, "q": "In the SHORT run, an unanticipated increase in AD causes:", "opts": ["A higher price level and output above long-run potential", "A lower price level and lower output", "A higher price level with no change in output", "Unemployment above the natural rate"], "exp": "Profit margins temporarily improve, output exceeds potential, and unemployment falls BELOW the natural rate (e.g., P105 and Y2 on the slide).", "retired": true}, {"id": 68, "ch": 10, "q": "In the LONG run, after an unanticipated increase in AD:", "opts": ["Resource prices rise, SRAS shifts left, and output returns to potential at a higher price level", "Output stays permanently above potential", "Resource prices fall and SRAS shifts right", "LRAS shifts right to match the new AD"], "exp": "Contracts get renegotiated, costs rise, SRAS shifts left, and you end at full-employment output with a higher price level (P110). The demand boost only expanded output temporarily.", "retired": true}, {"id": 69, "ch": 10, "q": "After an unanticipated DECREASE in AD, what eventually returns the economy to long-run equilibrium?", "opts": ["Lower resource prices and lower real interest rates", "Higher resource prices and higher real interest rates", "A permanent leftward shift of LRAS", "Nothing; the economy stays in recession permanently"], "exp": "Weak demand lowers resource prices (SRAS shifts right) and real interest rates fall, stimulating AD. Output returns to potential at a lower price level (P90), but it can be a lengthy, painful process.", "retired": true}, {"id": 70, "ch": 10, "q": "An unexpected event that temporarily increases or decreases aggregate supply is a:", "opts": ["Supply shock", "Demand shock", "Fiscal policy", "Shift in LRAS"], "exp": "Supply shocks catch people by surprise. Examples of negative ones: the 2022 Russia-Ukraine war's effect on wheat and energy, Hurricane Katrina.", "retired": true}, {"id": 71, "ch": 10, "q": "A sharp, unexpected rise in the world price of oil will, in the short run:", "opts": ["Shift SRAS left, raising the price level and lowering output", "Shift SRAS right, lowering the price level and raising output", "Shift AD right, raising both price level and output", "Have no effect until LRAS shifts"], "exp": "Higher resource costs shift SRAS left: price level up (P110), output down (Y2). If the shock is permanent, LRAS shifts left too; if temporary, SRAS eventually moves back.", "retired": true}, {"id": 72, "ch": 10, "q": "A temporary bumper crop from good weather would cause:", "opts": ["A lower price level and higher current GDP, with LRAS unchanged", "A higher price level and lower GDP", "A permanent rightward shift in LRAS", "A leftward shift in AD"], "exp": "Favorable, temporary supply shock: SRAS shifts right, price level falls (P95), output rises to Y2. Because it can't be counted on, LRAS stays put.", "retired": true}, {"id": 73, "ch": 10, "q": "Wage contracts and loan agreements in an economy were based on an expected inflation rate of 5%, but actual inflation turns out to be 2%. How will firms tend to respond?", "opts": ["Profits shrink as costs outpace product prices, so firms cut output", "Profits grow as costs fall faster than prices, so firms expand output", "Output stays at YF, because inflation remained positive at 2%", "Firms raise output, because lower inflation increases buyers' wealth"], "exp": "An actual inflation rate below the expected rate is the equivalent of a fall in the price level relative to the costs locked into contracts, so firms incur losses and reduce output. It's tempting to think any positive inflation keeps output at YF, but what matters is the gap between actual and expected inflation."}, {"id": 74, "ch": 10, "q": "According to the AD–AS model, what are the two causes of recessions?", "opts": ["Unanticipated reductions in AD and unfavorable supply shocks", "Anticipated reductions in AD and favorable supply shocks", "Unanticipated increases in AD and unfavorable supply shocks", "Unanticipated reductions in AD and steady, expected growth of LRAS"], "exp": "Recessions occur when prices in the goods and services market are low relative to resource prices and production costs, which results from unanticipated reductions in AD or unfavorable supply shocks. Anticipated changes can be built into contracts ahead of time, so they need not disrupt equilibrium."}, {"id": 75, "ch": 10, "q": "During a recession, what tends to happen to real interest rates, and how does that help the economy recover?", "opts": ["They fall as investment demand weakens, which stimulates AD", "They rise as lenders fear defaults, which stimulates saving", "They fall as investment demand weakens, which shifts LRAS right", "They rise as investment demand weakens, which restrains SRAS"], "exp": "Weak demand for investment in a recession lowers real interest rates, and lower rates stimulate AD and help move the economy back to full employment. Together with falling real resource prices, this is one of the two forces that direct the economy back to long-run equilibrium. It's tempting to link lower rates to LRAS, but this effect works through demand."}, {"id": 76, "ch": 10, "q": "In AD–AS terms, which combination best explains the 2008–2009 recession?", "opts": ["Falling housing and stock prices cut AD while soaring energy prices cut SRAS", "Rising housing and stock prices cut AD while falling energy prices cut SRAS", "Falling housing and stock prices cut LRAS while soaring energy prices cut AD", "Falling housing prices raised AD while falling energy prices raised SRAS"], "exp": "Housing prices fell from the second half of 2006 and stock prices plunged in 2008, reducing wealth and AD; crude oil and energy prices soared in 2007 and early 2008, an unanticipated reduction in SRAS; and sinking confidence reduced AD further. It's tempting to treat the oil price surge as a demand factor, but higher resource prices work through SRAS."}, {"id": 77, "ch": 10, "q": "Which would be MOST likely to throw the U.S. economy into a recession?", "opts": ["An unanticipated drop in AD from a sharp decline in consumer confidence", "Lower transaction costs from the growth of the Internet", "An unanticipated fall in the world price of oil", "Steady, anticipated growth in the capital stock"], "exp": "Unanticipated AD reductions cause recessions. Lower transaction costs and cheaper oil boost supply (cheaper oil hurts oil-producing states, though).", "retired": true}, {"id": 78, "ch": 10, "q": "Over the past six decades of U.S. business cycles, how have the lengths of expansions compared with the lengths of recessions?", "opts": ["Expansions have typically lasted far longer than recessions", "Recessions have typically lasted longer than expansions", "Expansions and recessions have lasted about equally long", "Expansions have grown shorter while recessions lengthened"], "exp": "Expansions have been far lengthier than recessions: the 1990s expansion ran about 120 months and the 2009–2020 expansion about 128 months, while most recessions lasted under a year and the 2007–2009 recession, unusually severe, lasted 18 months. It's tempting to think downturns dominate because they get so much attention, but they have been comparatively brief."}, {"id": 79, "ch": 1, "q": "Why are goods scarce, according to the economic approach?", "opts": ["People want more of them than nature freely provides", "Governments restrict how much firms are allowed to make", "Firms produce them with wasteful production methods", "Their prices are set too high for most buyers to afford"], "exp": "Scarcity exists because our desire for goods far outstrips what nature makes available. High prices are a result of scarcity, not its cause, and scarcity would remain even if firms and governments acted perfectly."}, {"id": 80, "ch": 1, "q": "In economics, which of these counts as capital?", "opts": ["A delivery van a bakery uses for its orders", "The savings balance in a bakery's bank account", "An untouched deposit of iron ore in the ground", "The hours a baker spends shaping loaves of bread"], "exp": "Capital means human-made resources such as machines, tools, and buildings. Money in a bank is tempting because everyday speech calls it capital, but in economics money is not a productive resource. Iron ore is a natural resource and the baker's hours are labor."}, {"id": 81, "ch": 1, "q": "Economists use the term rationing to mean:", "opts": ["Allocating a limited supply among people who want more of it", "Government coupon programs used during wartime shortages", "Producing more of a good until everyone's wants are met", "Holding prices low so that every buyer can afford the good"], "exp": "Rationing is any way of allocating a limited supply among people who want more. Coupons are one method, but so are price and first-come, first-served, and every society must ration because of scarcity."}, {"id": 82, "ch": 1, "q": "When price is used to ration goods, people have a strong incentive to:", "opts": ["Earn income so they can pay the required price", "Wait in long lines", "Avoid working", "Lobby the government for coupons"], "exp": "Price rationing allocates goods to those willing to give up other things. That rewards earning income, which in turn encourages productive activity.", "retired": true}, {"id": 83, "ch": 1, "q": "How many guideposts (key principles) of the economic way of thinking does Gwartney identify?", "opts": ["Eight", "Five", "Ten", "Twelve"], "exp": "Chapter 1 lists eight guideposts: trade-offs, purposeful choice, incentives, marginal decisions, costly information, secondary effects, subjective value, and testing theories by prediction.", "retired": true}, {"id": 84, "ch": 1, "q": "A parcel of land could become a hospital, a parking lot, or stay undeveloped. Guidepost 1 says:", "opts": ["No option is free; choosing one means a trade-off", "Leaving it undeveloped costs nothing", "The hospital is always the best choice", "Government should decide its use"], "exp": "Guidepost 1: the use of scarce resources is costly, so decision-makers face trade-offs. Even 'leaving it alone' gives up the next best use.", "retired": true}, {"id": 85, "ch": 1, "q": "Pizza, lobster, and steak would give you identical benefits, so you pick the pizza because it's cheapest. This illustrates:", "opts": ["Economizing behavior (individuals choose purposefully)", "The fallacy of composition", "Secondary effects", "Value is objective"], "exp": "Guidepost 2: people choose purposefully, trying to get the most from limited resources. With equal benefits, they choose the lowest-cost option.", "retired": true}, {"id": 86, "ch": 1, "q": "A store owner cuts prices to sell off excess inventory, expecting more customers to buy. Which guidepost explains this?", "opts": ["Incentives matter", "Information is costly", "Value is subjective", "Association is not causation"], "exp": "Guidepost 3: changes in incentives influence choices in predictable ways. A lower price is an incentive to buy more.", "retired": true}, {"id": 87, "ch": 1, "q": "According to Guidepost 3, which incentives influence human choices?", "opts": ["Both monetary and nonmonetary incentives", "Only monetary incentives", "Only nonmonetary incentives", "Only incentives created by government"], "exp": "Incentives matter whether they involve money (prices, wages) or not (time, praise, safety, convenience).", "retired": true}, {"id": 88, "ch": 1, "q": "An economist says a firm should decide **at the margin**. This means the firm should focus on:", "opts": ["The added benefit and added cost of a change from where it is now", "The total benefit and total cost of everything it has produced", "The average cost per unit across the output it has made so far", "The fixed costs it must pay no matter how much it produces"], "exp": "Marginal describes the effects of a change in the current situation, such as the cost of one more unit given current facilities and output. Average cost is the common trap: it mixes in past units that the decision can no longer change."}, {"id": 89, "ch": 1, "q": "A producer's marginal cost is:", "opts": ["The cost of producing one additional unit, given its current facility and output", "Total cost divided by the number of units", "The cost of building a new factory", "The fixed cost the firm pays regardless of output"], "exp": "Marginal cost is the change in cost from producing one more unit, starting from the current production rate.", "retired": true}, {"id": 90, "ch": 1, "q": "You compare jeans at a few stores, then stop shopping and buy with the information you have. This reflects which guidepost?", "opts": ["Acquiring information is costly", "Incentives matter", "Value is subjective", "The test of a theory is its ability to predict"], "exp": "Guidepost 5: information helps us choose, but gathering it takes scarce time. At some point more comparison-shopping isn't worth the trouble.", "retired": true}, {"id": 91, "ch": 1, "q": "San Francisco banned plastic grocery bags to help the environment, but reusable bags can gather harmful bacteria. This is an example of:", "opts": ["A secondary effect", "Economizing behavior", "A marginal decision", "Positive economics"], "exp": "Guidepost 6: economic actions often have indirect effects that aren't immediately observable, in addition to their direct effects.", "retired": true}, {"id": 92, "ch": 1, "q": "In public policy, secondary effects are often:", "opts": ["Unintended and overlooked", "The main reason a policy is passed", "Easy to observe immediately", "Always beneficial"], "exp": "Secondary effects are indirect impacts that may not be easily or immediately seen, so policymakers frequently miss them.", "retired": true}, {"id": 93, "ch": 1, "q": "Amir prefers a grass field next to work; Camilla prefers a parking lot and a shorter walk. This illustrates:", "opts": ["Value is subjective and varies with individual preferences", "Association is not causation", "Ceteris paribus", "Incentives don't matter"], "exp": "Guidepost 7: the value of a good depends on each person's preferences, so the same field is worth different amounts to different people.", "retired": true}, {"id": 94, "ch": 1, "q": "'The earth is made of marshmallows' is classified as:", "opts": ["A positive statement, because it is potentially verifiable (even though it's false)", "A normative statement, because it is false", "A normative statement, because it is about the earth", "Neither positive nor normative"], "exp": "Positive statements are about 'what is' and can be tested. They don't have to be correct. Normative statements are about 'what ought to be'.", "retired": true}, {"id": 95, "ch": 1, "q": "A politician backs a well-meaning policy that ends up causing harm. Which pitfall does this illustrate?", "opts": ["Good intentions do not guarantee desirable outcomes", "The fallacy of composition", "Association is not causation", "Violation of ceteris paribus"], "exp": "An unsound proposal leads to bad outcomes even when supporters mean well. Politicians may gain from appearing to address a problem even if the policy is ineffective.", "retired": true}, {"id": 96, "ch": 1, "q": "Cities with more police officers tend to have more crime, so someone concludes police cause crime. This mistake is:", "opts": ["Assuming association is causation", "The fallacy of composition", "Normative reasoning", "Economizing behavior"], "exp": "Pitfall 3: statistical association alone cannot establish causation. Here, high crime more likely causes cities to hire more police.", "retired": true}, {"id": 97, "ch": 1, "q": "Which of these is a macroeconomic question?", "opts": ["Why did the nation's overall unemployment rate rise last year?", "How will a coffee shop's price increase affect its own sales?", "How does a single family decide how much of its income to save?", "Why did one automaker decide to close one of its older plants?"], "exp": "Macroeconomics studies outcomes in highly aggregated markets, such as the economy-wide labor market. The other three are about narrowly defined units, a household or a single firm, which is microeconomics."}, {"id": 98, "ch": 2, "q": "Two students skip the same Friday party to study. Which statement about their opportunity costs is correct?", "opts": ["Their costs can differ, since each values the forgone party differently", "Their costs must be equal, since they gave up the very same event", "Their costs are zero, because the party had no admission charge", "Their costs are measured by the grades they earn from studying"], "exp": "Opportunity costs are subjective and vary across persons, because each person values the forgone alternative differently. It's tempting to think the same event means the same cost, but the cost is in the eye of the chooser."}, {"id": 99, "ch": 2, "q": "If an option becomes more costly, an individual will be:", "opts": ["Less likely to choose it", "More likely to choose it", "Unaffected, since costs are already sunk", "Forced to choose it"], "exp": "Raising the opportunity cost of an option makes it less attractive relative to the alternatives.", "retired": true}, {"id": 100, "ch": 2, "q": "Gwartney splits the opportunity cost of attending college into monetary and non-monetary parts. Which is classified as non-monetary?", "opts": ["The earnings from a job you give up to attend", "The tuition you pay to the college each term", "The price of required textbooks and software", "The fees charged for labs and student services"], "exp": "Gwartney lists tuition and books as monetary costs and forgone earnings as the non-monetary cost. It's tempting to call forgone earnings monetary because they're measured in dollars, but you never actually pay them out; you give them up."}, {"id": 101, "ch": 2, "q": "You get a fantastic job offer right out of high school. Your opportunity cost of attending college:", "opts": ["Rises, so you're less likely to attend", "Falls, so you're more likely to attend", "Stays the same, since tuition didn't change", "Becomes zero"], "exp": "The great job is the alternative you'd give up. A more valuable alternative means a higher opportunity cost of college.", "retired": true}, {"id": 102, "ch": 2, "q": "According to Gwartney, the value of a good or service:", "opts": ["Depends on who uses it and the circumstances of when and where it's used", "Is fixed and objective once the good exists", "Is determined only by its production cost", "Is set by the government"], "exp": "It's wrong to assume goods have a fixed objective value. Value depends on the user, timing, location, and physical traits.", "retired": true}, {"id": 103, "ch": 2, "q": "Even when no additional goods are produced, trade creates value by:", "opts": ["Moving goods from people who value them less to people who value them more", "Ensuring each good is exchanged for one of equal objective value", "Raising prices for everyone", "Making one party better off at the other's expense"], "exp": "Even without producing anything new, trade channels goods to those who value them most, increasing the wealth created by society's resources.", "retired": true}, {"id": 104, "ch": 2, "q": "Milton and Rose Friedman argued that most economic fallacies come from neglecting the fact that:", "opts": ["A voluntary exchange won't take place unless both parties believe they'll benefit", "Prices always rise over time", "Trade is a zero-sum game", "Governments must approve all trades"], "exp": "Mutual gain is the foundation of trade. If both sides didn't expect to gain, the voluntary exchange wouldn't happen.", "retired": true}, {"id": 105, "ch": 2, "q": "Which of these is an example of a transaction cost?", "opts": ["Hours spent searching listings and haggling to buy a used car", "The wages a car factory pays its workers on the assembly line", "The steel and glass used in manufacturing a brand-new car", "The value of a car to its buyer minus the price that was paid"], "exp": "Transaction costs are the time, effort, and other resources needed to search out, negotiate, and complete an exchange. Factory wages and materials are production costs, not costs of making the trade itself."}, {"id": 106, "ch": 2, "q": "How does the Internet affect trade?", "opts": ["It lowers transaction costs, enhancing trade", "It raises transaction costs, reducing trade", "It has no effect on transaction costs", "It eliminates the need for property rights"], "exp": "Online search, reviews, and payment systems make it cheaper to find, negotiate, and complete exchanges, so more mutually beneficial trades happen.", "retired": true}, {"id": 107, "ch": 2, "q": "Property rights are defined as:", "opts": ["The right to use, control, and obtain the benefits from a resource, good, or service", "The right to have the government buy your property", "The right to use anyone's property freely", "The right to set any price the market will not bear"], "exp": "Private property rights involve exclusive use, legal protection against invaders, and the right to transfer to another.", "retired": true}, {"id": 108, "ch": 2, "q": "Why do private owners tend to conserve resources for the future?", "opts": ["They gain if the property is expected to increase in value", "The law requires them to", "They don't bear any costs of using it up", "Government pays them to"], "exp": "Private owners capture the future value of what they own, so conserving it pays off, especially when it's expected to appreciate.", "retired": true}, {"id": 109, "ch": 2, "q": "Private property encourages owners to use resources in ways that benefit others because owners:", "opts": ["Gain by serving others and bear the opportunity cost of ignoring others' wishes", "Are required to share profits with neighbors", "Can't sell their property", "Receive government subsidies for doing so"], "exp": "If an owner ignores what others value, they lose the income those others would have paid. That cost pushes owners toward uses others value.", "retired": true}, {"id": 110, "ch": 2, "q": "Which is **not** an assumption used in drawing a production possibilities curve (PPC)?", "opts": ["Resources expand during the period", "The amount of resources is fixed", "Technical knowledge is held given", "Resources are fully and efficiently used"], "exp": "A PPC assumes fixed resources, given technology, and full, efficient use. If resources expanded, the whole curve would shift outward instead of the economy moving along a single curve."}, {"id": 111, "ch": 2, "q": "The slope of the production possibilities curve shows:", "opts": ["How much of one good must be given up to produce more of the other", "The total value of all output", "The price of each good", "How much labor is unemployed"], "exp": "The slope is the opportunity cost of producing more of one product, measured in units of the other.", "retired": true}, {"id": 112, "ch": 2, "q": "With 10 hours of study, Susan can get a B in English and a B in economics, or an A in English and a D in economics. Her opportunity cost of raising English from B to A is:", "opts": ["Her economics grade falling from B to D", "Nothing, since study time is free", "Her English grade falling from A to B", "Studying more than 10 hours"], "exp": "Moving along her PPC from T to U, she gains in English only by shifting hours away from economics. The lost economics grade is the opportunity cost.", "retired": true}, {"id": 113, "ch": 2, "q": "Which of these could shift a country's PPC outward?", "opts": ["An improvement in the rules under which the economy functions", "Moving workers from farming to manufacturing", "Leaving some factories idle", "Higher prices for consumer goods"], "exp": "The four outward shifters are: more resources, better technology, improved rules (institutions), and working harder by giving up leisure.", "retired": true}, {"id": 114, "ch": 2, "q": "Which best describes an entrepreneur?", "opts": ["Someone who decides what resources to use, how to combine them, and what to make", "Someone who lends money to businesses in return for regular interest payments", "Someone who buys and resells goods to cut other people's costs of trading", "Someone hired by a firm's owners to run its day-to-day operations for a salary"], "exp": "An entrepreneur decides which resources to use, how to combine them, and what to produce. Buying and reselling to cut trading costs describes a middleman, a different role in Gwartney's chapter."}, {"id": 115, "ch": 2, "q": "Within the production possibilities framework, economic growth appears as:", "opts": ["The curve itself shifting outward as time passes", "A move from a point inside the curve onto the curve", "A move along the curve toward more capital goods", "A steeper slope at each point on the existing curve"], "exp": "Economic growth is an outward shift of the curve through time, and the faster it shifts, the faster the growth. Moving from inside onto the curve is tempting, but that only uses existing resources more fully; it doesn't expand what is possible."}, {"id": 116, "ch": 5, "q": "Economists use efficiency to judge actions because efficient use of resources implies:", "opts": ["The maximum value of output from the resource base", "The lowest possible prices", "Equal incomes for everyone", "Zero pollution"], "exp": "Efficiency means getting the most value from limited resources: undertaking actions whose benefits exceed costs and avoiding those whose costs exceed benefits.", "retired": true}, {"id": 117, "ch": 5, "q": "At an output level where marginal benefit EXCEEDS marginal cost, the activity should be:", "opts": ["Expanded, because worthwhile units aren't being undertaken", "Reduced, because too much is being produced", "Left unchanged, because it's efficient", "Stopped entirely"], "exp": "If MB > MC, the next unit adds more value than it costs. Expanding until MB = MC captures those gains.", "retired": true}, {"id": 118, "ch": 5, "q": "At an output level where marginal cost EXCEEDS marginal benefit:", "opts": ["Units are being produced that cost more than they're worth, so output is too high", "Output is too low", "The activity is efficient", "Marginal benefit must rise"], "exp": "Producing units where MC > MB wastes resources. Efficiency requires cutting back to where MB = MC.", "retired": true}, {"id": 119, "ch": 5, "q": "\"If it's worth doing, it's worth doing imperfectly.\" In economic terms this means:", "opts": ["Beyond some point, the gain from doing a task better is less than the cost", "Tasks worth doing should be done as cheaply as possible, whatever the result", "Government programs should stop short of perfection, but personal choices need not", "A worthy goal justifies any cost once its total benefit exceeds its total cost"], "exp": "Economics is about trade-offs: at some point the extra gain from improving something further is not worth the extra cost, so it makes sense to stop short of perfection. The principle applies in every sector, personal and governmental alike, so the option exempting personal choices gets it backward."}, {"id": 120, "ch": 5, "q": "From an efficiency standpoint, eliminating ALL air and water pollution:", "opts": ["Generally doesn't make sense, because the cost of removing the last bits would exceed the benefit", "Always makes sense, because pollution is harmful", "Is required for efficiency", "Has no cost"], "exp": "Like making the highest possible grade or zero traffic fatalities, perfection is rarely worth its cost. The efficient level is where MB = MC.", "retired": true}, {"id": 121, "ch": 5, "q": "In the text's framework, providing a stable monetary and financial environment belongs with which government role?", "opts": ["Productive function, alongside goods hard to supply through markets", "Protective function, alongside enforcing contracts and property rights", "Protective function, alongside defense against acts of aggression", "Neither function; it is left to private banks and markets to supply"], "exp": "The slides list a stable monetary and financial environment under the productive function, which provides a limited set of goods that are hard to supply through markets. It's tempting to file it under protection because it supports markets, but the protective function is about guarding people and property and enforcing rules."}, {"id": 122, "ch": 5, "q": "The most fundamental function of government is:", "opts": ["Protecting individuals and their property against acts of aggression", "Producing consumer goods", "Setting prices in markets", "Redistributing income"], "exp": "The protective function includes maintaining a legal structure that enforces contracts and settles disputes.", "retired": true}, {"id": 123, "ch": 5, "q": "If producers can restrict supply or limit entry into a market, compared to the competitive outcome:", "opts": ["Output will be lower and price will be higher", "Output will be higher and price will be lower", "Output and price will both be higher", "Nothing changes"], "exp": "With restricted supply (S2), output falls from Q1 to Q2 and price rises from P1 to P2: too few units at too high a price.", "retired": true}, {"id": 124, "ch": 5, "q": "External costs such as pollution arise mainly because:", "opts": ["Property rights are poorly defined or weakly enforced", "Producers charge prices well above the competitive level", "Consumers lack information about product quality", "Goods are nonrival in consumption and nonexcludable"], "exp": "External costs occur when actions harm others' property without their consent, which happens when property rights are imperfectly defined or enforced. Above-competitive prices describe a lack of competition, and nonrival, nonexcludable goods describe public goods, which are separate sources of market failure."}, {"id": 125, "ch": 5, "q": "When external costs are present, the market supply curve:", "opts": ["Understates the true cost of production", "Overstates the true cost of production", "Accurately reflects all costs", "Becomes vertical"], "exp": "Since some costs fall on others, producers don't count them. Units get produced that are worth less than their full cost.", "retired": true}, {"id": 126, "ch": 5, "q": "When it isn't realistic to define property rights (many people are affected), what may be the best way to handle external costs such as emissions?", "opts": ["Government regulations requiring devices that limit emissions", "Doing nothing, since markets always correct themselves", "Banning all production", "Subsidizing the polluting firms"], "exp": "Defining and enforcing property rights works with few parties. With large numbers, emission-limiting regulations, or creative arrangements, may be the best option.", "retired": true}, {"id": 127, "ch": 5, "q": "When an activity creates external benefits, the market demand curve:", "opts": ["Understates the total value of the output", "Overstates the total value of the output", "Understates the true cost of the output", "Shifts right on its own to reflect outside benefits"], "exp": "With external benefits, some of the value goes to nonparticipants, so the demand curve of buyers understates the output's total value and too few units are produced. Understating true cost describes the supply curve when external costs are present, a common mix-up."}, {"id": 128, "ch": 5, "q": "If all external benefits were counted, the demand curve would shift to D2. Compared with the market outcome, output and price would be:", "opts": ["Output higher and price higher", "Output lower and price lower", "Output higher and price lower", "Unchanged"], "exp": "Counting all benefits raises demand, so output rises from Q1 to Q2 and price rises from P1 to P2. The market alone
