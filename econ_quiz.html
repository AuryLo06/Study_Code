phics (like the share of young workers) and public policy (like unemployment benefits)", "Only the money supply", "Only the inflation rate", "Nothing; it's fixed forever"], "exp": "The natural rate reflects job shopping in a dynamic economy. It's achievable and sustainable, and it changes with demographics and policy."}, {"id": 176, "ch": 8, "q": "True or false: when full employment is present, the unemployment rate will be zero.", "opts": ["False: frictional and structural unemployment remain", "True: everyone has a job", "True: only cyclical unemployment remains", "False: cyclical unemployment is at its highest"], "exp": "Full employment means unemployment is at its natural rate, with normal job search and skill mismatches still present."}, {"id": 177, "ch": 8, "q": "Potential output is:", "opts": ["The maximum sustainable output consistent with the economy's resource base and institutions", "The highest output ever reached, even briefly", "Output when unemployment is zero", "Output during a recession"], "exp": "Actual and potential output are equal when the economy is at full employment."}, {"id": 178, "ch": 8, "q": "According to economists, what causes inflation?", "opts": ["Aggregate demand rising faster than supply, and rapid growth of the money supply", "Falling aggregate demand", "Low unemployment benefits", "Rising productivity"], "exp": "Prices rise when there is 'too much money chasing too few goods.' Nearly all economists link rapid money growth to inflation."}, {"id": 179, "ch": 9, "q": "Which is NOT one of the four key markets that coordinate the circular flow?", "opts": ["The housing market", "The goods and services market", "The loanable funds market", "The foreign exchange market"], "exp": "The four markets are goods and services, resources, loanable funds, and foreign exchange."}, {"id": 180, "ch": 9, "q": "Monetary policy is:", "opts": ["The deliberate control of the money supply (and sometimes credit conditions) to achieve macroeconomic goals", "The use of taxes and government spending to achieve macro goals", "Government rules on bank fees", "Setting the exchange rate by law"], "exp": "Fiscal policy uses taxes and spending. Monetary policy uses the money supply. The basic model initially holds both constant."}, {"id": 181, "ch": 9, "q": "The aggregate demand curve shows:", "opts": ["The quantities of domestically produced goods and services buyers will purchase at different price levels", "The total supply of goods at each price level", "The demand for money at each interest rate", "Demand for imported goods only"], "exp": "AD slopes downward: a lower price level means a larger quantity of goods and services demanded."}, {"id": 182, "ch": 9, "q": "In macroeconomics, the 'short run' is a period during which:", "opts": ["Some prices, especially in resource markets, are fixed by prior contracts", "All prices adjust instantly", "Output can't change", "Technology improves"], "exp": "Because some prices are locked in, people can't immediately adjust to unexpected changes in the price level. In the long run they can."}, {"id": 183, "ch": 9, "q": "If the price level is ABOVE the short-run equilibrium level (where AD meets SRAS):", "opts": ["Excess supply will push prices down", "Excess demand will push prices up", "Output will rise to meet demand", "The economy is in long-run equilibrium"], "exp": "Above equilibrium, sellers want to supply more than buyers want, so prices fall. Below it, excess demand pushes prices up."}, {"id": 184, "ch": 9, "q": "About what share of U.S. production costs are labor costs?", "opts": ["About 70%", "About 10%", "About 30%", "About 95%"], "exp": "Labor is by far the largest component of the resource market."}, {"id": 185, "ch": 9, "q": "From a lender's viewpoint, interest is:", "opts": ["A premium received for waiting (delaying current spending)", "The cost paid for earlier availability", "A tax paid to the government", "The inflation rate"], "exp": "For borrowers, interest is the cost of getting funds earlier. For lenders, it's the reward for waiting."}, {"id": 186, "ch": 9, "q": "The difference between the money interest rate and the real interest rate is the:", "opts": ["Inflationary premium", "Risk premium", "Exchange rate", "Profit margin"], "exp": "The inflationary premium reflects the expected decline in the dollar's purchasing power while the loan is outstanding."}, {"id": 187, "ch": 9, "q": "If actual inflation turns out LOWER than anticipated:", "opts": ["Lenders gain at the expense of borrowers", "Borrowers gain at the expense of lenders", "Neither gains nor loses", "Both gain equally"], "exp": "Borrowers repay with dollars worth more than expected, and the inflation premium they paid turns out too high."}, {"id": 188, "ch": 9, "q": "When domestic demand for loanable funds is weak and the real interest rate is low:", "opts": ["Capital flows out toward markets with higher expected returns", "Capital flows in from abroad", "Interest rates must rise immediately", "The trade deficit grows"], "exp": "Investors seek the best returns globally. Strong domestic demand and high rates attract a capital inflow instead."}, {"id": 189, "ch": 9, "q": "In recent years, much of the capital inflow to the U.S. has financed federal deficits. The result has been:", "opts": ["Higher current consumption and lower investment, slowing growth", "Higher investment and faster growth", "A trade surplus", "Lower federal spending"], "exp": "Borrowing to support current consumption reduces capital formation. Like a family, a nation can't solve financial problems by borrowing more to keep consuming."}, {"id": 190, "ch": 9, "q": "If the U.S. dollar appreciates against the euro:", "opts": ["Fewer dollars are needed to buy a euro, and net exports tend to fall", "More dollars are needed to buy a euro, and net exports rise", "Fewer dollars are needed to buy a euro, and net exports rise", "Nothing happens to net exports"], "exp": "A stronger dollar makes foreign goods cheaper for Americans and U.S. goods pricier for foreigners, so imports rise and exports fall."}, {"id": 191, "ch": 9, "q": "If the inflation rate increases and stays higher for a long time, what happens to interest rates?", "opts": ["The nominal rate rises; the real rate stays about the same", "The real rate rises; the nominal rate stays the same", "Both fall", "Neither changes"], "exp": "Once higher inflation is expected, lenders add a bigger inflation premium (e.g., 6% real + 5% expected inflation = 11% nominal)."}, {"id": 192, "ch": 10, "q": "An 'anticipated' change in the economy is one that:", "opts": ["Is fully expected, so decision makers can adjust before it occurs", "Catches people by surprise", "Only affects the long run", "Is caused by government"], "exp": "Unanticipated changes catch people by surprise and disrupt equilibrium. Anticipated ones are built into plans and contracts."}, {"id": 193, "ch": 10, "q": "An increase in the EXPECTED rate of inflation will tend to:", "opts": ["Increase aggregate demand", "Decrease aggregate demand", "Shift LRAS to the right", "Have no effect on AD"], "exp": "If people expect prices to rise, they buy more now, shifting AD right. Expected inflation also reduces SRAS, since resource costs rise."}, {"id": 194, "ch": 10, "q": "Higher real incomes in other countries will:", "opts": ["Increase U.S. aggregate demand, since foreigners buy more U.S. exports", "Decrease U.S. aggregate demand", "Shift U.S. LRAS left", "Have no effect on the U.S."], "exp": "Richer foreigners demand more U.S. goods, raising net exports and AD."}, {"id": 195, "ch": 10, "q": "A reduction in EXPECTED inflation would:", "opts": ["Shift SRAS to the right, without changing LRAS", "Shift LRAS to the right", "Shift both LRAS and SRAS to the left", "Shift AD to the right"], "exp": "SRAS shifters include resource prices, expected inflation, and supply shocks. LRAS depends on resources, technology, and institutions. It would also tend to shift AD to the left, not right, since lower expected inflation reduces current buying."}, {"id": 196, "ch": 10, "q": "If an adverse supply shock (like a higher oil price) turns out to be PERMANENT:", "opts": ["LRAS shifts left and the economy's productive potential shrinks", "The economy returns to its original equilibrium", "LRAS shifts right", "Only AD is affected"], "exp": "A temporary shock fades as resource prices fall back. A permanent one reduces potential output, so LRAS shifts left."}, {"id": 197, "ch": 10, "q": "When the actual and expected rates of inflation are equal:", "opts": ["Inflation is built into contracts, and relative prices between resource and product markets don't change", "Firms earn unusually high profits and expand output", "Firms incur losses and cut output", "Unemployment rises above the natural rate"], "exp": "Correctly anticipated inflation raises all prices together, so profit margins and output aren't disrupted."}, {"id": 198, "ch": 10, "q": "According to the AD-AS model, the two causes of economic BOOMS are:", "opts": ["Unanticipated increases in AD and favorable supply shocks", "Anticipated increases in AD and higher taxes", "Higher resource prices and lower real wealth", "Unfavorable supply shocks and falling AD"], "exp": "Booms happen when goods prices are high relative to resource prices and costs. Recessions are the mirror image."}, {"id": 199, "ch": 10, "q": "After a temporary favorable supply shock, people who know their high income won't last tend to:", "opts": ["Save more, which can lower interest rates and boost capital formation", "Spend all of the extra income immediately", "Borrow more", "Stop working"], "exp": "Since the higher income is temporary, saving rises. With an unfavorable shock, households may dip into past savings instead."}], "names": {"1": "The Economic Approach", "2": "Some Tools of the Economist", "5": "Difficult Cases for the Market & Role of Government", "6": "The Economics of Political Action", "7": "Taking the Nation's Economic Pulse (GDP)", "8": "Fluctuations, Unemployment & Inflation", "9": "Basic Macroeconomic Markets", "10": "Dynamic Change & the AD-AS Model"}};
const QS = DATA.qs, NAMES = DATA.names;
const KEY = "econQuizMissed_v1";
const $ = id => document.getElementById(id);

function loadMissed(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY)||"[]")); }catch(e){ return new Set(); } }
function saveMissed(s){ try{ localStorage.setItem(KEY, JSON.stringify([...s])); }catch(e){} }
let missed = loadMissed();

const chapters = [...new Set(QS.map(q=>q.ch))].sort((a,b)=>a-b);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function show(id){ ["home","quiz","results"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }

/* home */
$("chips").innerHTML = chapters.map(c=>{
  const n = QS.filter(q=>q.ch===c).length;
  return `<label class="chip" title="${NAMES[c]}"><input type="checkbox" value="${c}" checked><span>Ch. ${c} <small>(${n})</small></span></label>`;
}).join("");
function picked(){ return [...document.querySelectorAll("#chips input:checked")].map(i=>+i.value); }
function refreshHome(){
  const p = picked(); const n = QS.filter(q=>p.includes(q.ch)).length;
  $("count").textContent = n ? `${n} questions selected.` : "Select at least one chapter to start.";
  $("start").disabled = !n;
  const w = missed.size;
  $("weakText").textContent = w ? `${w} question${w===1?"":"s"} you've missed and haven't nailed yet. They're saved in this browser.` : "No weak spots yet. Questions you miss will show up here.";
  $("startWeak").disabled = !w; $("clearWeak").disabled = !w; $("saveWeak").disabled = !w;
  $("saveNote").classList.add("hidden");
}
$("chips").addEventListener("change", refreshHome);
$("selAll").onclick = ()=>{ document.querySelectorAll("#chips input").forEach(i=>i.checked=true); refreshHome(); };
$("selNone").onclick = ()=>{ document.querySelectorAll("#chips input").forEach(i=>i.checked=false); refreshHome(); };
$("start").onclick = ()=> startRound(QS.filter(q=>picked().includes(q.ch)).map(q=>q.id));
$("startWeak").onclick = ()=> startRound([...missed]);
$("weakAfter").onclick = ()=> startRound([...missed]);
$("clearWeak").onclick = ()=>{ if(confirm("Clear all saved weak spots?")){ missed = new Set(); saveMissed(missed); refreshHome(); } };
$("again").onclick = ()=>{ refreshHome(); show("home"); };

/* save weak spots as a text file for a notes app */
function weakNotes(){
  const date = new Date().toLocaleDateString(undefined, {year:"numeric", month:"long", day:"numeric"});
  const qs = [...missed].map(i=>QS[i]).filter(Boolean).sort((a,b)=>a.ch-b.ch || a.id-b.id);
  let out = `Macro practice quiz: weak spots\nSaved ${date} · ${qs.length} question${qs.length===1?"":"s"}\n`;
  let ch = null, n = 0;
  for(const q of qs){
    if(q.ch !== ch){ ch = q.ch; out += `\n=== Ch. ${ch}: ${NAMES[ch]} ===\n`; }
    out += `\n${++n}. ${q.q}\n   Answer: ${q.opts[0]}\n   Why: ${q.exp}\n`;
  }
  return out;
}
async function saveWeak(noteId){
  if(!missed.size) return;
  track("saved-to-notes", "Saved weak spots to notes");
  const text = weakNotes();
  const name = `macro-weak-spots-${new Date().toISOString().slice(0,10)}.txt`;
  const note = $(noteId);
  const say = msg => { note.textContent = msg; note.classList.remove("hidden"); };
  const file = new File([text], name, {type:"text/plain"});
  // On phones and tablets, open the share sheet so it can go straight into Notes.
  if(matchMedia("(pointer: coarse)").matches && navigator.share){
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:"Macro weak spots"});
      else await navigator.share({title:"Macro weak spots", text});
      say("Shared. Pick your notes app from the share menu.");
      return;
    }catch(e){
      if(e.name === "AbortError") return;
    }
  }
  const url = URL.createObjectURL(file);
  const a = Object.assign(document.createElement("a"), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  say(`Downloaded ${name}. Open it or drag it into your notes app.`);
}
$("saveWeak").onclick = ()=> saveWeak("saveNote");
$("saveWeakAfter").onclick = ()=> saveWeak("saveNoteAfter");
$("quit").onclick = finish;

/* quiz state */
let queue=[], firstSeen=new Set(), firstRight=0, perCh={}, answered=false, cur=null, curOpts=[], done=0, total=0;

function startRound(ids){
  ids = ids.filter(i=>QS[i]);
  if(!ids.length) return;
  queue = shuffle(ids.slice()); firstSeen = new Set(); firstRight = 0; perCh = {}; done = 0; total = queue.length;
  track("round-started", "Round started");
  show("quiz"); nextQ();
}
function nextQ(){
  if(!queue.length){ finish(); return; }
  cur = QS[queue.shift()]; answered = false;
  curOpts = shuffle(cur.opts.map((t,i)=>({t, right:i===0})));
  $("tag").innerHTML = `<b>Ch. ${cur.ch}</b> ${NAMES[cur.ch]}`;
  $("meter").style.width = (100*done/Math.max(total,1))+"%";
  $("qtext").textContent = cur.q;
  const letters="ABCD";
  $("opts").innerHTML = curOpts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${letters[i]}</span><span></span></button>`).join("");
  [...$("opts").children].forEach((b,i)=>{ b.lastChild.textContent = curOpts[i].t; b.onclick = ()=>answer(i); });
  $("fb").classList.add("hidden"); $("next").classList.add("hidden");
  $("opts").firstChild.focus({preventScroll:true});
}
function answer(i){
  if(answered) return; answered = true;
  const ok = curOpts[i].right;
  [...$("opts").children].forEach((b,j)=>{
    b.disabled = true;
    if(curOpts[j].right) b.classList.add("right");
    else if(j===i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const first = !firstSeen.has(cur.id);
  if(first){
    firstSeen.add(cur.id);
    const r = perCh[cur.ch] || [0,0]; perCh[cur.ch] = [r[0]+(ok?1:0), r[1]+1];
    if(ok){ firstRight++; missed.delete(cur.id); }
  }
  if(ok){ done++; } else { missed.add(cur.id); queue.push(cur.id); }
  saveMissed(missed);
  const fb = $("fb");
  fb.className = "feedback" + (ok ? "" : " no");
  fb.innerHTML = `<strong>${ok ? "Correct." : "Not quite."}</strong><span></span>` + (ok ? "" : `<p class="retry-note">This one will come back later in the round.</p>`);
  fb.querySelector("span").textContent = cur.exp;
  $("meter").style.width = (100*done/Math.max(total,1))+"%";
  $("next").textContent = queue.length ? "Next question" : "See results";
  $("next").classList.remove("hidden"); $("next").focus({preventScroll:true});
}
$("next").onclick = nextQ;

function finish(){
  const n = firstSeen.size;
  if(!n){ refreshHome(); show("home"); return; }
  if(queue.length) track("round-ended-early", "Round ended early");
  else track("round-finished", "Round finished");
  const pct = Math.round(100*firstRight/n);
  $("score").textContent = pct + "%";
  $("scoreNote").textContent = `${firstRight} of ${n} right on the first try. Chapters under 75% are marked in orange.`;
  $("bars").innerHTML = Object.keys(perCh).map(Number).sort((a,b)=>a-b).map(c=>{
    const [r,s] = perCh[c]; const p = Math.round(100*r/s);
    return `<div class="bar ${p<75?"low":""}" title="${NAMES[c]}"><span>Ch. ${c}</span><div class="track"><div class="fill" style="width:${p}%"></div></div><span class="n">${r}/${s}</span></div>`;
  }).join("");
  $("weakAfter").disabled = !missed.size;
  $("weakAfter").textContent = missed.size ? `Practice weak spots (${missed.size})` : "No weak spots";
  $("saveWeakAfter").disabled = !missed.size;
  $("saveNoteAfter").classList.add("hidden");
  show("results");
}

document.addEventListener("keydown", e=>{
  if($("quiz").classList.contains("hidden")) return;
  const k = e.key.toLowerCase();
  const map = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  if(!answered && k in map && map[k] < curOpts.length){ e.preventDefault(); answer(map[k]); }
  else if(answered && k==="enter" && document.activeElement !== $("next")){ e.preventDefault(); nextQ(); }
});

/* anonymous usage stats (GoatCounter): no names, no answers, no scores */
function track(path, title){
  try{ if(window.goatcounter && goatcounter.count) goatcounter.count({path, title, event:true}); }catch(e){}
}
// Time spent: count only while the quiz tab is on screen, and report one bucket
// the first time the visitor leaves (switches tabs, locks the phone, closes it).
let activeMs = 0, shownAt = document.visibilityState === "visible" ? Date.now() : null, timeSent = false;
function sendTime(){
  if(shownAt !== null){ activeMs += Date.now() - shownAt; shownAt = null; }
  if(timeSent) return;
  timeSent = true;
  const min = activeMs / 60000;
  const bucket = min < 2 ? "0-2" : min < 5 ? "2-5" : min < 10 ? "5-10" : min < 20 ? "10-20" : "20-plus";
  track(`time-in-quiz/${bucket}-min`, `Time in quiz: ${bucket.replace("-plus","+")} min`);
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden") sendTime();
  else if(shownAt === null) shownAt = Date.now();
});
addEventListener("pagehide", sendTime);

refreshHome();
</script>
</body>
</html>
