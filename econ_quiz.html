<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FB; --grid:#E1E8F1; --ink:#1B2B4B; --muted:#5A6A86;
  --demand:#2F6FDB; --supply:#D9661A; --good:#23845A; --bad:#C2363F;
  --card:#FFFFFF; --line:#C9D4E3; --good-bg:#E6F4EC; --bad-bg:#FBEBEC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111827; --grid:#1C2536; --ink:#E6ECF5; --muted:#9AA8BF;
    --demand:#6EA0F5; --supply:#F0934D; --good:#4CC38A; --bad:#F07178;
    --card:#18213A; --line:#2D3A55; --good-bg:#15332A; --bad-bg:#3A1C22;
  }
}
:root[data-theme="dark"]{
  --paper:#111827; --grid:#1C2536; --ink:#E6ECF5; --muted:#9AA8BF;
  --demand:#6EA0F5; --supply:#F0934D; --good:#4CC38A; --bad:#F07178;
  --card:#18213A; --line:#2D3A55; --good-bg:#15332A; --bad-bg:#3A1C22;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:1.0625rem; line-height:1.55; min-height:100vh;
}
main{max-width:40rem; margin:0 auto; padding:1.5rem 1.1rem 4rem}
h1,h2,.display{font-family:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif; font-weight:700; letter-spacing:-0.01em; margin:0}
h1{font-size:clamp(1.9rem,6vw,2.6rem); line-height:1.05}
h2{font-size:1.35rem; line-height:1.2}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,.chip:focus-within{outline:3px solid var(--demand); outline-offset:2px}

/* hero graph */
.hero{display:grid; grid-template-columns:1fr auto; gap:1rem; align-items:end; margin-bottom:1.75rem}
.hero p{color:var(--muted); margin-top:.5rem}
.graph{width:120px; height:110px}
.graph .axis{stroke:var(--ink); stroke-width:2; fill:none}
.graph .d{stroke:var(--demand); stroke-width:3; fill:none; stroke-linecap:round}
.graph .s{stroke:var(--supply); stroke-width:3; fill:none; stroke-linecap:round}
.graph .eq{fill:var(--ink)}
.graph text{font:700 11px "Atkinson Hyperlegible",sans-serif; fill:var(--muted)}

.panel{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:1.25rem}
.stack>*+*{margin-top:1rem}
.row{display:flex; gap:.6rem; flex-wrap:wrap}

.btn{border:2px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:10px; padding:.7rem 1.1rem; font-weight:700}
.btn.ghost{background:transparent; color:var(--ink)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.small{padding:.4rem .75rem; font-size:.9rem}

.chips{display:flex; flex-wrap:wrap; gap:.5rem}
.chip{position:relative}
.chip input{position:absolute; opacity:0; inset:0; cursor:pointer}
.chip span{display:block; border:1.5px solid var(--line); border-radius:999px; padding:.35rem .85rem; font-size:.95rem; background:var(--paper)}
.chip input:checked + span{background:var(--demand); border-color:var(--demand); color:#fff}
.hint{color:var(--muted); font-size:.92rem}

/* question */
.topbar{display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:.75rem}
.meter{height:6px; background:var(--grid); border-radius:3px; overflow:hidden; margin-bottom:1.25rem}
.meter i{display:block; height:100%; background:var(--demand); width:0; transition:width .25s}
.tag{font-size:.9rem; color:var(--muted)}
.tag b{color:var(--supply)}
.qtext{font-size:1.2rem; font-weight:700; line-height:1.4; margin-bottom:1rem}
.opts{display:grid; gap:.6rem}
.opt{display:flex; gap:.75rem; align-items:flex-start; text-align:left; width:100%;
  background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:.75rem .9rem}
.opt .k{flex:none; width:1.6rem; height:1.6rem; border-radius:50%; border:1.5px solid var(--line);
  display:grid; place-items:center; font-weight:700; font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--demand)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good); background:var(--good-bg)}
.opt.right .k{background:var(--good); border-color:var(--good); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad); border-color:var(--bad); color:#fff}
.opt.dim{opacity:.55}
.feedback{margin-top:1rem; border-left:4px solid var(--good); padding:.6rem .9rem; background:var(--good-bg); border-radius:0 8px 8px 0}
.feedback.no{border-color:var(--bad); background:var(--bad-bg)}
.feedback strong{display:block; margin-bottom:.2rem}
.retry-note{color:var(--muted); font-size:.9rem; margin-top:.5rem}
.next{margin-top:1rem; width:100%}

/* results */
.score{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:3.5rem; line-height:1}
.bars{display:grid; gap:.55rem}
.bar{display:grid; grid-template-columns:3.2rem 1fr 3.4rem; gap:.6rem; align-items:center; font-size:.95rem}
.bar .track{height:10px; background:var(--grid); border-radius:5px; overflow:hidden}
.bar .fill{height:100%; background:var(--good)}
.bar.low .fill{background:var(--supply)}
.bar .n{text-align:right; color:var(--muted)}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){ .meter i{transition:none} }
</style>
<script data-goatcounter="https://aurylo06.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <!-- HOME -->
  <section id="home">
    <div class="hero">
      <div>
        <h1>Macro practice quiz</h1>
        <p>Gwartney 18e, chapters 1, 2 and 5–10. Missed questions come back until you get them right.</p>
      </div>
      <svg class="graph" viewBox="0 0 120 110" aria-hidden="true">
        <path class="axis" d="M12 4 V98 H116"/>
        <path class="d" d="M20 16 L104 90"/>
        <path class="s" d="M20 90 L104 16"/>
        <circle class="eq" cx="62" cy="53" r="5"/>
        <text x="106" y="96">Q</text><text x="2" y="12">P</text>
      </svg>
    </div>

    <div class="stack">
      <div class="panel stack">
        <h2>Pick chapters</h2>
        <div class="chips" id="chips"></div>
        <div class="row">
          <button class="btn small ghost" id="selAll">Select all</button>
          <button class="btn small ghost" id="selNone">Clear</button>
        </div>
        <p class="hint" id="count"></p>
        <button class="btn" id="start">Start quiz</button>
      </div>

      <div class="panel stack">
        <h2>Weak spots</h2>
        <p class="hint" id="weakText"></p>
        <div class="row">
          <button class="btn" id="startWeak">Practice weak spots</button>
          <button class="btn ghost" id="saveWeak">Save to notes</button>
          <button class="btn ghost" id="clearWeak">Clear weak spots</button>
        </div>
        <p class="hint hidden" id="saveNote" role="status" aria-live="polite"></p>
      </div>
      <p class="hint">Keyboard: press 1–4 or A–D to answer, Enter for the next question. <a href="./" style="color:var(--demand)">How this quiz works</a></p>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="topbar">
      <span class="tag" id="tag"></span>
      <button class="btn small ghost" id="quit">End quiz</button>
    </div>
    <div class="meter"><i id="meter"></i></div>
    <div class="panel">
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div id="fb" class="feedback hidden" role="status" aria-live="polite"></div>
      <button class="btn next hidden" id="next">Next question</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden stack">
    <h1>Round finished</h1>
    <div class="panel stack">
      <div><span class="score" id="score"></span></div>
      <p class="hint" id="scoreNote"></p>
      <div class="bars" id="bars"></div>
    </div>
    <div class="row">
      <button class="btn" id="again">Back to start</button>
      <button class="btn ghost" id="weakAfter">Practice weak spots</button>
      <button class="btn ghost" id="saveWeakAfter">Save to notes</button>
    </div>
    <p class="hint hidden" id="saveNoteAfter" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
const DATA = {"qs": [{"id": 0, "ch": 1, "q": "What is the opportunity cost of a choice?", "opts": ["The highest valued alternative that is sacrificed", "The total dollar price paid for the option", "The sum of all alternatives given up", "The cost of acquiring information about the option"], "exp": "Opportunity cost is the single highest-valued alternative you give up, not the sum of all alternatives. It's subjective and varies across people."}, {"id": 1, "ch": 1, "q": "Which statement is NORMATIVE?", "opts": ["The inflation rate should be lower.", "The inflation rate rises when the money supply is increased.", "The earth is made of marshmallows.", "If gas prices rise, people will buy less gas."], "exp": "Normative = 'what ought to be' (should/ought), can't be proven true or false. Positive statements are testable even if false, like the marshmallow one."}, {"id": 2, "ch": 1, "q": "Assuming that what is true for an individual must also be true for the whole group is called:", "opts": ["The fallacy of composition", "Violation of ceteris paribus", "Association is not causation", "The secondary effects pitfall"], "exp": "Fallacy of composition. Watch for it when moving from micro (individuals/firms) to macro (the whole economy)."}, {"id": 3, "ch": 1, "q": "'Ceteris paribus' means:", "opts": ["Other things held constant", "At the margin", "Buyer beware", "Value is subjective"], "exp": "Ceteris paribus = other things constant. Failing to hold other things constant can lead to wrong conclusions about cause and effect."}, {"id": 4, "ch": 1, "q": "When price is used to ration a good, who gets it?", "opts": ["Those willing and able to give up other things (pay the price)", "Those who arrive first", "Those with the most political influence", "Those who need it most"], "exp": "Price rationing allocates to those willing to give up other things, and it creates an incentive to earn income. First-come-first-served rewards waiting; government rationing rewards political status."}, {"id": 5, "ch": 1, "q": "Economists say the test of a theory is:", "opts": ["Its ability to predict", "Whether experts agree with it", "Whether its assumptions are realistic", "Whether it is supported by good intentions"], "exp": "Principle 8: the test of a theory is its ability to predict real-world outcomes."}, {"id": 6, "ch": 2, "q": "A point INSIDE the production possibilities curve represents:", "opts": ["An inefficient use of resources", "An unattainable combination of output", "Full and efficient use of resources", "Economic growth"], "exp": "Inside = inefficient; you could get more of one good without giving up any of the other. On the curve = efficient. Outside = unattainable with current resources."}, {"id": 7, "ch": 2, "q": "Which of these would NOT shift the PPC outward?", "opts": ["Moving resources from producing food to producing clothing", "An advancement in technology", "An increase in the economy's resource base", "Improvements in the rules under which the economy functions"], "exp": "Reallocating resources moves you ALONG the curve. The four outward shifters: more resources, better technology, improved rules/institutions, and working harder (giving up leisure)."}, {"id": 8, "ch": 2, "q": "The law of comparative advantage says joint output is greatest when each good is produced by:", "opts": ["The low opportunity cost producer", "The producer who can make the most of it in absolute terms", "The producer with the most resources", "Whoever values the good most"], "exp": "Comparative advantage is about LOWER OPPORTUNITY COST, not absolute ability. It applies to individuals, firms, regions, and nations."}, {"id": 9, "ch": 2, "q": "An economy that chooses more investment goods and fewer consumption goods today will likely:", "opts": ["See its PPC shift outward more in the future", "See its PPC shift inward in the future", "Move to a point inside its PPC", "Have no change in future production possibilities"], "exp": "Investing now (buildings, equipment, training) means greater future output, so the PPC shifts farther out compared with a high-consumption choice."}, {"id": 10, "ch": 2, "q": "Middlemen (like your local grocer) are valuable mainly because they:", "opts": ["Reduce transaction costs", "Increase the price of goods", "Create property rights", "Eliminate opportunity costs"], "exp": "Middlemen reduce the time, effort, and resources needed to search out, negotiate, and complete an exchange (transaction costs)."}, {"id": 11, "ch": 2, "q": "Which is NOT one of the three parts of private property rights?", "opts": ["The right to have the government set the property's price", "The right to exclusive use", "Legal protection against invaders", "The right to transfer it to another"], "exp": "Private property rights = exclusive use, legal protection against invasion, and the right to transfer (sell, rent, lease, etc.)."}, {"id": 12, "ch": 2, "q": "When a voluntary exchange occurs:", "opts": ["Both parties expect to be made better off", "One party gains exactly what the other loses", "Value is only transferred, not created", "The good's objective value stays fixed"], "exp": "Mutual gain is the foundation of trade. Moving goods to people who value them more creates value."}, {"id": 13, "ch": 5, "q": "The economically efficient level of an activity is where:", "opts": ["Marginal benefit equals marginal cost", "Marginal benefit is at its maximum", "Total cost is minimized", "Marginal cost is zero"], "exp": "Expand an activity as long as MB > MC; stop where MB = MC (Q2 on the graph). Below that you skip worthwhile units; beyond it MC > MB."}, {"id": 14, "ch": 5, "q": "When external COSTS (negative externality) are present, the market will produce:", "opts": ["Too many units at too low a price", "Too few units at too high a price", "Too few units at too low a price", "The efficient quantity"], "exp": "The supply curve understates the true cost, so output is too high and price too low. Including all costs shifts supply left (S2): lower Q, higher P."}, {"id": 15, "ch": 5, "q": "When external BENEFITS (positive externality) are present, the market will usually produce:", "opts": ["Too few units", "Too many units", "The efficient quantity", "Nothing at all"], "exp": "The demand curve understates the total value, so units worth more than they cost may not get produced. Counting all benefits shifts demand right."}, {"id": 16, "ch": 5, "q": "The two defining characteristics of a public good are:", "opts": ["Nonrival in consumption and nonexcludable", "Produced by government and free of charge", "Rival in consumption and excludable", "Low cost and high demand"], "exp": "It's the good's characteristics, not who produces it. Examples: national defense, broadcast signals, mosquito abatement."}, {"id": 17, "ch": 5, "q": "A person who receives the benefits of a good without helping pay for it is a:", "opts": ["Free rider", "Rent seeker", "Middleman", "Crony capitalist"], "exp": "Because nonpayers can't be excluded from public goods, people have an incentive to free ride, so too little of the good gets produced."}, {"id": 18, "ch": 5, "q": "Which is NOT one of the four reasons the invisible hand (markets) may fail?", "opts": ["The special interest effect", "Lack of competition", "Externalities", "Poor information"], "exp": "Market failure: lack of competition, externalities, public goods, poor information. The special interest effect is a source of GOVERNMENT failure (Ch. 6)."}, {"id": 19, "ch": 5, "q": "When competition is absent, sellers tend to:", "opts": ["Restrict output and raise prices", "Expand output and lower prices", "Produce the efficient quantity", "Create external benefits"], "exp": "Restricted supply (S2) gives Q2 < Q1 and P2 > P1: too few units at too high a price."}, {"id": 20, "ch": 5, "q": "Protecting people and property and enforcing contracts is government's:", "opts": ["Protective function", "Productive function", "Redistributive function", "Regulatory function"], "exp": "Protective = security, rules, contract enforcement. Productive = providing goods hard to supply through markets (and a stable monetary environment)."}, {"id": 21, "ch": 6, "q": "Voters having little incentive to become informed because their single vote is unlikely to be decisive is the:", "opts": ["Rational ignorance effect", "Shortsightedness effect", "Special interest effect", "Bundle purchase problem"], "exp": "Rational ignorance: getting informed is costly and one vote rarely changes the outcome, so many voters stay uninformed on many issues."}, {"id": 22, "ch": 6, "q": "Representative government is biased toward adopting INEFFICIENT projects when:", "opts": ["Benefits are concentrated and costs are widespread", "Benefits and costs are both widespread", "Benefits are widespread and costs are concentrated", "Benefits and costs are both concentrated"], "exp": "Type 2: concentrated benefits + widespread costs = special interest effect. (Type 4, widespread benefits + concentrated costs, tends to REJECT productive projects.)"}, {"id": 23, "ch": 6, "q": "Road project: benefits are Adams $20, Chan $12, Green $4, Lee $2, Diaz $2 (total $40). Under Plan A everyone pays $5 tax. What happens in a majority vote?", "opts": ["It fails 3 to 2, even though it's efficient", "It passes 3 to 2", "It passes unanimously", "It fails unanimously because it's inefficient"], "exp": "Only Adams and Chan gain more than $5. Green, Lee, Diaz vote no, so it fails 3-2 even though total benefits ($40) exceed costs ($25). Under Plan B (taxes proportional to benefits) it passes unanimously."}, {"id": 24, "ch": 6, "q": "Politicians exchanging support on one issue for support on another is called:", "opts": ["Logrolling", "Pork-barrel legislation", "Rent seeking", "Crony capitalism"], "exp": "Logrolling = vote trading. Pork-barrel legislation = bundling many local spending projects into one bill."}, {"id": 25, "ch": 6, "q": "Why do politicians find debt financing attractive, according to public choice analysis?", "opts": ["The shortsightedness effect: current benefits now, hard-to-see costs later", "The rational ignorance effect makes debt free", "Debt-financed projects are always efficient", "Bureaucrats prefer smaller budgets"], "exp": "Shortsightedness effect: bias toward clearly defined current benefits with future costs that are hard to identify."}, {"id": 26, "ch": 6, "q": "Actions by groups trying to use the political process to redistribute income to themselves are called:", "opts": ["Rent (favor) seeking", "Entrepreneurship", "Logrolling", "Comparative advantage"], "exp": "Rent seeking diverts resources from productive activity, so output falls below potential."}, {"id": 27, "ch": 6, "q": "The 'bootleggers and Baptists' strategy refers to:", "opts": ["Self-interested action packaged as moral behavior", "Voters trading votes across districts", "Bureaucrats seeking larger budgets", "Markets failing to provide public goods"], "exp": "Rent seekers frame favors as child safety, saving family farms, etc. Example: Mattel and the 2008 Consumer Product Safety Improvement Act."}, {"id": 28, "ch": 6, "q": "The U.S. sugar program (concentrated gains for ~20,000 growers, ~$25 cost per household) illustrates:", "opts": ["The special interest effect", "The rational ignorance effect only", "A public good", "An efficient government program"], "exp": "Large personal benefit for a few + small individual cost spread over many = special interest effect. The program persists even though it's counterproductive."}, {"id": 29, "ch": 6, "q": "Which is a source of GOVERNMENT failure?", "opts": ["Weak incentives for operational efficiency", "Externalities", "Public goods", "Lack of competition among sellers"], "exp": "Government failure: special interest effect, shortsightedness effect, rent seeking, weak incentives for operational efficiency (no profit motive, no bankruptcy)."}, {"id": 30, "ch": 7, "q": "Why are intermediate goods NOT counted in GDP?", "opts": ["It would double count their value", "They are not produced domestically", "They are not sold for money", "They are counted in net exports instead"], "exp": "Only final goods and services count; the value of intermediate goods is already embodied in the final good."}, {"id": 31, "ch": 7, "q": "Which is NOT a component of GDP under the EXPENDITURE approach?", "opts": ["Employee compensation", "Personal consumption", "Gross private investment", "Net exports"], "exp": "Expenditure approach: C + I + G + NX. Employee compensation is part of the resource cost-income approach (with self-employment income, rents, interest, profits)."}, {"id": 32, "ch": 7, "q": "Nominal GDP is $27,361 billion and the GDP deflator is 122.3 (base year = 100). Real GDP in base-year dollars is about:", "opts": ["$22,372 billion", "$33,463 billion", "$27,361 billion", "$24,950 billion"], "exp": "Real GDP = Nominal GDP / (Deflator / 100) = 27,361 / 1.223 = about 22,372. (The 2023 figure in 2017 dollars from your slides.)"}, {"id": 33, "ch": 7, "q": "How does the GDP deflator differ from the CPI?", "opts": ["The GDP deflator covers all goods in GDP; the CPI covers only what households buy", "The CPI is broader than the GDP deflator", "The GDP deflator only measures imported goods", "They use the exact same market basket"], "exp": "The GDP deflator is broader. It and the chained CPI also adjust for substitution away from goods that got relatively more expensive."}, {"id": 34, "ch": 7, "q": "Which of these is NOT counted in GDP?", "opts": ["A homemaker cooking meals for their own family", "A family paying for a streaming subscription", "A firm buying new machinery", "The government building a highway"], "exp": "Household (nonmarket) production isn't counted because there's no market transaction. Other GDP shortcomings: underground economy, leisure, quality changes, 'bads'."}, {"id": 35, "ch": 7, "q": "A hurricane destroys homes and infrastructure, then rebuilding begins. How is GDP affected?", "opts": ["Damages are not subtracted, but recovery spending is added", "Damages are subtracted and recovery spending is added", "Neither is counted", "Damages are subtracted and recovery spending is ignored"], "exp": "GDP tracks production, not destruction, so GDP can rise after a disaster. That's one reason GDP isn't a perfect welfare measure."}, {"id": 36, "ch": 7, "q": "Between 2017 and 2023, nominal GDP rose 39.5%, but real GDP rose only 14.1%. Why?", "opts": ["Prices rose about 22% over the period", "Population fell", "Net exports were negative", "Intermediate goods were excluded"], "exp": "Nominal growth mixes higher output with higher prices. Deflating removes the price increase (deflator went 100 to 122.3)."}, {"id": 37, "ch": 8, "q": "Population age 16+ = 250M, employed = 152M, unemployed = 8M. What is the UNEMPLOYMENT rate?", "opts": ["5.0%", "3.2%", "5.3%", "64%"], "exp": "Unemployment rate = unemployed / labor force. Labor force = 152 + 8 = 160M, so 8/160 = 5%. (Dividing by population is a common trap.)"}, {"id": 38, "ch": 8, "q": "Same economy: population 16+ = 250M, employed = 152M, unemployed = 8M. What is the LABOR FORCE PARTICIPATION rate?", "opts": ["64%", "60.8%", "95%", "5%"], "exp": "LFPR = labor force / population 16+ = 160 / 250 = 64%. (152/250 = 60.8% is the employment-population ratio.)"}, {"id": 39, "ch": 8, "q": "A person working part-time who is diligently searching for a full-time job is classified as:", "opts": ["Employed", "Unemployed", "Not in the labor force", "Cyclically unemployed"], "exp": "Working at least 1 hour for pay counts as employed, even if they want more hours."}, {"id": 40, "ch": 8, "q": "A full-time college student who isn't working or looking for work is:", "opts": ["Not in the labor force", "Unemployed", "Employed", "Frictionally unemployed"], "exp": "Not working and not seeking work = not in the labor force (same for retirees and homemakers)."}, {"id": 41, "ch": 8, "q": "An auto worker on temporary layoff who expects to be recalled is classified as:", "opts": ["Unemployed", "Employed", "Not in the labor force", "Discouraged worker"], "exp": "People on layoff waiting to return to a previous job count as unemployed."}, {"id": 42, "ch": 8, "q": "Frictional unemployment is caused by:", "opts": ["Imperfect information as workers and employers search for good matches", "Workers' skills not matching available jobs", "A recession reducing demand for labor", "Not enough jobs for everyone"], "exp": "Frictional = job search under imperfect information. Structural = skill mismatch from changing products/technology. Cyclical = business cycle downturns."}, {"id": 43, "ch": 8, "q": "New technology makes certain skills obsolete, and job openings require skills the unemployed don't have. This is:", "opts": ["Structural unemployment", "Frictional unemployment", "Cyclical unemployment", "Seasonal employment"], "exp": "Structural unemployment comes from structural changes in the economy that create a skills mismatch."}, {"id": 44, "ch": 8, "q": "At full employment:", "opts": ["Only frictional and structural unemployment remain (no cyclical)", "The unemployment rate is zero", "Cyclical unemployment is at its peak", "Actual GDP is below potential GDP"], "exp": "Full employment = natural rate of unemployment, not zero. Actual output equals potential output."}, {"id": 45, "ch": 8, "q": "During a recession, which is true?", "opts": ["Actual GDP is below potential GDP", "Actual unemployment is below the natural rate", "Employment exceeds full employment", "Cyclical unemployment is zero"], "exp": "In a recession, actual unemployment rises above the natural rate and actual GDP falls below potential."}, {"id": 46, "ch": 8, "q": "The CPI was 150 at the end of last year and 157.5 at the end of this year. The inflation rate was:", "opts": ["5%", "7.5%", "4.8%", "57.5%"], "exp": "Inflation = (157.5 - 150) / 150 x 100 = 7.5 / 150 = 5%."}, {"id": 47, "ch": 8, "q": "People expected 3% inflation, but prices rose 7%. This is:", "opts": ["Inflation higher than anticipated (unanticipated inflation)", "Anticipated inflation", "Inflation lower than anticipated", "Deflation"], "exp": "Actual exceeded expected, so 4 points of it was a surprise. Unanticipated inflation is what disrupts long-term contracts."}, {"id": 48, "ch": 8, "q": "The four phases of the business cycle, in order starting from the top, are:", "opts": ["Peak, contraction, recessionary trough, expansion", "Expansion, peak, trough, contraction", "Peak, trough, contraction, expansion", "Contraction, peak, expansion, trough"], "exp": "Peak (boom) then contraction then recessionary trough (bottom) then expansion. A depression is a prolonged, very severe recession."}, {"id": 49, "ch": 8, "q": "Which is NOT a reason high and variable inflation harms the economy?", "opts": ["It makes long-term contracts easier to plan", "It distorts the information delivered by prices", "It reduces investment by increasing risk", "People spend more time protecting wealth instead of producing"], "exp": "High, variable inflation makes long-term planning HARDER. It's hard to predict, which is exactly the problem."}, {"id": 50, "ch": 9, "q": "Which is NOT a reason the aggregate demand curve slopes downward?", "opts": ["A higher price level improves firms' profit margins", "A lower price level increases the purchasing power of money", "A lower price level lowers interest rates, boosting spending", "A lower price level makes domestic goods cheaper relative to foreign goods"], "exp": "The profit-margin story explains why SRAS slopes UP. AD slopes down due to the wealth effect, the interest rate effect, and the international substitution effect."}, {"id": 51, "ch": 9, "q": "Why is the long-run aggregate supply (LRAS) curve vertical?", "opts": ["A higher price level doesn't change resources, technology, or institutions", "Firms can't change output in the long run", "Prices are fixed by contracts in the long run", "Aggregate demand is constant in the long run"], "exp": "Full-employment output (YF) depends on resources, technology, and institutions, which the price level doesn't change. So output can't be sustainably expanded by higher prices."}, {"id": 52, "ch": 9, "q": "Why does the SRAS curve slope upward?", "opts": ["Some costs are fixed by contracts, so an unexpected price rise boosts profits", "Higher prices increase the economy's resource base", "Consumers buy more when prices rise", "Interest rates fall when prices rise"], "exp": "In the short run, wages, interest rates, etc. are locked in by prior contracts, so an unanticipated higher price level widens profit margins and firms expand output."}, {"id": 53, "ch": 9, "q": "The money interest rate is 11% and expected inflation is 5%. The real interest rate is:", "opts": ["6%", "16%", "11%", "2.2%"], "exp": "Real interest rate = money interest rate - inflationary premium = 11% - 5% = 6%."}, {"id": 54, "ch": 9, "q": "If actual inflation turns out HIGHER than anticipated:", "opts": ["Borrowers gain at the expense of lenders", "Lenders gain at the expense of borrowers", "Neither gains, since the interest rate adjusts", "Both gain equally"], "exp": "Borrowers repay with dollars worth less than expected. If inflation is LOWER than anticipated, lenders gain. Correctly anticipated inflation favors neither."}, {"id": 55, "ch": 9, "q": "When overall interest rates rise, prices of previously issued bonds:", "opts": ["Fall", "Rise", "Stay the same", "Become zero"], "exp": "Old bonds pay a fixed rate. When new bonds pay more, the old ones are less attractive, so their price falls. Inverse relationship."}, {"id": 56, "ch": 9, "q": "With a market-determined exchange rate, a trade deficit is closely linked with:", "opts": ["A net inflow of capital", "A net outflow of capital", "A budget surplus", "A trade surplus"], "exp": "Imports - Exports = Capital inflow - Capital outflow. A trade deficit (imports > exports) is matched by net capital inflow."}, {"id": 57, "ch": 9, "q": "When the economy is in long-run equilibrium:", "opts": ["Actual unemployment equals the natural rate AND the actual price level equals the anticipated one", "Unemployment is zero", "Actual GDP exceeds potential GDP", "Cyclical unemployment is high"], "exp": "Long-run equilibrium: AD, SRAS, and LRAS intersect; output = potential (YF); full employment; expectations about the price level turned out correct."}, {"id": 58, "ch": 9, "q": "An unanticipated increase in the price level will, in the short run:", "opts": ["Expand output and employment", "Reduce output and employment", "Have no effect on output", "Permanently increase potential GDP"], "exp": "Real wages and other contracted costs lag, so profits rise and firms expand. In the long run, costs catch up and output returns to potential."}, {"id": 59, "ch": 9, "q": "Using government taxation and spending to achieve macroeconomic goals is:", "opts": ["Fiscal policy", "Monetary policy", "Trade policy", "Rent seeking"], "exp": "Fiscal = taxes and spending. Monetary = control of the money supply and credit conditions."}, {"id": 60, "ch": 9, "q": "Which market coordinates the actions of borrowers and lenders, with the interest rate as its price?", "opts": ["Loanable funds market", "Resource market", "Foreign exchange market", "Goods and services market"], "exp": "The four key markets: goods & services, resource, loanable funds, foreign exchange."}, {"id": 61, "ch": 9, "q": "Are trade deficits necessarily bad?", "opts": ["It depends on whether the borrowed funds go to productive investment", "Yes, always", "No, never", "Only when the exchange rate is fixed"], "exp": "A trade deficit reflects capital inflow (borrowing from foreigners). Productive investment raises future income; funding consumption or unproductive uses lowers it."}, {"id": 62, "ch": 10, "q": "Which of these would shift aggregate demand to the RIGHT?", "opts": ["A stock market boom that increases real wealth", "An increase in the real interest rate", "Growing pessimism among consumers and businesses", "An increase in the exchange rate value of the nation's currency"], "exp": "AD shifts right with: more real wealth, lower real interest rates, optimism, higher expected inflation, higher incomes abroad, and a LOWER exchange rate value of the currency."}, {"id": 63, "ch": 10, "q": "A decline in the exchange rate value of the dollar will tend to:", "opts": ["Increase AD, because U.S. goods become cheaper to foreigners", "Decrease AD, because imports become cheaper", "Shift LRAS to the right", "Have no effect on AD"], "exp": "A weaker dollar makes U.S. exports cheaper and imports pricier, so net exports and AD rise."}, {"id": 64, "ch": 10, "q": "Which would shift BOTH LRAS and SRAS to the right?", "opts": ["An improvement in technology", "A temporary spell of favorable weather", "A temporary drop in resource prices", "A reduction in expected inflation"], "exp": "LRAS shifters (resources, technology/productivity, institutions) move SRAS in the same direction too. Weather, temporary resource price changes, and expected inflation shift only SRAS."}, {"id": 65, "ch": 10, "q": "A drought that temporarily reduces crop output would:", "opts": ["Shift SRAS left but leave LRAS unchanged", "Shift both LRAS and SRAS left", "Shift AD left", "Shift LRAS left only"], "exp": "Temporary changes in productive capability shift SRAS only. The long-run capacity of the economy isn't altered."}, {"id": 66, "ch": 10, "q": "Steady, predictable growth from capital formation and better technology will:", "opts": ["Shift LRAS right without disrupting macro equilibrium", "Cause a recession", "Cause an unsustainable boom", "Shift only SRAS"], "exp": "Anticipated changes let decision makers adjust ahead of time, so equilibrium isn't disrupted. Full-employment output rises from YF1 to YF2."}, {"id": 67, "ch": 10, "q": "In the SHORT run, an unanticipated increase in AD causes:", "opts": ["A higher price level and output above long-run potential", "A lower price level and lower output", "A higher price level with no change in output", "Unemployment above the natural rate"], "exp": "Profit margins temporarily improve, output exceeds potential, and unemployment falls BELOW the natural rate (e.g., P105 and Y2 on the slide)."}, {"id": 68, "ch": 10, "q": "In the LONG run, after an unanticipated increase in AD:", "opts": ["Resource prices rise, SRAS shifts left, and output returns to potential at a higher price level", "Output stays permanently above potential", "Resource prices fall and SRAS shifts right", "LRAS shifts right to match the new AD"], "exp": "Contracts get renegotiated, costs rise, SRAS shifts left, and you end at full-employment output with a higher price level (P110). The demand boost only expanded output temporarily."}, {"id": 69, "ch": 10, "q": "After an unanticipated DECREASE in AD, what eventually returns the economy to long-run equilibrium?", "opts": ["Lower resource prices and lower real interest rates", "Higher resource prices and higher real interest rates", "A permanent leftward shift of LRAS", "Nothing; the economy stays in recession permanently"], "exp": "Weak demand lowers resource prices (SRAS shifts right) and real interest rates fall, stimulating AD. Output returns to potential at a lower price level (P90), but it can be a lengthy, painful process."}, {"id": 70, "ch": 10, "q": "An unexpected event that temporarily increases or decreases aggregate supply is a:", "opts": ["Supply shock", "Demand shock", "Fiscal policy", "Shift in LRAS"], "exp": "Supply shocks catch people by surprise. Examples of negative ones: the 2022 Russia-Ukraine war's effect on wheat and energy, Hurricane Katrina."}, {"id": 71, "ch": 10, "q": "A sharp, unexpected rise in the world price of oil will, in the short run:", "opts": ["Shift SRAS left, raising the price level and lowering output", "Shift SRAS right, lowering the price level and raising output", "Shift AD right, raising both price level and output", "Have no effect until LRAS shifts"], "exp": "Higher resource costs shift SRAS left: price level up (P110), output down (Y2). If the shock is permanent, LRAS shifts left too; if temporary, SRAS eventually moves back."}, {"id": 72, "ch": 10, "q": "A temporary bumper crop from good weather would cause:", "opts": ["A lower price level and higher current GDP, with LRAS unchanged", "A higher price level and lower GDP", "A permanent rightward shift in LRAS", "A leftward shift in AD"], "exp": "Favorable, temporary supply shock: SRAS shifts right, price level falls (P95), output rises to Y2. Because it can't be counted on, LRAS stays put."}, {"id": 73, "ch": 10, "q": "If the actual rate of inflation is LESS than anticipated, firms will tend to:", "opts": ["Incur losses and reduce output", "Earn higher profits and expand output", "Leave output unchanged", "Shift LRAS to the right"], "exp": "Lower-than-expected inflation acts like a fall in the price level relative to locked-in costs. Higher-than-expected inflation does the opposite and boosts output."}, {"id": 74, "ch": 10, "q": "According to the AD-AS model, the two causes of recessions are:", "opts": ["Unanticipated reductions in AD and unfavorable supply shocks", "Anticipated increases in AD and favorable supply shocks", "Steady growth in LRAS and lower interest rates", "Higher wealth and consumer optimism"], "exp": "Recession = product prices low relative to costs. Booms come from unanticipated increases in AD and favorable supply shocks."}, {"id": 75, "ch": 10, "q": "During a recession, real interest rates tend to:", "opts": ["Fall, which stimulates AD and helps the economy recover", "Rise, which deepens the recession", "Stay constant", "Rise, which stimulates investment"], "exp": "The two self-correcting forces: real resource prices and real interest rates. In a recession both fall; in a boom both rise and slow the economy."}, {"id": 76, "ch": 10, "q": "What caused the 2008-2009 Great Recession in AD-AS terms?", "opts": ["Falling housing and stock prices reduced AD, and soaring oil prices reduced SRAS", "Rising housing prices increased AD", "A permanent improvement in technology shifted LRAS", "Falling oil prices increased SRAS"], "exp": "Housing prices fell after mid-2006 and stocks plunged in 2008 (less wealth, lower AD), energy prices surged in 2007-08 (lower SRAS), and confidence collapsed (AD fell further)."}, {"id": 77, "ch": 10, "q": "Which would be MOST likely to throw the U.S. economy into a recession?", "opts": ["An unanticipated drop in AD from a sharp decline in consumer confidence", "Lower transaction costs from the growth of the Internet", "An unanticipated fall in the world price of oil", "Steady, anticipated growth in the capital stock"], "exp": "Unanticipated AD reductions cause recessions. Lower transaction costs and cheaper oil boost supply (cheaper oil hurts oil-producing states, though)."}, {"id": 78, "ch": 10, "q": "Over the past several decades, how have U.S. expansions compared with recessions?", "opts": ["Expansions have been far lengthier than recessions", "Recessions have been longer than expansions", "They have been about equal in length", "There have been no recessions since 1950"], "exp": "E.g., the 2009-2020 expansion lasted 128 months, while most recessions lasted under a year and a half."}, {"id": 79, "ch": 1, "q": "Goods are scarce because:", "opts": ["Our desire for them far outstrips their availability from nature", "They are always expensive", "Governments limit how much can be produced", "Businesses produce them inefficiently"], "exp": "Scarcity means wants exceed what nature makes available. Even free things like your time are scarce, and scarcity forces us to choose among alternatives."}, {"id": 80, "ch": 1, "q": "In economics, 'capital' refers to:", "opts": ["Human-made resources, like machines and buildings", "Money kept in a bank account", "Natural resources such as land and minerals", "The labor supplied by workers"], "exp": "Resources are inputs used to produce goods and services (land, labor, etc.). Capital is the subset of resources that people have made."}, {"id": 81, "ch": 1, "q": "Rationing is best defined as:", "opts": ["Allocating a limited supply of a good among people who want more of it", "Charging the highest possible price for a good", "Producing more of a good to meet demand", "Lowering prices so everyone can afford a good"], "exp": "Because of scarcity, every society must ration. Price, first-come first-served, and coupons are all different methods of rationing."}, {"id": 82, "ch": 1, "q": "When price is used to ration goods, people have a strong incentive to:", "opts": ["Earn income so they can pay the required price", "Wait in long lines", "Avoid working", "Lobby the government for coupons"], "exp": "Price rationing allocates goods to those willing to give up other things. That rewards earning income, which in turn encourages productive activity."}, {"id": 83, "ch": 1, "q": "How many guideposts (key principles) of the economic way of thinking does Gwartney identify?", "opts": ["Eight", "Five", "Ten", "Twelve"], "exp": "Chapter 1 lists eight guideposts: trade-offs, purposeful choice, incentives, marginal decisions, costly information, secondary effects, subjective value, and testing theories by prediction."}, {"id": 84, "ch": 1, "q": "A parcel of land could become a hospital, a parking lot, or stay undeveloped. Guidepost 1 says:", "opts": ["No option is free; choosing one means a trade-off", "Leaving it undeveloped costs nothing", "The hospital is always the best choice", "Government should decide its use"], "exp": "Guidepost 1: the use of scarce resources is costly, so decision-makers face trade-offs. Even 'leaving it alone' gives up the next best use."}, {"id": 85, "ch": 1, "q": "Pizza, lobster, and steak would give you identical benefits, so you pick the pizza because it's cheapest. This illustrates:", "opts": ["Economizing behavior (individuals choose purposefully)", "The fallacy of composition", "Secondary effects", "Value is objective"], "exp": "Guidepost 2: people choose purposefully, trying to get the most from limited resources. With equal benefits, they choose the lowest-cost option."}, {"id": 86, "ch": 1, "q": "A store owner cuts prices to sell off excess inventory, expecting more customers to buy. Which guidepost explains this?", "opts": ["Incentives matter", "Information is costly", "Value is subjective", "Association is not causation"], "exp": "Guidepost 3: changes in incentives influence choices in predictable ways. A lower price is an incentive to buy more."}, {"id": 87, "ch": 1, "q": "According to Guidepost 3, which incentives influence human choices?", "opts": ["Both monetary and nonmonetary incentives", "Only monetary incentives", "Only nonmonetary incentives", "Only incentives created by government"], "exp": "Incentives matter whether they involve money (prices, wages) or not (time, praise, safety, convenience)."}, {"id": 88, "ch": 1, "q": "In economics, the term 'marginal' describes:", "opts": ["The effects of a change in the current situation", "The total of all costs and benefits", "The average cost per unit", "Something that is unimportant"], "exp": "Guidepost 4: people decide at the margin, weighing the additional benefit and additional cost of a change from where they are now."}, {"id": 89, "ch": 1, "q": "A producer's marginal cost is:", "opts": ["The cost of producing one additional unit, given its current facility and output", "Total cost divided by the number of units", "The cost of building a new factory", "The fixed cost the firm pays regardless of output"], "exp": "Marginal cost is the change in cost from producing one more unit, starting from the current production rate."}, {"id": 90, "ch": 1, "q": "You compare jeans at a few stores, then stop shopping and buy with the information you have. This reflects which guidepost?", "opts": ["Acquiring information is costly", "Incentives matter", "Value is subjective", "The test of a theory is its ability to predict"], "exp": "Guidepost 5: information helps us choose, but gathering it takes scarce time. At some point more comparison-shopping isn't worth the trouble."}, {"id": 91, "ch": 1, "q": "San Francisco banned plastic grocery bags to help the environment, but reusable bags can gather harmful bacteria. This is an example of:", "opts": ["A secondary effect", "Economizing behavior", "A marginal decision", "Positive economics"], "exp": "Guidepost 6: economic actions often have indirect effects that aren't immediately observable, in addition to their direct effects."}, {"id": 92, "ch": 1, "q": "In public policy, secondary effects are often:", "opts": ["Unintended and overlooked", "The main reason a policy is passed", "Easy to observe immediately", "Always beneficial"], "exp": "Secondary effects are indirect impacts that may not be easily or immediately seen, so policymakers frequently miss them."}, {"id": 93, "ch": 1, "q": "Amir prefers a grass field next to work; Camilla prefers a parking lot and a shorter walk. This illustrates:", "opts": ["Value is subjective and varies with individual preferences", "Association is not causation", "Ceteris paribus", "Incentives don't matter"], "exp": "Guidepost 7: the value of a good depends on each person's preferences, so the same field is worth different amounts to different people."}, {"id": 94, "ch": 1, "q": "'The earth is made of marshmallows' is classified as:", "opts": ["A positive statement, because it is potentially verifiable (even though it's false)", "A normative statement, because it is false", "A normative statement, because it is about the earth", "Neither positive nor normative"], "exp": "Positive statements are about 'what is' and can be tested. They don't have to be correct. Normative statements are about 'what ought to be'."}, {"id": 95, "ch": 1, "q": "A politician backs a well-meaning policy that ends up causing harm. Which pitfall does this illustrate?", "opts": ["Good intentions do not guarantee desirable outcomes", "The fallacy of composition", "Association is not causation", "Violation of ceteris paribus"], "exp": "An unsound proposal leads to bad outcomes even when supporters mean well. Politicians may gain from appearing to address a problem even if the policy is ineffective."}, {"id": 96, "ch": 1, "q": "Cities with more police officers tend to have more crime, so someone concludes police cause crime. This mistake is:", "opts": ["Assuming association is causation", "The fallacy of composition", "Normative reasoning", "Economizing behavior"], "exp": "Pitfall 3: statistical association alone cannot establish causation. Here, high crime more likely causes cities to hire more police."}, {"id": 97, "ch": 1, "q": "Microeconomics focuses on:", "opts": ["Narrowly defined units, such as individual households or business firms", "Highly aggregated markets, such as the market for all labor", "Only government decisions", "Only international trade"], "exp": "Micro looks at individual units; macro looks at highly aggregated outcomes. Watch for the fallacy of composition when moving from micro to macro."}, {"id": 98, "ch": 2, "q": "Which statement about opportunity costs is correct?", "opts": ["They are subjective and vary across persons", "They are the same for everyone", "They only include money paid", "They occur only after a choice turns out badly"], "exp": "Opportunity cost is the highest valued alternative given up. It's incurred when the choice is made and depends on each person's values."}, {"id": 99, "ch": 2, "q": "If an option becomes more costly, an individual will be:", "opts": ["Less likely to choose it", "More likely to choose it", "Unaffected, since costs are already sunk", "Forced to choose it"], "exp": "Raising the opportunity cost of an option makes it less attractive relative to the alternatives."}, {"id": 100, "ch": 2, "q": "Gwartney classifies which cost of going to college as a NON-MONETARY cost?", "opts": ["Forgone earnings from a job you could have had", "Tuition", "Textbooks", "Lab fees"], "exp": "College costs include money (tuition, books) and the earnings you give up by not working. That second part is often the bigger cost."}, {"id": 101, "ch": 2, "q": "You get a fantastic job offer right out of high school. Your opportunity cost of attending college:", "opts": ["Rises, so you're less likely to attend", "Falls, so you're more likely to attend", "Stays the same, since tuition didn't change", "Becomes zero"], "exp": "The great job is the alternative you'd give up. A more valuable alternative means a higher opportunity cost of college."}, {"id": 102, "ch": 2, "q": "According to Gwartney, the value of a good or service:", "opts": ["Depends on who uses it and the circumstances of when and where it's used", "Is fixed and objective once the good exists", "Is determined only by its production cost", "Is set by the government"], "exp": "It's wrong to assume goods have a fixed objective value. Value depends on the user, timing, location, and physical traits."}, {"id": 103, "ch": 2, "q": "Even when no additional goods are produced, trade creates value by:", "opts": ["Moving goods from people who value them less to people who value them more", "Ensuring each good is exchanged for one of equal objective value", "Raising prices for everyone", "Making one party better off at the other's expense"], "exp": "Even without producing anything new, trade channels goods to those who value them most, increasing the wealth created by society's resources."}, {"id": 104, "ch": 2, "q": "Milton and Rose Friedman argued that most economic fallacies come from neglecting the fact that:", "opts": ["A voluntary exchange won't take place unless both parties believe they'll benefit", "Prices always rise over time", "Trade is a zero-sum game", "Governments must approve all trades"], "exp": "Mutual gain is the foundation of trade. If both sides didn't expect to gain, the voluntary exchange wouldn't happen."}, {"id": 105, "ch": 2, "q": "Transaction costs are:", "opts": ["The time, effort, and resources needed to search out, negotiate, and complete an exchange", "The taxes paid on a purchase", "The profit earned by the seller", "The cost of producing a good"], "exp": "Transaction costs are a barrier to trade: they reduce our ability to realize gains from potential exchanges."}, {"id": 106, "ch": 2, "q": "How does the Internet affect trade?", "opts": ["It lowers transaction costs, enhancing trade", "It raises transaction costs, reducing trade", "It has no effect on transaction costs", "It eliminates the need for property rights"], "exp": "Online search, reviews, and payment systems make it cheaper to find, negotiate, and complete exchanges, so more mutually beneficial trades happen."}, {"id": 107, "ch": 2, "q": "Property rights are defined as:", "opts": ["The right to use, control, and obtain the benefits from a resource, good, or service", "The right to have the government buy your property", "The right to use anyone's property freely", "The right to set any price the market will not bear"], "exp": "Private property rights involve exclusive use, legal protection against invaders, and the right to transfer to another."}, {"id": 108, "ch": 2, "q": "Why do private owners tend to conserve resources for the future?", "opts": ["They gain if the property is expected to increase in value", "The law requires them to", "They don't bear any costs of using it up", "Government pays them to"], "exp": "Private owners capture the future value of what they own, so conserving it pays off, especially when it's expected to appreciate."}, {"id": 109, "ch": 2, "q": "Private property encourages owners to use resources in ways that benefit others because owners:", "opts": ["Gain by serving others and bear the opportunity cost of ignoring others' wishes", "Are required to share profits with neighbors", "Can't sell their property", "Receive government subsidies for doing so"], "exp": "If an owner ignores what others value, they lose the income those others would have paid. That cost pushes owners toward uses others value."}, {"id": 110, "ch": 2, "q": "Which is NOT one of the assumptions behind a production possibilities curve?", "opts": ["Resources can increase during the period", "A fixed amount of productive resources", "A given amount of technical knowledge", "Full and efficient use of resources"], "exp": "The PPC holds resources and technology fixed and assumes full, efficient use. More resources would shift the curve, not move along it."}, {"id": 111, "ch": 2, "q": "The slope of the production possibilities curve shows:", "opts": ["How much of one good must be given up to produce more of the other", "The total value of all output", "The price of each good", "How much labor is unemployed"], "exp": "The slope is the opportunity cost of producing more of one product, measured in units of the other."}, {"id": 112, "ch": 2, "q": "With 10 hours of study, Susan can get a B in English and a B in economics, or an A in English and a D in economics. Her opportunity cost of raising English from B to A is:", "opts": ["Her economics grade falling from B to D", "Nothing, since study time is free", "Her English grade falling from A to B", "Studying more than 10 hours"], "exp": "Moving along her PPC from T to U, she gains in English only by shifting hours away from economics. The lost economics grade is the opportunity cost."}, {"id": 113, "ch": 2, "q": "Which of these could shift a country's PPC outward?", "opts": ["An improvement in the rules under which the economy functions", "Moving workers from farming to manufacturing", "Leaving some factories idle", "Higher prices for consumer goods"], "exp": "The four outward shifters are: more resources, better technology, improved rules (institutions), and working harder by giving up leisure."}, {"id": 114, "ch": 2, "q": "An entrepreneur is a person who:", "opts": ["Decides what resources to use, how to combine them, and what goods to produce", "Works for a government agency", "Only invests money in the stock market", "Sets prices for an entire industry"], "exp": "When entrepreneurs create goods valued highly relative to their cost, they succeed personally and expand the economy's production possibilities."}, {"id": 115, "ch": 2, "q": "In the production possibilities framework, economic growth is:", "opts": ["An outward shift in the curve over time", "A movement from one point to another along the curve", "A movement to a point inside the curve", "A curve that gets steeper"], "exp": "Growth expands what the economy can produce. The faster the curve shifts outward, the faster the growth."}, {"id": 116, "ch": 5, "q": "Economists use efficiency to judge actions because efficient use of resources implies:", "opts": ["The maximum value of output from the resource base", "The lowest possible prices", "Equal incomes for everyone", "Zero pollution"], "exp": "Efficiency means getting the most value from limited resources: undertaking actions whose benefits exceed costs and avoiding those whose costs exceed benefits."}, {"id": 117, "ch": 5, "q": "At an output level where marginal benefit EXCEEDS marginal cost, the activity should be:", "opts": ["Expanded, because worthwhile units aren't being undertaken", "Reduced, because too much is being produced", "Left unchanged, because it's efficient", "Stopped entirely"], "exp": "If MB > MC, the next unit adds more value than it costs. Expanding until MB = MC captures those gains."}, {"id": 118, "ch": 5, "q": "At an output level where marginal cost EXCEEDS marginal benefit:", "opts": ["Units are being produced that cost more than they're worth, so output is too high", "Output is too low", "The activity is efficient", "Marginal benefit must rise"], "exp": "Producing units where MC > MB wastes resources. Efficiency requires cutting back to where MB = MC."}, {"id": 119, "ch": 5, "q": "'If it's worth doing, it's worth doing imperfectly' means:", "opts": ["At some point, the gains from doing something better aren't worth the cost", "Quality never matters", "You should never finish a task", "Perfection is always worth the cost"], "exp": "Even worthy activities can be pushed beyond the efficient level. This applies to people and governments alike."}, {"id": 120, "ch": 5, "q": "From an efficiency standpoint, eliminating ALL air and water pollution:", "opts": ["Generally doesn't make sense, because the cost of removing the last bits would exceed the benefit", "Always makes sense, because pollution is harmful", "Is required for efficiency", "Has no cost"], "exp": "Like making the highest possible grade or zero traffic fatalities, perfection is rarely worth its cost. The efficient level is where MB = MC."}, {"id": 121, "ch": 5, "q": "Providing a stable monetary and financial environment is part of government's:", "opts": ["Productive function", "Rationing function", "Rent-seeking function", "Regulatory failure"], "exp": "The productive function provides a limited set of goods that are hard to supply through markets. The protective function covers protecting people and property and enforcing contracts. (Note: Ch. 6's summary slide groups monetary stability with the protective function; Ch. 5 classifies it as productive.)"}, {"id": 122, "ch": 5, "q": "The most fundamental function of government is:", "opts": ["Protecting individuals and their property against acts of aggression", "Producing consumer goods", "Setting prices in markets", "Redistributing income"], "exp": "The protective function includes maintaining a legal structure that enforces contracts and settles disputes."}, {"id": 123, "ch": 5, "q": "If producers can restrict supply or limit entry into a market, compared to the competitive outcome:", "opts": ["Output will be lower and price will be higher", "Output will be higher and price will be lower", "Output and price will both be higher", "Nothing changes"], "exp": "With restricted supply (S2), output falls from Q1 to Q2 and price rises from P1 to P2: too few units at too high a price."}, {"id": 124, "ch": 5, "q": "External costs (like pollution) arise mainly because:", "opts": ["Property rights are imperfectly defined or enforced", "Prices are too high", "Government provides too many public goods", "Consumers have perfect information"], "exp": "When people's property can be harmed without their consent, those costs aren't registered in the market."}, {"id": 125, "ch": 5, "q": "When external costs are present, the market supply curve:", "opts": ["Understates the true cost of production", "Overstates the true cost of production", "Accurately reflects all costs", "Becomes vertical"], "exp": "Since some costs fall on others, producers don't count them. Units get produced that are worth less than their full cost."}, {"id": 126, "ch": 5, "q": "When it isn't realistic to define property rights (many people are affected), what may be the best way to handle external costs such as emissions?", "opts": ["Government regulations requiring devices that limit emissions", "Doing nothing, since markets always correct themselves", "Banning all production", "Subsidizing the polluting firms"], "exp": "Defining and enforcing property rights works with few parties. With large numbers, emission-limiting regulations, or creative arrangements, may be the best option."}, {"id": 127, "ch": 5, "q": "When external benefits are present, the market demand curve:", "opts": ["Understates the total value of the output", "Overstates the total value of the output", "Shifts to the right automatically", "Reflects all benefits accurately"], "exp": "Benefits to nonparticipants aren't counted by buyers, so some units worth more than their cost aren't produced."}, {"id": 128, "ch": 5, "q": "If all external benefits were counted, the demand curve would shift to D2. Compared with the market outcome, output and price would be:", "opts": ["Output higher and price higher", "Output lower and price lower", "Output higher and price lower", "Unchanged"], "exp": "Counting all benefits raises demand, so output rises from Q1 to Q2 and price rises from P1 to P2. The market alone produces too few units."}, {"id": 129, "ch": 5, "q": "Which of these is an example of a public good?", "opts": ["A mosquito abatement program", "A pizza", "A haircut", "A new car"], "exp": "Mosquito control is nonrival and nonexcludable: everyone in the area benefits at once, and nonpayers can't be excluded. National defense and broadcast signals are other examples."}, {"id": 130, "ch": 5, "q": "What distinguishes a good as a public good?", "opts": ["Its characteristics (nonrival and nonexcludable), not the sector that produces it", "Whether government produces it", "Whether it's free", "Whether it's sold in a market"], "exp": "Government can provide private goods and markets can provide public goods. The good's traits define it."}, {"id": 131, "ch": 5, "q": "The consumer's information problem is minimal when the item is:", "opts": ["A repeat-purchase item bought often from the same seller", "Bought once in a lifetime", "Difficult to evaluate on inspection", "Capable of serious hidden side effects"], "exp": "Frequent buyers learn about quality, and sellers want repeat business. Problems arise with rarely purchased, hard-to-evaluate, or potentially harmful goods."}, {"id": 132, "ch": 5, "q": "Consumer Reports, brand names, franchises, and online reviews show that:", "opts": ["Information can be a profit opportunity, since consumers will pay for better information", "Markets can never solve information problems", "Government must provide all product information", "Information is free"], "exp": "Because consumers value better information, businesses profit by providing expert evaluations and reliable standardized quality."}, {"id": 133, "ch": 6, "q": "Transfer payments are:", "opts": ["Payments that tax income from some people and transfer it to others", "Payments for government purchases of goods", "Interest paid on government bonds", "Wages paid to government employees"], "exp": "Transfer payments (like Social Security) redistribute income rather than buying output, and they have grown substantially over time."}, {"id": 134, "ch": 6, "q": "Which is a SIMILARITY between government and markets?", "opts": ["Scarcity and competition are present in both", "Payment always corresponds to consumption in both", "Both are based on unanimous agreement", "Both distribute influence according to income"], "exp": "Resources the government uses are unavailable for other goods, even if the good is free to some consumers. And competition exists in both sectors."}, {"id": 135, "ch": 6, "q": "Voters must choose candidates who represent a whole bundle of positions. This 'bundle-purchase' problem:", "opts": ["Limits individual voters' power to make their preferences count on specific issues", "Is common in markets", "Gives voters more choice than markets do", "Only affects politicians"], "exp": "In markets you can buy exactly the items you want. In politics you get a candidate's entire package, so specific preferences are hard to express."}, {"id": 136, "ch": 6, "q": "Private-sector action is based on ___, while democratic public-sector action is based on ___.", "opts": ["Mutual agreement; majority rule", "Majority rule; mutual agreement", "Force; voluntary exchange", "Prices; lotteries"], "exp": "Market trades happen only if both sides agree. In politics, a majority can impose decisions on the minority."}, {"id": 137, "ch": 6, "q": "In the political sector, who tends to have the most influence?", "opts": ["Those most able and willing to use their time, persuasion, organization, and contributions to help politicians get votes", "Those with the highest incomes, exactly as in markets", "Every voter equally", "Bureaucrats only"], "exp": "Influence is distributed differently than in markets: political activity and support, not just income, buy political influence."}, {"id": 138, "ch": 6, "q": "Public choice analysis views the political process as an interaction among which three groups?", "opts": ["Voter-taxpayers, politicians, and bureaucrats", "Consumers, producers, and banks", "Courts, Congress, and the president", "Unions, businesses, and lobbyists"], "exp": "Public choice applies economics to politics, assuming self-interested behavior in both markets and government."}, {"id": 139, "ch": 6, "q": "According to public choice analysis, the primary motivation of politicians is:", "opts": ["Winning elections", "Maximizing economic efficiency", "Reducing the size of government", "Maximizing profits"], "exp": "Votes are the lifeblood of the politician, just as profits are for the market entrepreneur."}, {"id": 140, "ch": 6, "q": "Government bureaucrats' interests are generally served by:", "opts": ["Larger budgets and program expansion", "Smaller budgets and fewer programs", "Cost cutting that reduces their staff", "Ending the programs they run"], "exp": "Bureaucrats seek promotions, job security, and power, and their interests often align with the interest groups they serve."}, {"id": 141, "ch": 6, "q": "Road project: Plan B makes each voter pay in proportion to the benefits they receive. What happens in the vote?", "opts": ["It passes unanimously, since every voter gains", "It fails 3 to 2", "It passes 3 to 2", "It fails unanimously"], "exp": "When costs are allocated in proportion to benefits, everyone gains from a productive project. That's when good politics and efficiency are in harmony."}, {"id": 142, "ch": 6, "q": "When a project's benefits are widespread but its costs are concentrated, the political process tends to:", "opts": ["Reject projects even when they're productive", "Adopt projects even when they're counterproductive", "Make efficient decisions", "Have no bias"], "exp": "This is type 4. The few who bear concentrated costs fight hard, while the many who'd gain a little pay little attention."}, {"id": 143, "ch": 6, "q": "When benefits and costs are BOTH widespread (or both concentrated), representative government tends to:", "opts": ["Undertake productive projects and reject unproductive ones", "Adopt inefficient projects", "Reject all projects", "Ignore the projects"], "exp": "Types 1 and 3 work reasonably well: the people who gain and the people who pay weigh in similarly, so politics tracks efficiency."}, {"id": 144, "ch": 6, "q": "A bill combines a post office in district A, a harbor in B, and a stadium in C. Each project nets its own district +$10 but costs every other district $3, so the bill's total is -$6. How can it still pass?", "opts": ["Representatives of A, B, and C trade votes (logrolling) to form a majority", "Districts D and E vote for it", "It can't pass, since the total is negative", "The president passes it without a vote"], "exp": "Vote trading lets a majority pass a package of projects that each benefit a few districts, even though the whole package is counterproductive."}, {"id": 145, "ch": 6, "q": "Politicians often favor established firms (like taxi companies over Uber) because established firms:", "opts": ["Have stronger records of political contributions and know lobbying techniques", "Are always more efficient", "Pay lower taxes", "Have more customers"], "exp": "Logrolling and pork-barrel politics strengthen the special interest effect, favoring politically connected incumbents over innovative upstarts."}, {"id": 146, "ch": 6, "q": "What is the effect of widespread rent seeking on an economy?", "opts": ["It diverts resources away from productive activities, so output falls below potential", "It increases output above potential", "It has no effect on output", "It improves the efficiency of government"], "exp": "Resources spent lobbying for favors aren't spent producing goods. The more government power favors some at others' expense, the more rent seeking occurs."}, {"id": 147, "ch": 6, "q": "Why do government-operated firms and agencies tend to be less efficient?", "opts": ["No profit motive to keep costs low and no bankruptcy process to weed out inefficient producers", "Government workers are less talented", "They face too much competition", "They are required to make a profit"], "exp": "Public managers rarely gain personally from cost cuts and spend other people's money, so they have less incentive to be cost-conscious."}, {"id": 148, "ch": 6, "q": "Mattel helped write costly toy-testing rules into the 2008 Consumer Product Safety Improvement Act, raising smaller rivals' costs. This is an example of:", "opts": ["Crony capitalism", "A public good", "Comparative advantage", "A positive externality"], "exp": "Crony capitalism allocates resources by political favors rather than consumer preferences. Mattel gained while rivals and used-toy sellers like Goodwill were pushed out."}, {"id": 149, "ch": 7, "q": "Gross Domestic Product (GDP) is:", "opts": ["The market value of final goods and services produced within a country during a specific period", "The total value of all goods sold in a country, including used goods", "The income earned by a country's citizens anywhere in the world", "The value of all intermediate and final goods produced"], "exp": "GDP counts final goods and services, produced within the country's borders, in a given period (usually a year). It's the most widely used indicator of economic performance."}, {"id": 150, "ch": 7, "q": "What are the two ways of measuring GDP?", "opts": ["The expenditure approach and the resource cost-income approach", "The CPI approach and the GDP deflator approach", "The micro approach and the macro approach", "The nominal approach and the real approach"], "exp": "GDP measures both output and income: you can total spending on final goods, or total the incomes and costs generated by producing them."}, {"id": 151, "ch": 7, "q": "In the expenditure approach, net exports equal:", "opts": ["Exports minus imports", "Imports minus exports", "Exports plus imports", "Exports minus government purchases"], "exp": "The four components are consumption, gross private investment, government purchases, and net exports (exports minus imports)."}, {"id": 152, "ch": 7, "q": "Under the expenditure approach, an increase in business inventories is counted in:", "opts": ["Gross private investment", "Consumption", "Government purchases", "Net exports"], "exp": "Gross private investment includes new structures, equipment, and changes in inventories."}, {"id": 153, "ch": 7, "q": "The sum of employee compensation, self-employment income, rents, interest, and corporate profits equals:", "opts": ["National income", "Nominal GDP", "Net exports", "Personal consumption"], "exp": "These are the direct cost-income components in the resource cost-income approach."}, {"id": 154, "ch": 7, "q": "In GDP statistics, the term 'real' means:", "opts": ["Adjusted for inflation", "Measured in current dollars", "Including only physical goods", "Excluding government spending"], "exp": "Real figures remove the effect of price changes so you can compare actual output across time."}, {"id": 155, "ch": 7, "q": "A price index measures:", "opts": ["The cost of a market basket at a point in time relative to its cost in a base period", "The total quantity of goods produced", "The price of one specific product", "The interest rate on loans"], "exp": "Price indexes like the CPI and GDP deflator compare the cost of the same bundle across periods to track inflation."}, {"id": 156, "ch": 7, "q": "The chained CPI differs from the traditional CPI because it:", "opts": ["Adjusts the market basket monthly to reflect substitution away from goods that became relatively more expensive", "Includes all goods in GDP", "Only measures food and energy prices", "Is calculated once every ten years"], "exp": "By accounting for substitution, the chained CPI usually shows slightly lower inflation than the traditional CPI."}, {"id": 157, "ch": 7, "q": "Compared with the traditional CPI, the chained CPI and GDP deflator generally show inflation that is:", "opts": ["About 0.2 to 0.3 percentage points lower", "About 2 to 3 percentage points higher", "Exactly the same", "About 5 percentage points lower"], "exp": "More frequent updating of the bundle and substitution adjustments lead to slightly lower measured inflation."}, {"id": 158, "ch": 7, "q": "Nominal GDP is $1,000 billion and the GDP deflator is 125 (base year = 100). Real GDP in base-year dollars is:", "opts": ["$800 billion", "$1,250 billion", "$875 billion", "$1,000 billion"], "exp": "Real GDP = Nominal GDP x (base index / current index) = 1,000 x (100 / 125) = $800 billion."}, {"id": 159, "ch": 7, "q": "Your parents earned $40,000 in a year when the CPI was 100. The CPI is now 150. In today's dollars, their income equals:", "opts": ["$60,000", "$26,667", "$40,000", "$90,000"], "exp": "Inflate earlier data: $40,000 x (150 / 100) = $60,000. This expresses old figures in today's purchasing power."}, {"id": 160, "ch": 7, "q": "The GDP deflator rose from 120 to 126 over the year. The inflation rate was:", "opts": ["5%", "6%", "4.8%", "26%"], "exp": "Inflation rate = (126 - 120) / 120 x 100 = 5%. Inflation can be calculated with either the CPI or the GDP deflator."}, {"id": 161, "ch": 7, "q": "Income from illegal activities or hidden to avoid taxes is a GDP shortcoming known as:", "opts": ["The underground economy", "Nonmarket production", "Economic 'bads'", "Quality variation"], "exp": "Concealed activity isn't recorded, so GDP understates actual production."}, {"id": 162, "ch": 7, "q": "Everyone works longer hours and takes less vacation, raising output. Why might GDP overstate the gain in well-being?", "opts": ["GDP excludes leisure and the human costs of production", "GDP counts leisure as output", "GDP subtracts wages", "GDP only counts government output"], "exp": "GDP counts the extra goods but makes no deduction for the leisure given up or the strain of producing them."}, {"id": 163, "ch": 7, "q": "A factory's pollution harms a nearby community. How does GDP handle this?", "opts": ["It makes no adjustment for harmful side effects ('bads')", "It subtracts the damage from GDP", "It adds the damage to GDP", "It excludes the factory's output from GDP"], "exp": "GDP doesn't subtract harmful side effects of production, consumption, or destructive acts of people and nature."}, {"id": 164, "ch": 7, "q": "Free apps replace paid maps, cameras, and music. How might GDP be affected?", "opts": ["It may understate well-being, and GDP could even fall", "GDP rises by the value of the free apps", "GDP perfectly captures the improvement", "GDP isn't affected at all"], "exp": "Technology in the information age improves well-being a lot but has less impact on GDP, sometimes reducing it."}, {"id": 165, "ch": 7, "q": "Despite its shortcomings, real GDP per person is:", "opts": ["A broad indicator of living standards", "Unrelated to living standards", "A precise measure of happiness", "Only useful for measuring government size"], "exp": "As real per capita GDP has risen, life expectancy and leisure rose while illiteracy and infant mortality fell."}, {"id": 166, "ch": 7, "q": "Per capita GDP is calculated as:", "opts": ["GDP divided by the size of the population", "GDP divided by the number of workers", "GDP minus population", "GDP times the inflation rate"], "exp": "In 2023, U.S. real per capita GDP was 3.4 times its 1960 level and 7.5 times its 1930 level."}, {"id": 167, "ch": 8, "q": "Since 1960, the U.S. growth rate of real GDP has averaged approximately:", "opts": ["3% per year", "1% per year", "7% per year", "10% per year"], "exp": "Growth is about 3% a year on average, but it's unstable, with periodic recessions of declining real GDP."}, {"id": 168, "ch": 8, "q": "A depression is:", "opts": ["A prolonged and very severe recession", "Any decline in GDP lasting one month", "A period of rapid growth", "A rise in the inflation rate"], "exp": "A recession is a downturn with declining real GDP and rising unemployment. A depression is an especially long and severe one."}, {"id": 169, "ch": 8, "q": "When most businesses operate at capacity and real GDP is growing rapidly, the economy is at a:", "opts": ["Peak (boom)", "Recessionary trough", "Contraction", "Depression"], "exp": "After the peak, business conditions slow and the contraction (recessionary) phase begins."}, {"id": 170, "ch": 8, "q": "A person who is not working but applied for a job at Target last week is:", "opts": ["Unemployed", "Employed", "Not in the labor force", "Discouraged and not counted"], "exp": "Actively seeking a job while not working counts as unemployed."}, {"id": 171, "ch": 8, "q": "A homemaker working 70 hours a week preparing meals and doing household tasks is classified as:", "opts": ["Not in the labor force", "Employed", "Unemployed", "Self-employed"], "exp": "Household production isn't paid market work, so the homemaker isn't counted as employed or unemployed."}, {"id": 172, "ch": 8, "q": "Which person counts as EMPLOYED?", "opts": ["Someone working 15+ hours a week without pay in a family-operated business", "Someone working 5 hours a week without pay in a family business", "A retired Social Security recipient", "A full-time student who isn't working"], "exp": "Employed means working for pay at least one hour a week, being self-employed, or working 15+ unpaid hours in a family enterprise."}, {"id": 173, "ch": 8, "q": "Population age 16+ = 250M and employed = 152M. The employment-population ratio is:", "opts": ["60.8%", "64%", "95%", "5%"], "exp": "Employment-population ratio = employed / population 16+ = 152 / 250 = 60.8%."}, {"id": 174, "ch": 8, "q": "Unemployment that rises because of a general downturn in business activity is:", "opts": ["Cyclical unemployment", "Frictional unemployment", "Structural unemployment", "Seasonal unemployment"], "exp": "Cyclical unemployment reflects business cycle conditions. It's absent at full employment."}, {"id": 175, "ch": 8, "q": "Which factors influence the natural rate of unemployment?", "opts": ["Demogra
