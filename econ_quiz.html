 produces too few units.", "retired": true}, {"id": 129, "ch": 5, "q": "Which of these is an example of a public good?", "opts": ["A mosquito abatement program", "A pizza", "A haircut", "A new car"], "exp": "Mosquito control is nonrival and nonexcludable: everyone in the area benefits at once, and nonpayers can't be excluded. National defense and broadcast signals are other examples.", "retired": true}, {"id": 130, "ch": 5, "q": "What distinguishes a good as a public good?", "opts": ["Its characteristics (nonrival and nonexcludable), not the sector that produces it", "Whether government produces it", "Whether it's free", "Whether it's sold in a market"], "exp": "Government can provide private goods and markets can provide public goods. The good's traits define it.", "retired": true}, {"id": 131, "ch": 5, "q": "A consumer's information problem is smallest when the item is:", "opts": ["Bought often by the same buyer from the same seller", "Expensive and purchased once or twice in a lifetime", "Hard to judge even after a careful inspection", "Capable of harm that a layperson cannot predict"], "exp": "With repeat-purchase items, buyers learn from experience and sellers want them to come back, so poor information is a minor problem. Items that are hard to evaluate, seldom bought from the same seller, or capable of unpredictable harm are where information problems arise."}, {"id": 132, "ch": 5, "q": "Consumer Reports, brand names, franchises, and online reviews show that:", "opts": ["Information can be a profit opportunity, since consumers will pay for better information", "Markets can never solve information problems", "Government must provide all product information", "Information is free"], "exp": "Because consumers value better information, businesses profit by providing expert evaluations and reliable standardized quality.", "retired": true}, {"id": 133, "ch": 6, "q": "Transfer payments are:", "opts": ["Payments that tax income from some people and transfer it to others", "Payments for government purchases of goods", "Interest paid on government bonds", "Wages paid to government employees"], "exp": "Transfer payments (like Social Security) redistribute income rather than buying output, and they have grown substantially over time.", "retired": true}, {"id": 134, "ch": 6, "q": "Which is a similarity between the government and market sectors?", "opts": ["Both face scarcity, and competition is present in both", "Both base decisions on mutual agreement among parties", "Both tie each person's payment to what they consume", "Both give the most influence to those with high income"], "exp": "Competition and scarcity exist in both sectors; resources government uses are unavailable for other goods even if the output is free to users. The other options describe the market sector only: mutual agreement, payment tied to consumption, and influence based on income."}, {"id": 135, "ch": 6, "q": "Voters must choose candidates who represent a whole bundle of positions. This 'bundle-purchase' problem:", "opts": ["Limits individual voters' power to make their preferences count on specific issues", "Is common in markets", "Gives voters more choice than markets do", "Only affects politicians"], "exp": "In markets you can buy exactly the items you want. In politics you get a candidate's entire package, so specific preferences are hard to express.", "retired": true}, {"id": 136, "ch": 6, "q": "Private-sector action rests on ___, while democratic public-sector action rests on ___.", "opts": ["mutual agreement; majority rule", "majority rule; mutual agreement", "competition; the absence of competition", "consumer income; bureaucrats' choices"], "exp": "Market exchanges happen only when both parties agree, while democratic government acts on majority rule, which can bind those who voted no. It's tempting to say government lacks competition, but competition is present in both sectors."}, {"id": 137, "ch": 6, "q": "In the political sector, who tends to have the most influence?", "opts": ["Those most able and willing to use their time, persuasion, organization, and contributions to help politicians get votes", "Those with the highest incomes, exactly as in markets", "Every voter equally", "Bureaucrats only"], "exp": "Influence is distributed differently than in markets: political activity and support, not just income, buy political influence.", "retired": true}, {"id": 138, "ch": 6, "q": "Public choice analysis treats the political process as an interaction among:", "opts": ["Voter-taxpayers, politicians, and bureaucrats", "Consumers, business producers, and resource owners", "Voters, the courts, and the central bank", "Politicians, lobbyists, and news media"], "exp": "Public choice applies economic tools to politics, viewing it as interaction among voter-taxpayers, politicians, and bureaucrats, each acting in their own interest. Consumers, producers, and resource owners are the players in the market sector."}, {"id": 139, "ch": 6, "q": "According to public choice analysis, the primary motivation of politicians is:", "opts": ["Winning elections", "Maximizing economic efficiency", "Reducing the size of government", "Maximizing profits"], "exp": "Votes are the lifeblood of the politician, just as profits are for the market entrepreneur.", "retired": true}, {"id": 140, "ch": 6, "q": "According to public choice analysis, government bureaucrats are generally better off with:", "opts": ["Larger budgets and expanded programs", "Lower costs so funds return to taxpayers", "Smaller agencies that are easier to run", "Programs ended once their goals are met"], "exp": "Bureaucrats seek promotions, job security, and power, and larger budgets and program expansion generally serve those goals. Public-sector managers seldom gain personally from cutting costs, so returning savings to taxpayers does little for them."}, {"id": 141, "ch": 6, "q": "Road project: Plan B makes each voter pay in proportion to the benefits they receive. What happens in the vote?", "opts": ["It passes unanimously, since every voter gains", "It fails 3 to 2", "It passes 3 to 2", "It fails unanimously"], "exp": "When costs are allocated in proportion to benefits, everyone gains from a productive project. That's when good politics and efficiency are in harmony.", "retired": true}, {"id": 142, "ch": 6, "q": "When a project's benefits are widespread but its costs are concentrated, the political process tends to:", "opts": ["Reject projects even when they're productive", "Adopt projects even when they're counterproductive", "Make efficient decisions", "Have no bias"], "exp": "This is type 4. The few who bear concentrated costs fight hard, while the many who'd gain a little pay little attention.", "retired": true}, {"id": 143, "ch": 6, "q": "When benefits and costs are BOTH widespread (or both concentrated), representative government tends to:", "opts": ["Undertake productive projects and reject unproductive ones", "Adopt inefficient projects", "Reject all projects", "Ignore the projects"], "exp": "Types 1 and 3 work reasonably well: the people who gain and the people who pay weigh in similarly, so politics tracks efficiency.", "retired": true}, {"id": 144, "ch": 6, "q": "A bill combines a post office in district A, a harbor in B, and a stadium in C. Each project nets its own district +$10 but costs every other district $3, so the bill's total is -$6. How can it still pass?", "opts": ["Representatives of A, B, and C trade votes (logrolling) to form a majority", "Districts D and E vote for it", "It can't pass, since the total is negative", "The president passes it without a vote"], "exp": "Vote trading lets a majority pass a package of projects that each benefit a few districts, even though the whole package is counterproductive.", "retired": true}, {"id": 145, "ch": 6, "q": "Politicians often favor established firms (like taxi companies over Uber) because established firms:", "opts": ["Have stronger records of political contributions and know lobbying techniques", "Are always more efficient", "Pay lower taxes", "Have more customers"], "exp": "Logrolling and pork-barrel politics strengthen the special interest effect, favoring politically connected incumbents over innovative upstarts.", "retired": true}, {"id": 146, "ch": 6, "q": "What is the effect of widespread rent seeking on an economy?", "opts": ["It diverts resources away from productive activities, so output falls below potential", "It increases output above potential", "It has no effect on output", "It improves the efficiency of government"], "exp": "Resources spent lobbying for favors aren't spent producing goods. The more government power favors some at others' expense, the more rent seeking occurs.", "retired": true}, {"id": 147, "ch": 6, "q": "Why do government-operated firms and agencies tend to be less efficient?", "opts": ["No profit motive to keep costs low and no bankruptcy process to weed out inefficient producers", "Government workers are less talented", "They face too much competition", "They are required to make a profit"], "exp": "Public managers rarely gain personally from cost cuts and spend other people's money, so they have less incentive to be cost-conscious.", "retired": true}, {"id": 148, "ch": 6, "q": "Mattel helped write costly toy-testing rules into the 2008 Consumer Product Safety Improvement Act, raising smaller rivals' costs. This is an example of:", "opts": ["Crony capitalism", "A public good", "Comparative advantage", "A positive externality"], "exp": "Crony capitalism allocates resources by political favors rather than consumer preferences. Mattel gained while rivals and used-toy sellers like Goodwill were pushed out.", "retired": true}, {"id": 149, "ch": 7, "q": "Which definition of gross domestic product matches the one used in the course?", "opts": ["Market value of final goods and services produced inside a country in a period", "Market value of all goods sold inside a country in a period, new and used", "Market value of final goods and services produced by a country's citizens anywhere", "Market value of every intermediate and final good produced inside a country"], "exp": "GDP counts final goods and services, produced within the country's borders, during a specific period, usually a year. Including used goods or intermediate goods would count the same production more than once, and output by citizens abroad is not domestic production."}, {"id": 150, "ch": 7, "q": "What are the two ways of measuring GDP?", "opts": ["The expenditure approach and the resource cost-income approach", "The CPI approach and the GDP deflator approach", "The micro approach and the macro approach", "The nominal approach and the real approach"], "exp": "GDP measures both output and income: you can total spending on final goods, or total the incomes and costs generated by producing them.", "retired": true}, {"id": 151, "ch": 7, "q": "In the expenditure approach, net exports equal:", "opts": ["Exports minus imports", "Imports minus exports", "Exports plus imports", "Exports minus government purchases"], "exp": "The four components are consumption, gross private investment, government purchases, and net exports (exports minus imports).", "retired": true}, {"id": 152, "ch": 7, "q": "A clothing maker produces jackets this year that are still unsold in its warehouse on December 31. Under the expenditure approach, these jackets are recorded as:", "opts": ["Gross private investment, as an addition to inventories", "Consumption, because jackets are a consumer good", "Nothing yet, since they count in the year they are sold", "Net exports, because they were not sold at home"], "exp": "Gross private investment includes changes in business inventories, so goods produced but unsold this year are counted this year. It's tempting to wait for the sale, but GDP measures production in the period, and the later sale from inventory is not new production."}, {"id": 153, "ch": 7, "q": "Adding up employee compensation, self-employment income, rents, interest, and corporate profits gives:", "opts": ["National income", "Nominal GDP", "Personal consumption", "Real GDP"], "exp": "These five direct cost-income components sum to national income. Nominal GDP is tempting, but the resource cost-income approach also includes indirect costs of production, so national income is smaller than GDP."}, {"id": 154, "ch": 7, "q": "In GDP statistics, the term 'real' means:", "opts": ["Adjusted for inflation", "Measured in current dollars", "Including only physical goods", "Excluding government spending"], "exp": "Real figures remove the effect of price changes so you can compare actual output across time.", "retired": true}, {"id": 155, "ch": 7, "q": "A price index measures:", "opts": ["The cost of a market basket at a point in time relative to its cost in a base period", "The total quantity of goods produced", "The price of one specific product", "The interest rate on loans"], "exp": "Price indexes like the CPI and GDP deflator compare the cost of the same bundle across periods to track inflation.", "retired": true}, {"id": 156, "ch": 7, "q": "How does the chained CPI differ from the traditional CPI?", "opts": ["It updates basket quantities monthly as buyers substitute away from pricier goods", "It expands the basket to include every final good and service counted in GDP", "It removes food and energy prices because those prices move around too much each month", "It keeps the same basket quantities for a decade to make comparisons more stable"], "exp": "The chained CPI adjusts the quantities in the typical basket each month to reflect shifts away from goods that have become relatively more expensive. Covering everything in GDP describes the GDP deflator, not the chained CPI."}, {"id": 157, "ch": 7, "q": "Compared with the traditional CPI, the chained CPI and GDP deflator generally show inflation that is:", "opts": ["About 0.2 to 0.3 percentage points lower", "About 2 to 3 percentage points higher", "Exactly the same", "About 5 percentage points lower"], "exp": "More frequent updating of the bundle and substitution adjustments lead to slightly lower measured inflation.", "retired": true}, {"id": 158, "ch": 7, "q": "Nominal GDP is $1,000 billion and the GDP deflator is 125 (base year = 100). Real GDP in base-year dollars is:", "opts": ["$800 billion", "$1,250 billion", "$875 billion", "$1,000 billion"], "exp": "Real GDP = Nominal GDP x (base index / current index) = 1,000 x (100 / 125) = $800 billion.", "retired": true}, {"id": 159, "ch": 7, "q": "Your parents earned $40,000 in a year when the CPI was 100. The CPI is now 150. In today's dollars, their income equals:", "opts": ["$60,000", "$26,667", "$40,000", "$90,000"], "exp": "Inflate earlier data: $40,000 x (150 / 100) = $60,000. This expresses old figures in today's purchasing power.", "retired": true}, {"id": 160, "ch": 7, "q": "The GDP deflator rose from 120 to 126 over the year. The inflation rate was:", "opts": ["5%", "6%", "4.8%", "26%"], "exp": "Inflation rate = (126 - 120) / 120 x 100 = 5%. Inflation can be calculated with either the CPI or the GDP deflator.", "retired": true}, {"id": 161, "ch": 7, "q": "Income from illegal activities or hidden to avoid taxes is a GDP shortcoming known as:", "opts": ["The underground economy", "Nonmarket production", "Economic 'bads'", "Quality variation"], "exp": "Concealed activity isn't recorded, so GDP understates actual production.", "retired": true}, {"id": 162, "ch": 7, "q": "Everyone works longer hours and takes less vacation, raising output. Why might GDP overstate the gain in well-being?", "opts": ["GDP excludes leisure and the human costs of production", "GDP counts leisure as output", "GDP subtracts wages", "GDP only counts government output"], "exp": "GDP counts the extra goods but makes no deduction for the leisure given up or the strain of producing them.", "retired": true}, {"id": 163, "ch": 7, "q": "A factory's pollution harms a nearby community. How does GDP handle this?", "opts": ["It makes no adjustment for harmful side effects ('bads')", "It subtracts the damage from GDP", "It adds the damage to GDP", "It excludes the factory's output from GDP"], "exp": "GDP doesn't subtract harmful side effects of production, consumption, or destructive acts of people and nature.", "retired": true}, {"id": 164, "ch": 7, "q": "Free smartphone apps have replaced paid road maps, cameras, and music purchases. How does this affect GDP as a measure of well-being?", "opts": ["Well-being rises a lot, yet measured GDP grows little or even falls", "Measured GDP rises by the full retail value of the replaced products", "Measured GDP and well-being rise by about the same amount as before", "Well-being falls, because fewer goods are produced and sold in markets"], "exp": "Information-age technology often improves well-being substantially while having less impact on GDP, and it can even reduce it when free products replace paid ones. It's tempting to think GDP counts the value people get, but it counts only market sales."}, {"id": 165, "ch": 7, "q": "Despite its shortcomings, real GDP per person is:", "opts": ["A broad indicator of living standards", "Unrelated to living standards", "A precise measure of happiness", "Only useful for measuring government size"], "exp": "As real per capita GDP has risen, life expectancy and leisure rose while illiteracy and infant mortality fell.", "retired": true}, {"id": 166, "ch": 7, "q": "Per capita GDP is calculated as:", "opts": ["GDP divided by the size of the population", "GDP divided by the number of workers", "GDP minus population", "GDP times the inflation rate"], "exp": "In 2023, U.S. real per capita GDP was 3.4 times its 1960 level and 7.5 times its 1930 level.", "retired": true}, {"id": 167, "ch": 8, "q": "Since 1960, the U.S. growth rate of real GDP has averaged approximately:", "opts": ["3% per year", "1% per year", "7% per year", "10% per year"], "exp": "Growth is about 3% a year on average, but it's unstable, with periodic recessions of declining real GDP.", "retired": true}, {"id": 168, "ch": 8, "q": "How does a depression differ from an ordinary recession?", "opts": ["It is a recession that is prolonged and very severe", "It is a recession in which prices rise instead of fall", "It is a slowdown in growth while real GDP keeps rising", "It is a recession confined to one industry or region"], "exp": "A recession is a downturn with declining real GDP and rising unemployment; a depression is a recession that is prolonged and very severe. A slowdown with real GDP still rising is not a recession at all, since a recession requires real GDP to decline."}, {"id": 169, "ch": 8, "q": "When most businesses operate at capacity and real GDP is growing rapidly, the economy is at a:", "opts": ["Peak (boom)", "Recessionary trough", "Contraction", "Depression"], "exp": "After the peak, business conditions slow and the contraction (recessionary) phase begins.", "retired": true}, {"id": 170, "ch": 8, "q": "A person who is not working but applied for a job at Target last week is:", "opts": ["Unemployed", "Employed", "Not in the labor force", "Discouraged and not counted"], "exp": "Actively seeking a job while not working counts as unemployed.", "retired": true}, {"id": 171, "ch": 8, "q": "A homemaker working 70 hours a week preparing meals and doing household tasks is classified as:", "opts": ["Not in the labor force", "Employed", "Unemployed", "Self-employed"], "exp": "Household production isn't paid market work, so the homemaker isn't counted as employed or unemployed.", "retired": true}, {"id": 172, "ch": 8, "q": "Which of these people is counted as employed?", "opts": ["A teen working 18 unpaid hours a week in her family's restaurant", "A teen working 8 unpaid hours a week in his family's restaurant business", "A retiree who volunteers 20 hours a week at a local hospital", "A student who has accepted a job that begins early next month"], "exp": "Employed includes working for pay at least one hour a week, self-employment, or working 15 or more hours a week without pay in a family-operated enterprise. The 8-hour teen falls short of 15, and the student waiting to begin a job is counted as unemployed."}, {"id": 173, "ch": 8, "q": "Population age 16+ = 250M and employed = 152M. The employment-population ratio is:", "opts": ["60.8%", "64%", "95%", "5%"], "exp": "Employment-population ratio = employed / population 16+ = 152 / 250 = 60.8%.", "retired": true}, {"id": 174, "ch": 8, "q": "Unemployment that rises because of a general downturn in business activity is:", "opts": ["Cyclical unemployment", "Frictional unemployment", "Structural unemployment", "Seasonal unemployment"], "exp": "Cyclical unemployment reflects business cycle conditions. It's absent at full employment.", "retired": true}, {"id": 175, "ch": 8, "q": "Which factors influence the natural rate of unemployment?", "opts": ["Demographics (like the share of young workers) and public policy (like unemployment benefits)", "Only the money supply", "Only the inflation rate", "Nothing; it's fixed forever"], "exp": "The natural rate reflects job shopping in a dynamic economy. It's achievable and sustainable, and it changes with demographics and policy.", "retired": true}, {"id": 176, "ch": 8, "q": "True or false: when full employment is present, the unemployment rate will be zero.", "opts": ["False: frictional and structural unemployment remain", "True: everyone has a job", "True: only cyclical unemployment remains", "False: cyclical unemployment is at its highest"], "exp": "Full employment means unemployment is at its natural rate, with normal job search and skill mismatches still present.", "retired": true}, {"id": 177, "ch": 8, "q": "Potential output is best described as:", "opts": ["The highest output the economy can sustain given its resources and institutions", "The highest output the economy has ever reached, even for a short-lived boom period", "The output the economy would produce if the unemployment rate fell to zero", "The output the economy produces in a typical year once inflation is removed"], "exp": "Potential output is the maximum sustainable level of output consistent with the economy's resource base and institutional arrangements. It is tempting to tie it to zero unemployment, but potential output corresponds to full employment, where the natural rate of unemployment remains."}, {"id": 178, "ch": 8, "q": "According to economists, what causes inflation?", "opts": ["Aggregate demand rising faster than supply, and rapid growth of the money supply", "Falling aggregate demand", "Low unemployment benefits", "Rising productivity"], "exp": "Prices rise when there is 'too much money chasing too few goods.' Nearly all economists link rapid money growth to inflation.", "retired": true}, {"id": 179, "ch": 9, "q": "Which is NOT one of the four key markets that coordinate the circular flow?", "opts": ["The housing market", "The goods and services market", "The loanable funds market", "The foreign exchange market"], "exp": "The four markets are goods and services, resources, loanable funds, and foreign exchange.", "retired": true}, {"id": 180, "ch": 9, "q": "To fight a recession, a central bank deliberately expands the quantity of currency and checking account funds in the economy. Which statement is correct?", "opts": ["This is monetary policy, since it deliberately changes the means of payment people use", "This is fiscal policy, since the government is acting to reach a macroeconomic goal", "This is monetary policy, since it works by changing tax rates and government spending", "This is fiscal policy, since checking account funds are not counted in the money supply"], "exp": "Monetary policy is the deliberate control of the money supply, which consists of currency, checking account funds, and traveler's checks because they serve as the means of payment. Fiscal policy uses taxation and government spending instead. It's tempting to call any government action to fight a recession fiscal policy, but the tool used decides the label."}, {"id": 181, "ch": 9, "q": "The aggregate demand curve shows:", "opts": ["The quantities of domestically produced goods and services buyers will purchase at different price levels", "The total supply of goods at each price level", "The demand for money at each interest rate", "Demand for imported goods only"], "exp": "AD slopes downward: a lower price level means a larger quantity of goods and services demanded.", "retired": true}, {"id": 182, "ch": 9, "q": "In the AD–AS model, what distinguishes the short run from the long run?", "opts": ["In the short run some prices, especially resource prices, are fixed by prior contracts", "In the short run resources and technology are fixed, but every price is flexible", "In the short run prices adjust quickly, while in the long run contracts lock them in place", "In the short run output is held at YF, while in the long run it can exceed YF"], "exp": "The short run is a period when some prices, particularly in resource markets, are set by earlier agreements, so people cannot adjust to unexpected changes in the price level. The long run is long enough for people to modify their behavior. It's tempting to define the short run by fixed resources and technology, but in this model the key is prices locked in by contracts."}, {"id": 183, "ch": 9, "q": "If the price level is ABOVE the short-run equilibrium level (where AD meets SRAS):", "opts": ["Excess supply will push prices down", "Excess demand will push prices up", "Output will rise to meet demand", "The economy is in long-run equilibrium"], "exp": "Above equilibrium, sellers want to supply more than buyers want, so prices fall. Below it, excess demand pushes prices up.", "retired": true}, {"id": 184, "ch": 9, "q": "In the United States, labor costs make up roughly what share of total production costs?", "opts": ["About 70%", "About 30%", "About 50%", "About 90%"], "exp": "Labor is by far the largest component of the resource market, accounting for about 70% of U.S. production costs. It's tempting to guess about half, since capital and raw materials also matter, but labor costs clearly dominate."}, {"id": 185, "ch": 9, "q": "From a lender's viewpoint, interest is:", "opts": ["A premium received for waiting (delaying current spending)", "The cost paid for earlier availability", "A tax paid to the government", "The inflation rate"], "exp": "For borrowers, interest is the cost of getting funds earlier. For lenders, it's the reward for waiting.", "retired": true}, {"id": 186, "ch": 9, "q": "The difference between the money interest rate and the real interest rate is the:", "opts": ["Inflationary premium", "Risk premium", "Exchange rate", "Profit margin"], "exp": "The inflationary premium reflects the expected decline in the dollar's purchasing power while the loan is outstanding.", "retired": true}, {"id": 187, "ch": 9, "q": "If actual inflation turns out LOWER than anticipated:", "opts": ["Lenders gain at the expense of borrowers", "Borrowers gain at the expense of lenders", "Neither gains nor loses", "Both gain equally"], "exp": "Borrowers repay with dollars worth more than expected, and the inflation premium they paid turns out too high.", "retired": true}, {"id": 188, "ch": 9, "q": "When domestic demand for loanable funds is weak and the real interest rate is low:", "opts": ["Capital flows out toward markets with higher expected returns", "Capital flows in from abroad", "Interest rates must rise immediately", "The trade deficit grows"], "exp": "Investors seek the best returns globally. Strong domestic demand and high rates attract a capital inflow instead.", "retired": true}, {"id": 189, "ch": 9, "q": "In recent years, much of the capital inflow to the U.S. has financed federal deficits. The result has been:", "opts": ["Higher current consumption and lower investment, slowing growth", "Higher investment and faster growth", "A trade surplus", "Lower federal spending"], "exp": "Borrowing to support current consumption reduces capital formation. Like a family, a nation can't solve financial problems by borrowing more to keep consuming.", "retired": true}, {"id": 190, "ch": 9, "q": "If the U.S. dollar appreciates against the euro:", "opts": ["Fewer dollars are needed to buy a euro, and net exports tend to fall", "More dollars are needed to buy a euro, and net exports rise", "Fewer dollars are needed to buy a euro, and net exports rise", "Nothing happens to net exports"], "exp": "A stronger dollar makes foreign goods cheaper for Americans and U.S. goods pricier for foreigners, so imports rise and exports fall.", "retired": true}, {"id": 191, "ch": 9, "q": "If the inflation rate increases and stays higher for a long time, what happens to interest rates?", "opts": ["The nominal rate rises; the real rate stays about the same", "The real rate rises; the nominal rate stays the same", "Both fall", "Neither changes"], "exp": "Once higher inflation is expected, lenders add a bigger inflation premium (e.g., 6% real + 5% expected inflation = 11% nominal).", "retired": true}, {"id": 192, "ch": 10, "q": "Which best describes an **anticipated** change in the macroeconomy?", "opts": ["One that people foresee and can adjust their contracts to before it occurs", "One that catches people by surprise after their contracts have been signed", "One that shifts the LRAS curve rather than the AD or SRAS curves", "One that the government announces after it has already taken place"], "exp": "Anticipated changes are fully expected, so decision makers have time to adjust before they occur and the change need not disrupt equilibrium; unanticipated changes catch people by surprise. It's tempting to tie anticipated changes to LRAS because steady growth is anticipated, but changes in AD or SRAS can be anticipated too."}, {"id": 193, "ch": 10, "q": "An increase in the EXPECTED rate of inflation will tend to:", "opts": ["Increase aggregate demand", "Decrease aggregate demand", "Shift LRAS to the right", "Have no effect on AD"], "exp": "If people expect prices to rise, they buy more now, shifting AD right. Expected inflation also reduces SRAS, since resource costs rise.", "retired": true}, {"id": 194, "ch": 10, "q": "Higher real incomes in other countries will:", "opts": ["Increase U.S. aggregate demand, since foreigners buy more U.S. exports", "Decrease U.S. aggregate demand", "Shift U.S. LRAS left", "Have no effect on the U.S."], "exp": "Richer foreigners demand more U.S. goods, raising net exports and AD.", "retired": true}, {"id": 195, "ch": 10, "q": "A reduction in EXPECTED inflation would:", "opts": ["Shift SRAS to the right, without changing LRAS", "Shift LRAS to the right", "Shift both LRAS and SRAS to the left", "Shift AD to the right"], "exp": "SRAS shifters include resource prices, expected inflation, and supply shocks. LRAS depends on resources, technology, and institutions. It would also tend to shift AD to the left, not right, since lower expected inflation reduces current buying.", "retired": true}, {"id": 196, "ch": 10, "q": "If an adverse supply shock (like a higher oil price) turns out to be PERMANENT:", "opts": ["LRAS shifts left and the economy's productive potential shrinks", "The economy returns to its original equilibrium", "LRAS shifts right", "Only AD is affected"], "exp": "A temporary shock fades as resource prices fall back. A permanent one reduces potential output, so LRAS shifts left.", "retired": true}, {"id": 197, "ch": 10, "q": "When the actual rate of inflation equals the expected rate, what happens to prices in resource and product markets?", "opts": ["Both rise, and the relative price between them stays unchanged", "Product prices rise faster, so firms' profit margins widen", "Resource prices rise faster, so firms' profit margins shrink", "Both stay constant, because long-term contracts prevent price changes"], "exp": "Correctly anticipated inflation is built into long-term contracts, so prices rise in both markets and the relative price between them is unchanged, leaving output undisturbed. Profit margins widen only when actual inflation is greater than expected inflation."}, {"id": 198, "ch": 10, "q": "According to the AD-AS model, the two causes of economic BOOMS are:", "opts": ["Unanticipated increases in AD and favorable supply shocks", "Anticipated increases in AD and higher taxes", "Higher resource prices and lower real wealth", "Unfavorable supply shocks and falling AD"], "exp": "Booms happen when goods prices are high relative to resource prices and costs. Recessions are the mirror image.", "retired": true}, {"id": 199, "ch": 10, "q": "After a temporary favorable supply shock, people who know their high income won't last tend to:", "opts": ["Save more, which can lower interest rates and boost capital formation", "Spend all of the extra income immediately", "Borrow more", "Stop working"], "exp": "Since the higher income is temporary, saving rises. With an unfavorable shock, households may dip into past savings instead.", "retired": true}, {"id": 200, "ch": 1, "q": "A town keeps a downtown lot as open space. A developer had offered $3 million to build apartments there, and a hospital had offered $2 million for a clinic site. What is the opportunity cost of keeping the open space?", "opts": ["The apartment project, the most valuable use that was given up", "The mowing and upkeep, the money the town actually spends on it", "$5 million, the total of both offers that the town turned down", "The clinic, because it would serve the most people in the town"], "exp": "Guidepost 1: no option is free, and the opportunity cost is the highest-valued alternative sacrificed, here the $3 million apartment use. Adding both offers is tempting, but the town could only have accepted one of them."}, {"id": 201, "ch": 1, "q": "Maria can get to the airport by rideshare for $40, by shuttle for $15, or by a friend's free ride that means leaving 3 hours early and waiting. She takes the shuttle. A classmate says she acted irrationally because the friend's ride was free. What is wrong with the classmate's reasoning?", "opts": ["The free ride costs 3 hours of her time, so it may not be cheapest", "It's correct; economizing means choosing the option with the lowest price", "Economizing behavior describes business firms, not individual travelers", "Travel choices rest on subjective value, so they can't be compared"], "exp": "Economizing behavior means getting the most from limited resources, and time is a scarce resource too. Counting only money prices is the tempting mistake: once her waiting time is valued, the shuttle can easily be the lowest-cost option."}, {"id": 202, "ch": 1, "q": "A university wants more students in its 8 a.m. classes. Statement I: Giving early registration to students who take 8 a.m. classes could change behavior even though no money changes hands. Statement II: If the university raises parking fees for midday hours, students become more likely to choose midday classes.", "opts": ["I is true and II is false", "I is true and II is true", "I is false and II is true", "I is false and II is false"], "exp": "Guidepost 3 says both monetary and nonmonetary incentives matter, so Statement I is true. Statement II gets the direction backward: raising the cost of midday classes makes students less likely to choose them, which is how incentives work in a predictable way."}, {"id": 203, "ch": 1, "q": "A bakery already makes 200 loaves a day. Making a 201st loaf would add $1.50 to its costs. The bakery's average cost per loaf is $2.00, and the extra loaf would sell for $1.80. Should the bakery make the extra loaf?", "opts": ["Yes, because the extra loaf adds more to revenue than to cost", "No, because the $1.80 price is below the $2.00 average cost", "No, because it should first cover its total cost for the day's loaves", "Yes, because any loaf sold at a positive price raises its profit"], "exp": "Decisions are made at the margin: the extra loaf adds $1.80 in revenue and $1.50 in cost, a gain of $0.30. Comparing the price to the $2.00 average cost is tempting, but average cost includes earlier loaves that this decision doesn't change."}, {"id": 204, "ch": 1, "q": "Jordan checked the price of a used laptop at three websites and bought the cheapest one. Later he learned a fourth site had it for $20 less. A friend says Jordan made an irrational choice. What is the best response?", "opts": ["More searching takes scarce time, so stopping early can be sensible", "Jordan erred; a rational buyer searches until finding the lowest price", "Jordan's choice reflects subjective value, so it can't be evaluated", "Jordan ignored the secondary effects his purchase had on other buyers"], "exp": "Guidepost 5: information helps us choose, but gathering it takes time, so at some point more comparison shopping isn't worth it. The tempting claim that rational buyers keep searching ignores that the search itself has a cost."}, {"id": 205, "ch": 1, "q": "A city bans plastic grocery bags and reports less litter. Two years later, studies link heavily reused cloth bags to the spread of bacteria. Why do consequences like this tend to be missed when policies are adopted?", "opts": ["They are indirect and may not be easily or immediately observed", "They are normative judgments that economists are unable to measure", "They are typically much smaller than a policy's direct effects", "They come from voluntary choices, which policy cannot influence"], "exp": "This is a secondary effect: an indirect impact that may not be easy to see right away, so in policy it is often unintended and overlooked. Calling it normative is tempting, but whether reused bags spread bacteria is a testable, positive question."}, {"id": 206, "ch": 1, "q": "A seller who valued a vintage guitar at $5,000 sells it to a collector for $8,000. The collector would have paid up to $9,000. Which statement is correct?", "opts": ["The guitar is worth different amounts to each, so both can gain", "The guitar's true value is $8,000, so the seller was shortchanged", "The guitar's value is set by its physical condition and its age", "The sale just moved value around, since the guitar did not change"], "exp": "Guidepost 7: value is subjective and varies with individual preferences. The seller gains $3,000 and the collector gains $1,000, so trade creates value. Treating the sale price as the guitar's true value is the tempting error, since value differs by person."}, {"id": 207, "ch": 1, "q": "Two models forecast housing prices. Model A uses very simplified assumptions but has predicted price changes accurately for 15 years. Model B uses highly realistic assumptions, but its forecasts have repeatedly been far off. Which model does the economic way of thinking favor?", "opts": ["Model A, because a theory is judged by how well it predicts", "Model B, because a theory is judged by realistic assumptions", "Neither, because economic theories can't be tested like science", "Model B, because experts tend to prefer more detailed models"], "exp": "Guidepost 8: the test of a theory is its ability to predict, and economic thinking is scientific thinking that checks theories against real events. Realistic assumptions are tempting, but Model B fails the test that matters."}, {"id": 208, "ch": 1, "q": "Statement I: \"Raising the minimum wage to $20 would reduce teen employment\" is a positive statement. Statement II: \"Workers deserve a $20 minimum wage\" is a positive statement because data on wages can be used to debate it.", "opts": ["I is true and II is false", "I is true and II is true", "I is false and II is true", "I is false and II is false"], "exp": "Statement I is a claim about cause and effect that could be checked against evidence, so it is positive even if it turns out wrong. Statement II is a judgment about what ought to be; having data on the topic doesn't make the value judgment testable, so it is normative."}, {"id": 209, "ch": 1, "q": "A classmate says, \"The claim that a tax cut will triple tax revenue next year is clearly false, so it must be a normative statement.\" What is wrong with this reasoning?", "opts": ["A positive statement can be false; what counts is whether it's testable", "It's correct; statements that are shown to be false are classed as normative", "The claim is normative because it is about government tax policy", "The claim is neither, since it is a prediction about the future"], "exp": "Positive statements are about what is and are potentially verifiable, but they are not necessarily correct. The classmate confuses false with normative; normative statements are value judgments that can't be proved true or false at all."}, {"id": 210, "ch": 1, "q": "In a year when the price of beef rose, people also bought more beef than the year before. A student concludes that higher prices cause people to buy more beef. What is the most likely flaw?", "opts": ["Other factors such as incomes changed too, so they weren't held constant", "The student moved from one buyer to every buyer, a fallacy of composition", "The student's claim is normative, so it can't be checked with evidence", "The student forgot that information about beef prices is costly to get"], "exp": "Ceteris paribus means other things constant. If incomes or tastes also changed that year, the higher purchases may reflect those factors, not the price. The composition option is tempting, but the student isn't reasoning from one person to the group."}, {"id": 211, "ch": 1, "q": "Wanting to help low-income renters, a city council passes a policy that ends up shrinking the supply of apartments. A council member responds, \"Our hearts were in the right place, so the policy can't be blamed.\" What mistake is the council member making?", "opts": ["Assuming that good motives ensure good results from a policy", "Assuming that what helps one renter will help renters as a group", "Assuming that two events happening together means one caused the other", "Assuming a policy can be judged without holding other things constant"], "exp": "Good intentions do not guarantee desirable outcomes: an unsound proposal causes harm even when its backers mean well. The 'help one renter, help all' option describes the fallacy of composition, which isn't the argument being made here."}, {"id": 212, "ch": 1, "q": "Students who use the campus tutoring center have lower average grades than students who don't. A dean proposes closing the center because tutoring \"hurts grades.\" What is the best critique?", "opts": ["Struggling students are more likely to seek tutoring", "The dean assumes what's true for one student is true for all students", "The dean's claim is normative, so grade data can't test it", "Grades have subjective value that differs for each student"], "exp": "Statistical association alone cannot establish causation. Low grades likely lead students to tutoring, not the reverse. The composition option is tempting, but the dean is reasoning from group data, not from one student to the group."}, {"id": 213, "ch": 1, "q": "At a concert, one fan who stands up gets a better view. Someone concludes that if everyone stands, everyone will see better. Which statement best explains the error?", "opts": ["What benefits one person acting alone may not benefit the whole group", "The conclusion confuses a statistical association with a true cause", "The conclusion fails to hold factors like the stage's height constant", "The conclusion is a normative claim that can't be tested with data"], "exp": "This is the fallacy of composition: what is true for a part isn't necessarily true for the whole. If everyone stands, no one's view improves. Economists watch for this error when moving from micro units to the whole economy."}, {"id": 214, "ch": 1, "q": "Tickets to a popular concert are sold at a price well below what fans would pay, on a first-come, first-served basis. Compared with letting price ration the tickets, what is the most likely result?", "opts": ["Tickets go to those willing to wait longest, and fans spend time in line", "Scarcity disappears, because every fan who wants a ticket can afford one", "Tickets go to the fans willing to give up the most other goods for them", "Fans gain a stronger incentive to earn more income to buy the tickets"], "exp": "Every society must ration scarce goods; a low price just changes the method. First-come, first-served rewards waiting, so fans pay in time. Going to those willing to give up the most other goods, and the incentive to earn income, describe price rationing instead."}, {"id": 215, "ch": 2, "q": "Use the graph. Which statement about points A, B, and C is correct?", "opts": ["A is efficient, B is attainable but inefficient, and C is unattainable", "A is efficient, B is unattainable, and C is attainable but inefficient", "A and B are both efficient, while C is unattainable with current resources", "B is efficient, A is attainable but inefficient, and C is unattainable"], "exp": "Points on the curve, like A, are efficient. Point B is inside the curve, so the economy could get more food with the same clothing: it is attainable but inefficient. Point C lies beyond the curve and cannot be reached with current resources and technology.", "fig": {"type": "graph", "x": "Clothing", "y": "Food", "lines": [{"pts": [[8, 88], [30, 84], [50, 74], [66, 58], [78, 38], [85, 8]], "cls": "s", "label": "PPC"}], "points": [{"at": [66, 58], "label": "A"}, {"at": [38, 45], "label": "B"}, {"at": [72, 78], "label": "C"}], "guides": false, "alt": "A bowed-out production possibilities curve with food on the vertical axis and clothing on the horizontal axis. Point A lies on the curve, point B lies below and to the left of the curve, and point C lies above and to the right of the curve."}}, {"id": 216, "ch": 2, "q": "Use the graph. When the economy moves from point B to point C, what is the opportunity cost of each additional computer?", "opts": ["3 units of wheat", "1 unit of wheat", "6 units of wheat", "1/3 unit of wheat"], "exp": "From B to C, computers rise by 10 while wheat falls from 90 to 60, a loss of 30. So each computer costs 30 / 10 = 3 units of wheat; the slope shows how much of one good is given up. 1 unit is the A-to-B cost and 6 units is the C-to-D cost; 1/3 flips the ratio.", "fig": {"type": "graph", "x": "Computers", "y": "Wheat (units)", "lines": [{"pts": [[10, 85], [35, 77.5], [60, 55], [85, 10]], "cls": "s", "label": "PPC"}], "points": [{"at": [10, 85], "label": "A"}, {"at": [35, 77.5], "label": "B"}, {"at": [60, 55], "label": "C"}, {"at": [85, 10], "label": "D"}], "guides": true, "xticks": [[10, "0"], [35, "10"], [60, "20"], [85, "30"]], "yticks": [[10, "0"], [55, "60"], [77.5, "90"], [85, "100"]], "alt": "A bowed-out production possibilities curve for computers on the horizontal axis and wheat on the vertical axis. Point A is 0 computers and 100 wheat, point B is 10 computers and 90 wheat, point C is 20 computers and 60 wheat, and point D is 30 computers and 0 wheat."}}, {"id": 217, "ch": 2, "q": "Use the graph. Statement I: Moving from A to B, each added computer costs 1 unit of wheat. Statement II: As the economy produces more computers, the wheat given up for each extra computer falls.", "opts": ["I is true and II is false", "I is true and II is true", "I is false and II is true", "I is false and II is false"], "exp": "From A to B, 10 computers cost 10 wheat, so I is true. II is false: the cost per computer rises from 1 to 3 to 6 wheat as the economy moves toward D. That's why the curve bows out: the resources shifted last into computers are the ones best suited to wheat.", "fig": {"type": "graph", "x": "Computers", "y": "Wheat (units)", "lines": [{"pts": [[10, 85], [35, 77.5], [60, 55], [85, 10]], "cls": "s", "label": "PPC"}], "points": [{"at": [10, 85], "label": "A"}, {"at": [35, 77.5], "label": "B"}, {"at": [60, 55], "label": "C"}, {"at": [85, 10], "label": "D"}], "guides": true, "xticks": [[10, "0"], [35, "10"], [60, "20"], [85, "30"]], "yticks": [[10, "0"], [55, "60"], [77.5, "90"], [85, "100"]], "alt": "A bowed-out production possibilities curve for computers on the horizontal axis and wheat on the vertical axis. Point A is 0 computers and 100 wheat, point B is 10 computers and 90 wheat, point C is 20 computers and 60 wheat, and point D is 30 computers and 0 wheat."}}, {"id": 218, "ch": 2, "q": "Use the graph. The economy's production possibilities move from PPC1 to PPC2. Which event could cause this?", "opts": ["Contracts and property rights become more reliably enforced", "Workers move from producing food into producing clothing", "Unemployed workers are hired back by existing factories", "Consumers decide they would like more clothing and less food"], "exp": "An improvement in the rules under which the economy functions is one of the four factors that can shift the PPC outward, along with more resources, better technology, and working more. Rehiring idle workers is tempting, but that moves the economy from inside the curve onto it without moving the curve.", "fig": {"type": "graph", "x": "Clothing", "y": "Food", "lines": [{"pts": [[8, 70], [25, 66], [40, 58], [52, 45], [60, 28], [64, 8]], "cls": "m", "label": "PPC1"}, {"pts": [[8, 88], [30, 84], [50, 74], [66, 58], [78, 38], [85, 8]], "cls": "s", "label": "PPC2", "dash": true}], "arrows": [{"from": [44, 54], "to": [56, 66]}], "alt": "Two bowed-out production possibilities curves for food and clothing. PPC1 is closer to the origin; PPC2 lies farther out, allowing more of both goods. An arrow points from PPC1 toward PPC2."}}, {"id": 219, "ch": 2, "q": "Use the graph. Two countries face this same PPC today. Country X chooses point A and Country Y chooses point B. Other things equal, what is most likely in the future?", "opts": ["X's PPC shifts out more than Y's, because X builds more capital now", "Y's PPC shifts out more than X's, because Y consumes more goods now", "Both PPCs shift out equally, since both start on the same curve", "X's PPC shifts inward, because its consumption is lower today"], "exp": "Point A devotes more resources to buildings, equipment, and training, which expands future production possibilities more. Picking Y is tempting because it enjoys more consumption today, but consumption goods don't add to future productive capacity the way investment does.", "fig": {"type": "graph", "x": "Consumption goods", "y": "Investment goods", "lines": [{"pts": [[8, 85], [30, 80], [50, 70], [66, 55], [78, 35], [84, 8]], "cls": "s", "label": "PPC"}], "points": [{"at": [30, 80], "label": "A"}, {"at": [66, 55], "label": "B"}], "guides": true, "xticks": [[30, "CA"], [66, "CB"]], "yticks": [[55, "IB"], [80, "IA"]], "alt": "A production possibilities curve with consumption goods on the horizontal axis and investment goods on the vertical axis. Point A has consumption CA and investment IA; point B has more consumption, CB, and less investment, IB."}, "expFig": {"type": "graph", "x": "Consumption goods", "y": "Investment goods", "lines": [{"pts": [[84, 8], [78, 35], [66, 55], [50, 70], [30, 80], [8, 85]], "cls": "m", "label": "Today"}, {"pts": [[8, 89], [32, 84], [53, 74], [70, 58], [82, 37], [88, 8]], "cls": "d", "label": "Future, B", "dash": true}, {"pts": [[93, 8], [88, 40], [75, 64], [57, 81], [34, 91], [8, 95]], "cls": "s", "label": "Future, A", "dash": true}], "alt": "Today's production possibilities curve, plus two future curves. The future curve after choosing high-investment point A lies well outside today's curve; the future curve after choosing high-consumption point B lies only slightly outside it."}}, {"id": 220, "ch": 2, "q": "Use the table. Who has the comparative advantage in producing scarves, and why?", "opts": ["Ben, because each scarf costs him 2 loaves while it costs Ana 3", "Ana, because she can make more scarves per day than Ben can", "Ana, because each scarf costs her 1/3 loaf while it costs Ben 1/2", "Ben, because each scarf costs him 1/2 loaf while it costs Ana 1/3"], "exp": "Ana gives up 30 / 10 = 3 loaves per scarf; Ben gives up 12 / 6 = 2 loaves per scarf. Ben is the low opportunity cost producer of scarves, so he has the comparative advantage. Ana makes more scarves, but that is absolute advantage, which doesn't decide who should specialize.", "fig": {"type": "table", "head": ["Producer", "Loaves of bread per day", "Scarves per day"], "rows": [["Ana", "30", "10"], ["Ben", "12", "6"]], "alt": "Each producer can make either good with a full day of work. Ana can make 30 loaves of bread or 10 scarves per day. Ben can make 12 loaves of bread or 6 scarves per day."}}, {"id": 221, "ch": 2, "q": "Use the table. Right now each person splits the day evenly between bread and scarves. Suppose Ben switches to making only scarves, and Ana adjusts so the pair still makes 8 scarves in total. How many more loaves does the pair make per day?", "opts": ["3 more loaves", "6 more loaves", "9 more loaves", "12 more loaves"], "exp": "Splitting evenly gives 15 + 6 = 21 loaves and 5 + 3 = 8 scarves. Ben now makes 6 scarves, so Ana makes 2, using 2/10 of her day and leaving 0.8 x 30 = 24 loaves. Bread goes from 21 to 24, a gain of 3. Picking 9 counts Ana's extra 9 loaves but forgets the 6 Ben no longer bakes.", "fig": {"type": "table", "head": ["Producer", "Loaves of bread per day", "Scarves per day"], "rows": [["Ana", "30", "10"], ["Ben", "12", "6"]], "alt": "Each producer can make either good with a full day of work. Ana can make 30 loaves of bread or 10 scarves per day. Ben can make 12 loaves of bread or 6 scarves per day."}}, {"id": 222, "ch": 2, "q": "One rancher owns her land and may sell it at any time. Another grazes cattle on public land that anyone may use. Which rancher has the stronger incentive to avoid overgrazing, and why?", "opts": ["The owner, because damage lowers the value of land she can sell later", "The public-land rancher, because the costs of the land are widely shared", "Both equally, because grass grows back at the same rate on each parcel", "The owner, because legal protection lets her ignore the wishes of others"], "exp": "Private owners have a strong incentive to care for and conserve what they own, since they capture its future value when they sell. The rancher on open land bears only a small share of the damage he causes. Legal protection doesn't free owners from others' wishes; ignoring buyers' wishes is costly to them."}, {"id": 223, "ch": 2, "q": "Statement I: A private owner who ignores what others want bears an opportunity cost, because she gives up what others would pay for her property's services. Statement II: Private ownership gives owners an incentive to lower the chance that their property damages their neighbors' property.", "opts": ["I is true and II is true", "I is true and II is false", "I is false and II is true", "I is false and II is false"], "exp": "Both are among the incentives Gwartney attributes to private property: owners gain by using resources in ways that serve others and pay an opportunity cost when they don't, and they have reason to avoid damaging others' property. Students sometimes doubt I, but forgone income is a real cost even when no money is paid out."}, {"id": 224, "ch": 2, "q": "Selling a used textbook once meant posting flyers and waiting days for a buyer. Now apps match buyers and sellers within minutes. What is the main economic effect?", "opts": ["Lower transaction costs let more mutually beneficial trades happen", "The textbooks become more valuable to their original owners", "Trades now benefit buyers alone, since sellers face more competition", "Fewer trades occur, since the apps are middlemen who raise costs"], "exp": "The Internet cuts the time and effort of searching and negotiating, so trades that weren't worth the hassle now take place. Calling the apps cost-raising middlemen gets it backward: middlemen are valued precisely because they reduce transaction costs."}, {"id": 225, "ch": 2, "q": "A classmate says, \"Grocery stores just add a markup and make nothing. We'd all be better off buying straight from farms and dairies.\" What is wrong with this reasoning?", "opts": ["It ignores that grocers cut the time and effort of arranging trades", "It's correct, since value comes from production rather than trade", "It ignores that grocers set prices so that farmers can't gain from trade", "It's correct, since middlemen raise the opportunity cost of shopping"], "exp": "Grocers are middlemen who reduce your transaction costs of getting vegetables from farmers and milk from dairies. The classmate assumes only physical production creates value, but arranging trades that move goods to people who value them more also creates value."}, {"id": 226, "ch": 2, "q": "Lena owns a concert ticket she values at $40. Marco values the same ticket at $100. Lena sells it to Marco for $70. How much total value does the trade create?", "opts": ["$60, split equally between them", "$70, the amount Marco pays Lena", "$30, Lena's gain above her value", "$0, since no new ticket was made"], "exp": "Lena gains $70 - $40 = $30 and Marco gains $100 - $70 = $30, so the trade creates $60 of value by moving the ticket to someone who values it more. Answering $0 is tempting, but trade creates value even when nothing new is produced."}, {"id": 227, "ch": 2, "q": "Tuition stays the same, but a booming job market raises the wages high school graduates can earn. What does the economic way of thinking predict?", "opts": ["College's opportunity cost rises, so fewer people choose to attend", "College's cost is unchanged, because tuition has not gone up", "College's opportunity cost falls, since jobs make tuition easier to pay", "College's cost rises, but enrollment holds steady since value is subjective"], "exp": "Forgone earnings are part of the opportunity cost of college, so higher wages raise that cost even with tuition unchanged. When an option becomes more costly, people are less likely to choose it. Looking only at tuition misses the larger cost of the job given up."}, {"id": 228, "ch": 2, "q": "Statement I: If people choose to work more and take less leisure, the PPC can shift outward. Statement II: Putting unemployed workers back to work in existing factories shifts the PPC outward.", "opts": ["I is true and II is false", "I is true and II is true", "I is false and II is true", "I is false and II is false"], "exp": "Working harder and giving up leisure is one of Gwartney's four factors that can shift the PPC outward, so I is true. II is false: idle workers mean the economy is inside its curve, and rehiring them moves it onto the existing curve rather than shifting the curve."}, {"id": 229, "ch": 2, "q": "A classmate says, \"Country A can produce both cars and wheat using fewer workers than Country B, so A has nothing to gain from trading with B.\" What is wrong with this reasoning?", "opts": ["Gains come from differences in opportunity costs, not absolute output", "It's correct; trade pays when each country is faster at one of the goods", "B would gain from the trade, but A would lose by giving up cheaper goods", "A should import both goods from B, since B's workers are paid less"], "exp": "The law of comparative advantage says joint output is greatest when each good is made by the low opportunity cost producer. Even if A is better at both, its opportunity costs differ from B's, so both can gain by specializing and trading. Being faster at a good is absolute advantage, which isn't what determines the gains."}, {"id": 230, "ch": 5, "q": "In the figure, an activity is currently carried out at Q1. From the standpoint of economic efficiency, what should happen?", "opts": ["Expand it toward Q2, since each added unit up to Q2 is worth more than it costs", "Keep it at Q1, since total cost there is lower than at any larger quantity", "Cut it back, since the marginal cost curve is already rising at Q1", "Expand it past Q2 to Q3, where the total benefit from the activity is greatest"], "exp": "At Q1 the MB curve lies above the MC curve, so each additional unit up to Q2 adds more benefit than cost and expanding raises net gains. It's tempting to push on to Q3 because total benefit keeps rising, but past Q2 each unit's marginal cost exceeds its marginal benefit.", "fig": {"type": "graph", "x": "Quantity of the activity", "y": "Dollars per unit", "lines": [{"pts": [[10, 85], [90, 15]], "cls": "g", "label": "MB"}, {"pts": [[10, 15], [90, 85]], "cls": "s", "label": "MC"}], "points": [{"at": [50, 50], "label": "A"}], "guides": true, "xticks": [[30, "Q1"], [50, "Q2"], [70, "Q3"]], "alt": "A downward-sloping marginal benefit curve MB and an upward-sloping marginal cost curve MC cross at point A, above quantity Q2. Quantity Q1 lies to the left of Q2 and quantity Q3 lies to the right of Q2."}}, {"id": 231, "ch": 5, "q": "Use the figure. Statement I: Total benefit from the activity is greater at Q3 than at Q2. Statement II: Moving from Q2 to Q3 makes the use of resources more efficient.", "opts": ["Statement I is true and Statement II is false", "Both Statement I and Statement II are true", "Statement I is false and Statement II is true", "Both Statement I and Statement II are false"], "exp": "Between Q2 and Q3 the MB curve is still above zero, so total benefit keeps rising; Statement I is true. But each of those units has a marginal cost greater than its marginal benefit, so net gains fall and Statement II is false. It's tempting to equate more total benefit with more efficiency, but efficiency compares benefits with costs.", "fig": {"type": "graph", "x": "Quantity of the activity", "y": "Dollars per unit", "lines": [{"pts": [[10, 85], [90, 15]], "cls": "g", "label": "MB"}, {"pts": [[10, 15], [90, 85]], "cls": "s", "label": "MC"}], "points": [{"at": [50, 50], "label": "A"}], "guides": true, "xticks": [[30, "Q1"], [50, "Q2"], [70, "Q3"]], "alt": "A downward-sloping marginal benefit curve MB and an upward-sloping marginal cost curve MC cross at point A, above quantity Q2. Quantity Q1 lies to the left of Q2 and quantity Q3 lies to the right of Q2."}}, {"id": 232, "ch": 5, "q": "A paper mill's emissions damage downstream fisheries. In the figure, S1 reflects only the mill's own costs, while S2 adds the harm to the fisheries. Where will the market settle?", "opts": ["At Q1 and P1, with more output and a lower price than full costs would imply", "At Q2 and P2, because buyers end up paying for the damage through price", "At Q1 and P2, because the damage raises price without changing output", "At Q2 and P1, because the harm cuts output but leaves buyers' price unchanged"], "exp": "Because the mill doesn't bear the harm it causes, the supply curve S1 understates the true cost of production and the market settles at E1. If all costs were counted, supply would be S2, with the smaller output Q2 and the higher price P2. It's tempting to pick Q2 and P2, but that is the outcome only if the external cost were registered in the market.", "fig": {"type": "graph", "x": "Quantity", "y": "Price", "lines": [{"pts": [[10, 85], [90, 15]], "cls": "d", "label": "D"}, {"pts": [[10, 15], [90, 85]], "cls": "s", "label": "S1"}, {"pts": [[10, 43], [66, 92]], "cls": "s", "label": "S2", "dash": true}], "points": [{"at": [50, 50], "label": "E1"}, {"at": [34, 64], "label": "E2"}], "guides": true, "xticks": [[34, "Q2"], [50, "Q1"]], "yticks": [[50, "P1"], [64, "P2"]], "alt": "A downward-sloping demand curve D crosses supply curve S1 at E1, at quantity Q1 and price P1. A second supply curve S2 lies above and to the left of S1 and crosses D at E2, at the smaller quantity Q2 and the higher price P2."}}, {"id": 233, "ch": 5, "q": "A drug company develops a flu vaccine, and each shot also protects people who never get one. In the figure, D1 reflects buyers' own benefits and D2 includes all benefits. How does the market outcome compare with the efficient one?", "opts": ["It settles at Q1, short of the efficient Q2, at a price below P2", "It settles at Q2, since buyers count the protection given to others", "It settles at Q1, beyond the efficient level because P1 is too low", "It settles at Q2, but at P1 because the extra benefit isn't priced"], "exp": "Buyers weigh only their own benefits, so market demand is D1 and output is Q1 at price P1. Counting the benefit to nonparticipants gives D2, with the larger output Q2 and higher price P2, so the market produces too few units. It's tempting to think a low price means overproduction, but here the low demand is what holds output down.", "fig": {"type": "graph", "x": "Quantity", "y": "Price", "lines": [{"pts": [[10, 15], [90, 85]], "cls": "s", "label": "S"}, {"pts": [[10, 71], [78, 11.5]], "cls": "d", "label": "D1"}, {"pts": [[10, 92], [90, 22]], "cls": "d", "label": "D2", "dash": true}], "points": [{"at": [42, 43], "label": "E1"}, {"at": [54, 53.5], "label": "E2"}], "guides": true, "xticks": [[42, "Q1"], [54, "Q2"]], "yticks": [[43, "P1"], [53.5, "P2"]], "alt": "An upward-sloping supply curve S crosses demand curve D1 at E1, at quantity Q1 and price P1. A second demand curve D2 lies to the right of D1 and crosses S at E2, at the larger quantity Q2 and the higher price P2."}}, {"id": 234, "ch": 5, "q": "Sellers in a market form an association that limits entry, and supply shifts from S1 to S2 in the figure. Compared with the competitive outcome, what happens?", "opts": ["Output falls to Q2 and price rises to P2, so too few units are produced", "Output falls to Q2 and price rises to P2; this corrects overproduction at Q1", "Price rises to P2, but output stays at Q1 because demand has not changed", "Demand falls along with supply, so output drops but price stays at P1"], "exp": "Restricting supply moves the market from E1 to E2: fewer units at a higher price. Under competition Q1 was efficient, so the units between Q2 and Q1 were worth more to buyers than they cost to produce. It's tempting to call Q2 a correction, as with external costs, but here nothing was overproduced to begin with.", "fig": {"type": "graph", "x": "Quantity", "y": "Price", "lines": [{"pts": [[10, 85], [90, 15]], "cls": "d", "label": "D"}, {"pts": [[10, 15], [90, 85]], "cls": "s", "label": "S1"}, {"pts": [[10, 43], [66, 92]], "cls": "s", "label": "S2", "dash": true}], "points": [{"at": [50, 50], "label": "E1"}, {"at": [34, 64], "label": "E2"}], "guides": true, "xticks": [[34, "Q2"], [50, "Q1"]], "yticks": [[50, "P1"], [64, "P2"]], "alt": "A downward-sloping demand curve D crosses supply curve S1 at E1, at quantity Q1 and price P1. A second supply curve S2 lies to the left of S1 and crosses D at E2, at the smaller quantity Q2 and the higher price P2."}}, {"id": 235, "ch": 5, "q": "Two markets each see supply shift left from S1 to S2: in market X because sellers restrict entry, and in market Y because a previously ignored pollution cost is now counted. Which statement about efficiency is correct?", "opts": ["In X the original Q1 was efficient; in Y the smaller Q2 is the efficient level", "In both, the smaller Q2 is efficient since higher prices cut wasteful use", "In X the smaller Q2 is efficient; in Y the original Q1 was the efficient level", "In both, the original Q1 was efficient since it came from voluntary trade"], "exp": "When sellers restrict supply, the competitive output was efficient and the cutback means too few units. When an external cost is finally counted, S2 is the true cost of production, so Q2 is efficient and the original Q1 was too many. It's tempting to treat both shifts alike because the graphs look the same, but what the supply curve measures differs.", "expFig": {"type": "graph", "x": "Quantity", "y": "Price", "lines": [{"pts": [[10, 85], [90, 15]], "cls": "d", "label": "D"}, {"pts": [[10, 15], [90, 85]], "cls": "s", "label": "S1"}, {"pts": [[10, 43], [66, 92]], "cls": "s", "label": "S2", "dash": true}], "points": [{"at": [50, 50], "label": "E1"}, {"at": [34, 64], "label": "E2"}], "guides": true, "xticks": [[34, "Q2"], [50, "Q1"]], "yticks": [[50, "P1"], [64, "P2"]], "alt": "A downward-sloping demand curve D crosses supply curve S1 at E1, at quantity Q1 and price P1. A second supply curve S2 lies above and to the left of S1 and crosses D at E2, at the smaller quantity Q2 and the higher price P2."}}, {"id": 236, "ch": 5, "q": "A town asks residents to chip in voluntarily for mosquito spraying that will cover every neighborhood. Many residents decline, and too little money is raised. What best explains this?", "opts": ["Nonpayers can't be kept from the benefit, so many let others pay", "Spraying is rival, so each payer's benefit shrinks as more join in", "The single spraying company lacks competition and charges too much", "Residents lack information about whether spraying actually works"], "exp": "Mosquito abatement is a public good: once provided, it covers everyone, and nonpayers can't be excluded. That gives each resident an incentive to free ride, so too little is funded. It's tempting to blame rivalry, but one household's protection does not reduce another's; the good is nonrival."}, {"id": 237, "ch": 5, "q": "A classmate argues: \"National defense is a public good because government provides it. City buses are run by government too, so bus rides are a public good.\" What is wrong with this reasoning?", "opts": ["Bus seats are rival and nonpayers can be excluded, whatever the sector", "Government cannot supply a public good, so neither example qualifies", "Defense is excludable, so it does not qualify as a public good either", "Bus rides become public goods once they are given away free of charge to riders"], "exp": "Whether a good is public depends on its characteristics, nonrival and nonexcludable, not the sector that produces it. A bus seat used by one rider isn't available to another, and fares can keep nonpayers off. It's tempting to focus on price, but a free bus ride is still rival and could still be excludable."}, {"id": 238, "ch": 5, "q": "In which purchase is the buyer most likely to face a serious information problem?", "opts": ["Hiring a roofer for a job done once every 20 years", "Buying a latte at the same cafe every weekday", "Filling the car up at the station on your commute", "Picking up a favorite cereal during weekly shopping"], "exp": "Poor information is a problem when goods are hard to evaluate on inspection and seldom bought repeatedly from the same seller. The roofer is hired rarely and the quality may not show for years. The other three are repeat purchases, where buyers learn from experience and sellers want them back."}, {"id": 239, "ch": 5, "q": "A traveler in an unfamiliar city chooses a nationally franchised hotel over a local inn she knows nothing about. How does the chapter explain this choice?", "opts": ["The brand offers standardized quality to a buyer unlikely to return", "The franchise is a public good that every traveler can use at once", "The local inn's lack of competition lets it charge too much to stay", "Hotel stays are repeat purchases, so she already knows the inn's quality"], "exp": "When buyers can't rely on repeat dealings, brand names and franchises supply information by promising standardized quality and dependability. This is information as a profit opportunity: firms earn by solving the buyer's information problem. It's tempting to call it a repeat purchase, but she has never dealt with either place in that city."}, {"id": 240, "ch": 5, "q": "Used-car buyers often can't tell whether a transmission is about to fail, and most rarely buy twice from the same dealer. Which reason the invisible hand may fail does this illustrate?", "opts": ["Poor information", "External costs", "Lack of competition", "Public goods"], "exp": "The good is hard to evaluate on inspection and seldom bought repeatedly from the same seller, the textbook conditions for an information problem. It's tempting to call a hidden defect an external cost, but the harm falls on the buyer who chose to trade, not on a third party."}, {"id": 241, "ch": 5, "q": "Which of the following is an example of government's **protective** function?", "opts": ["A court ruling on a broken contract between two firms", "A central bank keeping the money supply stable over time", "A county spraying for mosquitoes in every neighborhood", "A state building roads that private firms would not build"], "exp": "The protective function covers protecting people and property and maintaining a legal structure that enforces contracts and settles disputes. Monetary stability, mosquito abatement, and roads that markets supply poorly are all part of the productive function. Students often file monetary stability as protective, but the slides place it under productive."}, {"id": 242, "ch": 5, "q": "A council member proposes spending whatever it takes to repair every pothole in the city within 24 hours of being reported. What is the economist's main objection?", "opts": ["Past some point, the added cost of faster repair exceeds its added benefit", "Road repair is a public good, so private markets should handle it instead", "Potholes are an external cost, so the drivers who cause them should pay", "Repairs create external benefits, so the city should spend even more"], "exp": "Even worthy activities can be pursued beyond the efficient level; at some point the extra gain from a faster or more perfect result isn't worth the extra cost. It's tempting to argue about who should provide or pay for roads, but the objection is to the goal of perfection regardless of cost."}, {"id": 243, "ch": 5, "q": "A classmate says, \"Market failure means some firms in a market are losing money.\" What is the problem with this definition?", "opts": ["Market failure means markets fall short of ideal economic efficiency", "Market failure means a market has more sellers than demand supports", "Market failure means a market's prices have risen faster than wages", "Market failure means government has stepped in to set market prices"], "exp": "Market failure describes markets that fail to achieve ideal economic efficiency, and it can usually be traced to lack of competition, externalities, public goods, or poor information. Losses for some firms are a normal part of a working market, as resources move toward more valued uses."}, {"id": 244, "ch": 5, "q": "Car exhaust in a metro area of several million people creates smog. According to the chapter, what is likely to be the most practical response?", "opts": ["Requiring cars to carry devices that limit their emissions", "Defining property rights so each resident can sue each driver", "Leaving it alone, since drivers already pay for gas and cars", "Banning cars until the area's air is perfectly clean again"], "exp": "Defining and enforcing property rights works poorly when large numbers of people are involved, so regulations requiring emission-limiting devices may be the best option. It's tempting to pick property rights because they address the root cause, but with millions of drivers and residents, individual lawsuits aren't realistic."}, {"id": 245, "ch": 6, "q": "A town votes on a park-and-trail project costing $35. The table shows each voter's benefit and tax under two plans. Under Plan A, how does the majority vote turn out, and is the project efficient?", "opts": ["It fails 2 to 3, even though total benefits exceed the cost by $15", "It passes 3 to 2, since Baker, Cruz, and Ford all gain from it", "It fails 2 to 3, which is efficient since most voters would lose", "It passes 5 to 0, since total benefits are larger than the total tax"], "exp": "Under Plan A each voter pays $7, so only Baker, with $24 in benefits, and Cruz, with $15, gain; Ford, Hill, and Ito vote no and the project fails 2 to 3. Yet total benefits of $50 exceed the $35 cost by $15, so it is efficient. It's tempting to equate a majority of losers with inefficiency, but efficiency compares total benefits with total costs.", "fig": {"type": "table", "head": ["Voter", "Benefit received", "Tax under Plan A", "Tax under Plan B"], "rows": [["Baker", "$24", "$7.00", "$16.80"], ["Cruz", "$15", "$7.00", "$10.50"], ["Ford", "$6", "$7.00", "$4.20"], ["Hill", "$3", "$7.00", "$2.10"], ["Ito", "$2", "$7.00", "$1.40"], ["Total", "$50", "$35.00", "$35.00"]], "alt": "A table of five voters with the benefit each receives from a proposed park-and-trail project and the tax each would pay under two plans. Baker: benefit $24, Plan A $7.00, Plan B $16.80. Cruz: $15, $7.00, $10.50. Ford: $6, $7.00, $4.20. Hill: $3, $7.00, $2.10. Ito: $2, $7.00, $1.40. Totals: benefit $50, Plan A $35.00, Plan B $35.00."}}, {"id": 246, "ch": 6, "q": "Using the table, suppose the town adopts Plan B instead, so each voter's tax is in proportion to benefits. What is the vote, and what is Ford's net gain?", "opts": ["It passes 5 to 0, and Ford gains $1.80", "It passes 5 to 0, and Ford gains $6.00", "It passes 3 to 2, and Ford loses $1.00", "It fails 2 to 3, and Ford gains $1.80"], "exp": "Under Plan B each voter pays 70 percent of their benefit, since $35 / $50 = 0.7, so every voter's benefit exceeds their tax and the project passes unanimously. Ford's net gain is $6.00 - $4.20 = $1.80. Picking $6.00 forgets to subtract the tax, and a loss of $1.00 uses Plan A's $7 tax.", "fig": {"type": "table", "head": ["Voter", "Benefit received", "Tax under Plan A", "Tax under Plan B"], "rows": [["Baker", "$24", "$7.00", "$16.80"], ["Cruz", "$15", "$7.00", "$10.50"], ["Ford", "$6", "$7.00", "$4.20"], ["Hill", "$3", "$7.00", "$2.10"], ["Ito", "$2", "$7.00", "$1.40"], ["Total", "$50", "$35.00", "$35.00"]], "alt": "A table of five voters with the benefit each receives from a proposed park-and-trail project and the tax each would pay under two plans. Baker: benefit $24, Plan A $7.00, Plan B $16.80. Cruz: $15, $7.00, $10.50. Ford: $6, $7.00, $4.20. Hill: $3, $7.00, $2.10. Ito: $2, $7.00, $1.40. Totals: benefit $50, Plan A $35.00, Plan B $35.00."}}, {"id": 247, "ch": 6, "q": "One bill combines three projects; the table shows the net benefit or cost of each project to voters in each of five equal-sized districts. What happens if each project is voted on separately, versus as one bill?", "opts": ["Each fails 1 to 4 alone, but the bill passes 3 to 2 at a net loss of $10", "Each fails 1 to 4 alone, and the bill fails too since its total is -$10", "Each passes alone, and the bill passes 3 to 2 at a net gain of $12", "Each fails 1 to 4 alone, but the bill passes 3 to 2 at a net gain of $12"], "exp": "Separately, only the host district gains from each project, so each fails 1 to 4. Bundled, A nets +$7, B +$3, and C +$2, while D and E each net -$11, so A, B, and C pass the bill 3 to 2. The overall total is 7 + 3 + 2 - 11 - 11 = -$10, so it is counterproductive. The $12 figure adds only the winners and ignores the losses in D and E.", "fig": {"type": "table", "head": ["Voters of district", "Bridge in A", "Park in B", "Lab in C"], "rows": [["A", "+$14", "-$3", "-$4"], ["B", "-$4", "+$11", "-$4"], ["C", "-$4", "-$3", "+$9"], ["D", "-$4", "-$3", "-$4"], ["E", "-$4", "-$3", "-$4"]], "alt": "Net benefit or cost to the voters of districts A through E from three projects in one bill. District A: bridge +$14, park -$3, lab -$4. District B: bridge -$4, park +$11, lab -$4. District C: bridge -$4, park -$3, lab +$9. District D: bridge -$4, park -$3, lab -$4. District E: bridge -$4, park -$3, lab -$4."}}, {"id": 248, "ch": 6, "q": "A bill would give a large subsidy to about 300 specialty-cheese makers, paid for by a tiny charge added to every grocery bill nationwide. Using the table, which type is this, and how is the political process likely to treat it?", "opts": ["Type 2; likely to pass even if it is counterproductive", "Type 4; likely to be rejected even if it is productive", "Type 2; likely to pass when productive and fail when not", "Type 1; likely to pass when productive and fail when not"], "exp": "Benefits go to a small group while costs are spread thinly over
