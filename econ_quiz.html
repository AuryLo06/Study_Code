 many voters, which is Type 2. Representative government is biased toward adopting such projects even when they are inefficient. It's tempting to pick Type 4, but that is the reverse pattern: widespread benefits with concentrated costs.", "fig": {"type": "table", "head": ["Type", "Distribution of benefits", "Distribution of costs"], "rows": [["1", "Widespread", "Widespread"], ["2", "Concentrated", "Widespread"], ["3", "Concentrated", "Concentrated"], ["4", "Widespread", "Concentrated"]], "alt": "The four ways benefits and costs can be distributed among voters. Type 1: benefits widespread, costs widespread. Type 2: benefits concentrated, costs widespread. Type 3: benefits concentrated, costs concentrated. Type 4: benefits widespread, costs concentrated."}}, {"id": 249, "ch": 6, "q": "A rule would cut air pollution for a whole state's residents, with all the costs paid by three cement plants. Using the table, how is the political process likely to handle it?", "opts": ["It will likely reject the rule even if it is productive", "It will likely adopt it even if it is unproductive", "It tends to adopt it if productive, reject if not", "It will likely adopt it, since far more voters gain than lose"], "exp": "Widespread benefits with concentrated costs is Type 4: the few who bear the cost fight hard, while the many who gain a little pay little attention, so productive projects are often rejected. It's tempting to pick the bias toward adoption, but that applies to Type 2, where the concentration runs the other way.", "fig": {"type": "table", "head": ["Type", "Distribution of benefits", "Distribution of costs"], "rows": [["1", "Widespread", "Widespread"], ["2", "Concentrated", "Widespread"], ["3", "Concentrated", "Concentrated"], ["4", "Widespread", "Concentrated"]], "alt": "The four ways benefits and costs can be distributed among voters. Type 1: benefits widespread, costs widespread. Type 2: benefits concentrated, costs widespread. Type 3: benefits concentrated, costs concentrated. Type 4: benefits widespread, costs concentrated."}}, {"id": 250, "ch": 6, "q": "Dana votes in every election but has no idea where the candidates stand on federal farm policy. How would public choice analysis describe her behavior?", "opts": ["Studying farm policy costs her more than she gains, since her vote rarely decides", "She is irrational, because better information would reliably pay off for her", "She is showing the shortsightedness effect by ignoring farm policy's future costs", "She is a member of a special interest group that benefits from staying quiet"], "exp": "This is the rational ignorance effect: becoming informed is costly, and one vote is unlikely to be decisive, so staying uninformed on many issues is a sensible choice. It's tempting to call it shortsightedness, but that effect concerns policies with clear current benefits and hidden future costs."}, {"id": 251, "ch": 6, "q": "Statement I: The U.S. sugar program persists partly because each grower gains a lot and is politically active, while each household's cost is small. Statement II: The program persists because its total benefits to growers exceed its total costs to consumers.", "opts": ["Statement I is true and Statement II is false", "Both Statement I and Statement II are true", "Statement I is false and Statement II is true", "Both Statement I and Statement II are false"], "exp": "Statement I is the special interest effect: concentrated gains motivate growers, while the small cost per household leaves consumers uninformed. Statement II is false because the program continues even though it is counterproductive. It's tempting to assume a long-lasting program must be efficient, but politics can sustain inefficient programs."}, {"id": 252, "ch": 6, "q": "A state legislature cuts this year's income tax for every resident and covers the lost revenue by borrowing that must be repaid over the next 30 years. Which concept best explains why this is politically attractive?", "opts": ["The shortsightedness effect", "The rational ignorance effect", "The bundle-purchase problem", "The special interest effect"], "exp": "Every voter sees the tax cut now, while the repayment falls in the future and is hard to identify. That is the shortsightedness effect, which explains the appeal of debt financing. It's tempting to pick the special interest effect, but here the benefit is widespread, not concentrated on a small group."}, {"id": 253, "ch": 6, "q": "Which of the following is the best example of rent seeking?", "opts": ["A trade group lobbying for a tariff that shields its members from imports", "A firm cutting its prices to win over the customers of a nearby competitor", "A startup spending heavily on research to build a longer-lasting battery", "A retailer advertising heavily to draw shoppers away from rival stores"], "exp": "Rent seeking means using the political process to restructure policy so income is redirected toward oneself; a protective tariff transfers income from consumers to the industry. Price cuts, research, and advertising are market competition, which creates value for consumers rather than diverting resources away from production."}, {"id": 254, "ch": 6, "q": "Officials in a federal agriculture agency and a large farm lobby both push to expand a crop-support program. Why are their goals often aligned?", "opts": ["A bigger program serves the officials' career goals and the group's income", "Officials are elected by farm voters and must follow the farm group's wishes", "The program is a public good, so both sides gain from its free riders", "The program's costs fall mainly on farmers, so taxpayers are unaffected"], "exp": "Bureaucrats seek promotion, security, and power, which larger budgets and program expansion provide, so their interests are often complementary with those of the interest groups they serve. It's tempting to think bureaucrats answer to voters directly, but they are civil servants, not elected officials."}, {"id": 255, "ch": 6, "q": "A city-run bus garage and a private trucking firm's garage each find a way to cut maintenance costs by 10 percent. Why is the city manager less likely to push the change through?", "opts": ["She rarely gains personally from savings and spends other people's money", "Public garages have more competition, so their costs are already low", "Voters closely track garage costs, so any change draws heavy scrutiny", "City managers lack the information needed to measure any cost savings"], "exp": "In the public sector there is no profit motive to keep costs low and no bankruptcy process to weed out inefficient producers, and managers seldom gain from cost cuts. It's tempting to blame a lack of information, but the textbook's point is weak incentives, not missing data."}, {"id": 256, "ch": 6, "q": "Firm X earns profits by making solar panels that cost less to produce than buyers value them. Firm Y earns profits from a subsidy it obtained after large campaign contributions. Which statement is correct?", "opts": ["Y's gain reflects political favor, and its project may be counterproductive", "Both firms are market entrepreneurs, since both earn a profit in the end", "X's gain is crony capitalism, since its profit depends on low input costs", "Y's gain is efficient, since the subsidy was approved by elected officials"], "exp": "Market entrepreneurs prosper by producing goods valued above their resource cost, as X does. Crony capitalists prosper by exchanging political support for subsidies and favors, as Y does, and their projects are often counterproductive. It's tempting to treat any profit as a sign of value creation, but the source of the profit matters."}, {"id": 257, "ch": 6, "q": "A large toymaker backs a child-safety law requiring expensive testing that its smaller rivals must pay outside labs to perform, and parent groups enthusiastically support the law. What does this best illustrate?", "opts": ["Bootleggers and Baptists: a firm's gain packaged as a moral cause", "An external benefit: the testing protects children of other buyers", "A Type 4 project: widespread benefits with costs on the large firm", "Rational ignorance: parents don't know which toys contain lead"], "exp": "The large firm gains by raising its rivals' costs, while the safety framing draws support from well-meaning parents, which is the bootlegger-and-Baptist strategy behind much crony capitalism. It's tempting to call it a Type 4 project, but the testing costs fall mostly on the smaller rivals, and the big firm is a winner."}, {"id": 258, "ch": 6, "q": "Statement I: In the political sector, influence depends mainly on each person's single vote, so it is spread about equally. Statement II: In the market sector, people with larger incomes can buy more goods and services.", "opts": ["Statement I is false and Statement II is true", "Both Statement I and Statement II are true", "Statement I is true and Statement II is false", "Both Statement I and Statement II are false"], "exp": "In politics, those most able and willing to contribute time, persuasion, organization, and money to help politicians win votes have more influence, so Statement I is false. In markets, purchasing power depends on income, so Statement II is true. It's tempting to think one person, one vote equalizes influence, but votes are only part of political influence."}, {"id": 259, "ch": 6, "q": "A classmate argues: \"Markets fail because of externalities and public goods, so moving a decision to government will make the outcome efficient.\" What is wrong with this reasoning?", "opts": ["Government has its own failures, such as special interests and rent seeking", "Externalities and public goods are not real sources of market failure", "Government corrects externalities well, but public goods are best left to markets", "Market failures correct themselves over time, so government adds little"], "exp": "Both political and market organization have shortcomings: the special interest effect, the shortsightedness effect, rent seeking, and weak incentives for operational efficiency cause government failure. Improving outcomes requires comparing the strengths and weaknesses of both sectors, not assuming government is the cure."}, {"id": 260, "ch": 7, "q": "Use the table. What was the growth rate of real GDP from 2024 to 2025?", "opts": ["10.0%", "15.5%", "10.5%", "5.0%"], "exp": "Real GDP in 2025 = 2,310 / 1.05 = 2,200, so real growth = (2,200 - 2,000) / 2,000 = 10.0%. The tempting 15.5% is nominal growth, which mixes higher output with higher prices, and 10.5% comes from subtracting the 5% price rise from 15.5%, a shortcut that is only approximate.", "fig": {"type": "table", "head": ["Year", "Nominal GDP ($ billions)", "GDP deflator"], "rows": [["2024", "2,000", "100"], ["2025", "2,310", "105"]], "alt": "Table with two years. 2024: nominal GDP 2,000 billion dollars, GDP deflator 100. 2025: nominal GDP 2,310 billion dollars, GDP deflator 105."}}, {"id": 261, "ch": 7, "q": "Use the table of consumer price index values. What was the inflation rate during 2025?", "opts": ["4.0%", "4.2%", "9.2%", "5.0%"], "exp": "Inflation for 2025 = (218.4 - 210.0) / 210.0 x 100 = 4.0%. It's tempting to divide by 200, which gives 4.2%; the base of the percentage change is the previous year's index, not the earliest one. 9.2% is the two-year change, and 5.0% is the 2024 rate.", "fig": {"type": "table", "head": ["Year", "CPI"], "rows": [["2023", "200.0"], ["2024", "210.0"], ["2025", "218.4"]], "alt": "Table of CPI values: 2023 is 200.0, 2024 is 210.0, 2025 is 218.4."}}, {"id": 262, "ch": 7, "q": "Use the table. A grandparent's job paid $12,000 in 1980, and the same job pays $40,000 today. Which statement about purchasing power is correct?", "opts": ["The 1980 pay equals about $45,000 today, so it bought more", "The 1980 pay equals about $3,200 today, so today's pay buys more", "The 1980 pay equals about $36,900 today, so today's pay buys more", "The 1980 pay equals about $27,060 today, so today's pay buys more"], "exp": "Convert to current dollars: 12,000 x (307.5 / 82.0) = 12,000 x 3.75 = $45,000, which is more than $40,000. Flipping the ratio gives $3,200, and multiplying by 307.5 / 100 treats the 1980 index as if it were the base of 100, giving $36,900.", "fig": {"type": "table", "head": ["Year", "CPI", "Salary"], "rows": [["1980", "82.0", "$12,000"], ["Today", "307.5", "$40,000"]], "alt": "Table: in 1980 the CPI was 82.0 and the salary was 12,000 dollars. Today the CPI is 307.5 and the salary is 40,000 dollars."}}, {"id": 263, "ch": 7, "q": "Use the table of this year's transactions for a small economy. What is GDP?", "opts": ["$1,130 billion", "$1,250 billion", "$1,350 billion", "$1,440 billion"], "exp": "GDP = 700 + 200 + 250 + (90 - 110) = $1,130 billion. Used cars were produced in an earlier year, Social Security payments are transfers rather than purchases of output, and the steel is an intermediate good already in the price of the cars. Adding the transfers gives the tempting $1,250 billion, and adding imports instead of subtracting them gives $1,350 billion.", "fig": {"type": "table", "head": ["Item", "$ billions"], "rows": [["Household purchases of new goods and services", "700"], ["Household purchases of used cars", "40"], ["Gross private investment", "200"], ["Government purchases of goods and services", "250"], ["Social Security payments to retirees", "120"], ["Exports", "90"], ["Imports", "110"], ["Steel bought by automakers to build new cars", "150"]], "alt": "Table of eight items in billions of dollars: household purchases of new goods and services 700; household purchases of used cars 40; gross private investment 200; government purchases of goods and services 250; Social Security payments to retirees 120; exports 90; imports 110; steel bought by automakers to build new cars 150."}}, {"id": 264, "ch": 7, "q": "Which of these transactions adds to this year's GDP?", "opts": ["A house built this year that the builder has not yet sold", "A 2015 house resold this year for more than its original price", "Flour a bakery buys this year to bake bread it sells this year", "A monthly government payment to a retiree from Social Security"], "exp": "A newly built, unsold house is current production, counted as investment through inventories. The resold house is a used good produced years ago, the flour is an intermediate good embodied in the bread, and the retiree's payment is a transfer, not a purchase of output. The higher resale price is tempting, but no new production occurred."}, {"id": 265, "ch": 7, "q": "A farmer sells wheat to a miller for $1. The miller sells the flour to a baker for $3. The baker sells the bread to a customer for $6. A classmate says these sales add $10 to GDP. What is wrong with this reasoning?", "opts": ["Only the $6 final sale counts; adding all three double counts the wheat and flour", "Only the $1 wheat sale counts, since it is the raw material behind all later sales", "Only the $9 from the miller and baker counts, since farm output is not in GDP", "Only the $5 increase from wheat to bread counts, so the $1 farm sale is dropped"], "exp": "GDP counts only the final-user good. The $6 price of the bread already embodies the value of the wheat and the flour, so summing every stage counts them more than once. Farm products are counted when they reach a final user, so leaving out farm output is not the fix."}, {"id": 266, "ch": 7, "q": "Country A cracks down on tax evasion, and many contractors who had been paid in unreported cash start reporting their work. The amount of construction actually done does not change. What happens to measured GDP?", "opts": ["It rises, because work hidden in the underground economy is now recorded", "It is unchanged, because the amount of construction done stayed the same", "It falls, because contractors now pay more in taxes on the same work", "It rises, because the extra tax revenue is added to government purchases"], "exp": "Activity concealed to evade taxes or because it is illegal is missed by GDP, so measured GDP understates production while it stays hidden. Once the work is reported, measured GDP rises even though real production did not change. It's tempting to say GDP is unchanged because output is the same, but GDP counts only what gets recorded."}, {"id": 267, "ch": 7, "q": "A firm builds a new factory this year. Statement I: The wages paid to the construction workers show up in the resource cost-income approach. Statement II: In the expenditure approach, the factory is counted as government purchases.", "opts": ["Statement I is true and Statement II is false", "Statement I is false and Statement II is true", "Both Statement I and Statement II are true", "Both Statement I and Statement II are false"], "exp": "Wages are employee compensation, a cost-income component, so I is true. A factory built by a private firm is gross private investment, not government purchases, so II is false. The same production is captured once on the spending side and once on the income side."}, {"id": 268, "ch": 7, "q": "Countries X and Y have the same real GDP per person. Workers in X average 55-hour weeks with little vacation, while workers in Y average 38-hour weeks. What does this comparison show about GDP as a welfare measure?", "opts": ["Y is likely better off, since GDP leaves out leisure and the strain of extra work", "X is likely better off, since GDP adds value for the extra hours people work", "Both are equally well off, since equal real GDP per person means equal welfare", "Y is likely worse off, since its shorter weeks are subtracted from its GDP"], "exp": "GDP excludes leisure and the human costs of producing goods and services, so equal GDP can hide a large difference in well-being. Y gets the same output with far less work. It's tempting to treat equal real GDP per person as equal living standards, but GDP is only a broad indicator."}, {"id": 269, "ch": 7, "q": "Prices of new industrial machinery made and sold in the U.S. rise sharply, while prices of everything households buy stay the same. What happens to the two price indexes?", "opts": ["The GDP deflator rises while the consumer price index stays about the same", "The consumer price index rises while the GDP deflator stays about the same", "Both indexes rise by the same amount because they track the same prices", "Both indexes stay the same because machinery is an intermediate good"], "exp": "Investment goods are part of the GDP bundle, so the broader GDP deflator picks up their price increase. The CPI tracks only the bundle households buy, so it does not move. It's tempting to treat machinery as intermediate, but new equipment is final investment spending."}, {"id": 270, "ch": 7, "q": "The price of beef jumps 30% while chicken prices hold steady, and shoppers switch toward chicken. Which index will most likely report the highest inflation for this period?", "opts": ["The traditional CPI, whose basket still holds the old amount of beef", "The chained CPI, whose basket now holds the extra chicken purchases", "The GDP deflator, because its broad basket includes more beef", "The three equally, since each one tracks the same beef prices"], "exp": "The traditional CPI keeps the old quantities, so it ignores the shift away from beef and overstates the rise in living costs. The chained CPI adjusts quantities each month for this substitution, so it reports less inflation. The GDP deflator also accounts for substitution, which is why both generally show slightly lower inflation."}, {"id": 271, "ch": 7, "q": "Statement I: When a factory's output rises and its extra pollution damages a nearby river, GDP counts the added output with no deduction for the damage. Statement II: When employees work extra overtime, GDP counts the added output with no deduction for the leisure they give up.", "opts": ["Both Statement I and Statement II are true", "Statement I is true and Statement II is false", "Statement I is false and Statement II is true", "Both Statement I and Statement II are false"], "exp": "GDP makes no adjustment for harmful side effects of production, so I is true. It also excludes leisure and the human costs of production, so II is true. It's tempting to think pollution damage gets subtracted as an economic bad, but GDP has no such deduction, which is why rising GDP can overstate gains in well-being."}, {"id": 272, "ch": 7, "q": "A parent who earned $50,000 quits to stay home and care for their child, who had been in a $15,000-a-year daycare. What happens to measured GDP, and why?", "opts": ["It falls, though the child care is still produced, now outside the market", "It rises, since the family no longer spends $15,000 a year on paid daycare", "It is unchanged, since the same child care is produced either way", "It falls by $15,000, the market value of the daycare services lost"], "exp": "Both the parent's paid output and the daycare purchase disappear from GDP, but the child care itself continues as household production, which GDP does not count. Saying GDP is unchanged is tempting because the same care is provided, but nonmarket production is excluded."}, {"id": 273, "ch": 7, "q": "This year's laptops cost the same as last year's but are twice as powerful. If the price index treats them as the same product at the same price, what is the likely error?", "opts": ["Inflation is overstated and real output growth is understated", "Inflation is understated and real output growth is overstated", "Nominal GDP is overstated, while real GDP is measured correctly", "Neither is distorted, since the laptop's price did not change"], "exp": "The quality-adjusted price actually fell, so an index that ignores the improvement reports too much inflation. Deflating nominal GDP by a price index that is too high understates real output growth. Accurate real GDP depends on measuring price changes, including quality, accurately."}, {"id": 274, "ch": 7, "q": "A country's real GDP grows 2% this year while its population grows 3%. What happens to real GDP per capita?", "opts": ["It falls by about 1%", "It rises by about 1%", "It rises by about 5%", "It rises by about 2%"], "exp": "Per capita GDP is GDP divided by population. Output grew more slowly than the number of people sharing it, so per person output falls by about 2% - 3% = -1%. The tempting 2% ignores the population change entirely."}, {"id": 275, "ch": 8, "q": "Use the table for an economy's adults aged 16 and older. What is the unemployment rate?", "opts": ["10.0%", "6.5%", "11.1%", "35.0%"], "exp": "Labor force = 117 + 13 = 130 million, so the unemployment rate = 13 / 130 = 10.0%. Dividing by the whole adult population of 200 million gives the tempting 6.5%, and dividing by the employed gives 11.1%.", "fig": {"type": "table", "head": ["Group", "Millions of people"], "rows": [["Employed", "117"], ["Unemployed", "13"], ["Not in the labor force", "70"]], "alt": "Table: employed 117 million, unemployed 13 million, not in the labor force 70 million."}}, {"id": 276, "ch": 8, "q": "An economy has 240 million people aged 16 and older. Of these, 144 million are employed and 12 million are unemployed. What are the labor force participation rate and the employment-population ratio?", "opts": ["65.0% and 60.0%", "60.0% and 65.0%", "65.0% and 92.3%", "7.7% and 60.0%"], "exp": "Labor force = 144 + 12 = 156 million. Participation rate = 156 / 240 = 65.0%, and employment-population ratio = 144 / 240 = 60.0%. Swapping the two is the common slip; 92.3% divides the employed by the labor force, and 7.7% is the unemployment rate."}, {"id": 277, "ch": 8, "q": "Use the table of a small town's residents aged 16 and older. Using the official definitions, what is the town's unemployment rate?", "opts": ["13.3%", "26.7%", "17.7%", "5.8%"], "exp": "Employed = 50 + 10 + 5 = 65; unemployed = 6 on layoff + 4 searching = 10; labor force = 75, so the rate is 10 / 75 = 13.3%. Counting the part-time job seekers as unemployed gives 26.7%, adding the people who stopped looking gives 14 / 79 = 17.7%, and leaving out the laid-off workers gives 4 / 69 = 5.8%.", "fig": {"type": "table", "head": ["Residents", "Number"], "rows": [["Working full-time for pay", "50"], ["Working part-time for pay and looking for full-time work", "10"], ["Working 20 hours a week unpaid on the family farm", "5"], ["On layoff, expecting to be recalled", "6"], ["Not working and actively applying for jobs", "4"], ["Want a job but have not looked in months", "4"], ["Full-time students not working or looking", "12"], ["Retired", "8"]], "alt": "Table of 99 residents: 50 working full-time for pay; 10 working part-time for pay and looking for full-time work; 5 working 20 hours a week unpaid on the family farm; 6 on layoff expecting recall; 4 not working and actively applying for jobs; 4 who want a job but have not looked in months; 12 full-time students not working or looking; 8 retired."}}, {"id": 278, "ch": 8, "q": "A teenager works 10 hours a week without pay in his parents' hardware store and is not looking for any other job. How is he classified?", "opts": ["Not in the labor force", "Employed as family help", "Unemployed, since unpaid", "Employed part-time, unpaid"], "exp": "Unpaid work in a family enterprise counts as employment only at 15 or more hours a week, and he is not seeking a job, so he is neither employed nor unemployed. It's tempting to call any family-business worker employed, but the 15-hour threshold is part of the definition."}, {"id": 279, "ch": 8, "q": "Ana quits her accounting job to search for a better-paying one. Ben, a typesetter, loses his job when software replaces his trade. Cal is laid off from a furniture plant when sales drop across the economy in a recession. Which classification is correct?", "opts": ["Ana frictional, Ben structural, Cal cyclical", "Ana structural, Ben frictional, Cal cyclical", "Ana frictional, Ben cyclical, Cal structural", "Ana cyclical, Ben structural, Cal frictional"], "exp": "Ana is job shopping with imperfect information, which is frictional. Ben's skills are no longer demanded because of new technology, which is structural. Cal's job loss comes from a general downturn, which is cyclical. Mixing up frictional and structural is the most common error: ask whether better information alone would fix the problem."}, {"id": 280, "ch": 8, "q": "A news report says the unemployment rate is 4.5%. A classmate concludes that 4.5% of all adults have no job. What is wrong with this reasoning?", "opts": ["The rate is a share of the labor force, and retirees and students without jobs are not in it", "The rate is a share of the total population, including children under 16 who cannot work", "The rate is a share of the employed, so it compares job seekers with people holding jobs", "The rate measures cyclical unemployment, leaving frictional and structural out"], "exp": "The unemployment rate divides the unemployed by the labor force, which excludes people who are neither working nor seeking work, such as retirees, students, and homemakers. Far more than 4.5% of adults are without jobs. The rate also includes frictional and structural unemployment, not only cyclical."}, {"id": 281, "ch": 8, "q": "Statement I: A rise in the share of young workers in the labor force tends to raise the natural rate of unemployment. Statement II: More generous unemployment benefits tend to lower the natural rate of unemployment.", "opts": ["Statement I is true and Statement II is false", "Statement I is false and Statement II is true", "Both Statement I and Statement II are true", "Both Statement I and Statement II are false"], "exp": "Demographics and policy both affect the natural rate. Young workers switch jobs and job shop more, which pushes the natural rate up, so I is true. Higher unemployment benefits make longer searches less costly, which tends to raise the natural rate, so II is false."}, {"id": 282, "ch": 8, "q": "The natural rate of unemployment is 4.5%, but the actual unemployment rate has fallen to 3.5%. What does this suggest about the economy?", "opts": ["It is in a boom, with actual GDP temporarily above potential GDP", "It is in a recession, with actual GDP well below potential GDP", "It is at full employment, with cyclical unemployment equal to zero", "It has a permanently higher potential output and a lower natural rate"], "exp": "Actual unemployment falls below the natural rate during a boom, when output temporarily exceeds its maximum sustainable level. It's tempting to call any low unemployment full employment, but full employment means unemployment equals the natural rate, and a rate below it is not sustainable."}, {"id": 283, "ch": 8, "q": "The natural rate of unemployment is 5%, and during a recession the actual rate rises to 8%. Which statement is correct?", "opts": ["Cyclical unemployment is 3 points, and actual GDP is below potential", "Cyclical unemployment is 8 points, and actual GDP is below potential", "Cyclical unemployment is 3 points, and actual GDP is above potential", "Cyclical unemployment is 5 points, and actual GDP equals potential"], "exp": "The natural rate covers frictional and structural unemployment, so the excess, 8 - 5 = 3 percentage points, is cyclical. In a recession actual unemployment is above the natural rate and actual GDP is below potential. Counting all 8 points as cyclical forgets that normal job shopping continues in every phase."}, {"id": 284, "ch": 8, "q": "The graph shows real GDP over time along with its long-run trend. Which phase of the business cycle is the economy in at each labeled point?", "opts": ["A contraction, B trough, C expansion, D peak", "A peak, B contraction, C trough, D expansion", "A expansion, B trough, C contraction, D peak", "A trough, B contraction, C peak, D expansion"], "exp": "The phase depends on the direction real GDP is moving, not on where it sits relative to the trend. A is on a falling stretch, so contraction; B is the bottom, the recessionary trough; C is rising, so expansion; D is the top, the peak. Listing the phases in memorized order starting from A is tempting, but the graph does not start at a peak.", "fig": {"type": "graph", "x": "Time", "y": "Real GDP", "lines": [{"pts": [[8, 20], [92, 57.8]], "cls": "m", "label": "Trend"}, {"pts": [[8, 20], [14, 30.3], [20, 37.8], [26, 40.5], [32, 38.4], [38, 33.5], [44, 28.6], [50, 26.5], [56, 29.2], [62, 36.7], [68, 47.0], [74, 57.3], [80, 64.8], [86, 67.5], [92, 65.4]], "cls": "d", "label": "Real GDP"}], "points": [{"at": [38, 33.5], "label": "A"}, {"at": [50, 26.5], "label": "B"}, {"at": [68, 47.0], "label": "C"}, {"at": [86, 67.5], "label": "D"}], "guides": false, "alt": "A wavy real GDP curve rises and falls around a straight, upward-sloping trend line over time. Point A is on a falling stretch of the curve, where it crosses the trend line. Point B is the lowest point of the dip that follows. Point C is on a rising stretch, where the curve crosses the trend line again. Point D is the high point at the top of the next rise."}}, {"id": 285, "ch": 8, "q": "The graph shows potential GDP and actual GDP over time. Which statement about the labeled points is correct?", "opts": ["At F unemployment is above the natural rate, and G is at full employment", "At E unemployment is above the natural rate, and G is at full employment", "At F unemployment is above the natural rate, and E is at full employment", "At E unemployment is below the natural rate, and F is at full employment"], "exp": "Where actual GDP is below potential, as at F, the economy is in a slump and unemployment exceeds the natural rate. Actual and potential output are equal only at full employment, which is point G. Point E is tempting as full employment because output is high, but output above potential means unemployment is below the natural rate.", "fig": {"type": "graph", "x": "Time", "y": "Real GDP", "lines": [{"pts": [[10, 25], [90, 70]], "cls": "v", "label": "Potential"}, {"pts": [[10, 25], [15, 32.5], [20, 38.2], [22.5, 40.0], [25, 41.0], [30, 41.0], [35, 39.1], [40, 37.2], [45, 37.1], [47.5, 38.1], [50, 39.9], [55, 45.6], [60, 53.1], [65, 60.6], [70, 66.4]], "cls": "d", "label": "Actual"}], "points": [{"at": [22.5, 40.0], "label": "E"}, {"at": [35, 39.1], "label": "G"}, {"at": [47.5, 38.1], "label": "F"}], "guides": false, "alt": "A straight upward-sloping potential GDP line and a wavy actual GDP curve over time. At point E the actual GDP curve is above the potential GDP line. At point G the actual GDP curve crosses the potential GDP line. At point F the actual GDP curve is below the potential GDP line."}}, {"id": 286, "ch": 8, "q": "A recession ends in June, and real GDP starts growing again. Based on the U.S. record since 1960, what typically happens to the unemployment rate around this turning point?", "opts": ["It soon starts falling, but it stays above the natural rate for a while", "It drops back to the natural rate as soon as real GDP starts to grow", "It keeps climbing for years, until real GDP is back at its prior peak", "It soon falls below the natural rate as firms rehire laid-off workers"], "exp": "Unemployment rose rapidly in each recession and began to decline soon after the expansion started, but the actual rate stayed above the natural rate during and immediately after each recession. It's tempting to expect an instant return to the natural rate, but the recovery in jobs takes time."}, {"id": 287, "ch": 8, "q": "A classmate argues: when inflation runs high, people learn to expect it and write it into their contracts, so high inflation does little harm. What is the main flaw in this argument?", "opts": ["High inflation is usually highly variable, so it is hard to anticipate", "High inflation is usually steady, so contracts are written too cautiously", "Anticipated inflation is what disrupts contracts, not the surprise part", "Contracts cannot include inflation, so even steady inflation is a surprise"], "exp": "When inflation is high, its year-to-year changes are nearly always highly variable, so much of it comes as a surprise. Unanticipated inflation alters the outcomes of long-term contracts and projects, raising risk and slowing investment. Blaming anticipated inflation reverses the point: expected inflation can be built into contracts."}, {"id": 288, "ch": 8, "q": "During a period of 8% inflation, a furniture maker sees the price of its tables rise 8% and hires more workers, thinking demand for tables has grown. Prices of everything else also rose 8%. Which harm of inflation does this illustrate?", "opts": ["Inflation distorts the information that prices deliver", "Inflation lowers potential output by shrinking the labor force", "Inflation raises structural unemployment in furniture making", "Inflation raises the risk of long-term investment projects"], "exp": "The table's relative price did not change, but the firm read a general price rise as a signal of stronger demand. Distorted price signals lead to poor production decisions. It's tempting to call this structural unemployment, but nothing about workers' skills is involved."}, {"id": 289, "ch": 8, "q": "A country's central bank expands the money supply by 25% a year, while real output grows about 3% a year. What is the most likely result?", "opts": ["Rising prices, as aggregate demand grows faster than the supply of goods", "Falling prices, as the extra money raises output well above its potential", "Steady prices, since output is also growing and absorbs the extra money", "Rising unemployment, as businesses cut output in response to more money"], "exp": "When aggregate demand rises faster than aggregate supply, prices rise, and nearly all economists link rapid money growth to inflation: too much money chasing too few goods. Output growth of 3% cannot keep pace with 25% money growth, so the extra money is not absorbed."}, {"id": 290, "ch": 9, "q": "In the graph, short-run equilibrium occurs at price level P1. Suppose the price level is currently P2 instead. What happens?", "opts": ["Quantity supplied at B exceeds quantity demanded at A, so the price level falls", "Quantity demanded at A exceeds quantity supplied at B, so the price level rises", "Quantity supplied at B exceeds quantity demanded at A, so the price level rises", "Firms earn high profits at P2, so the price level stays there in the short run"], "exp": "At P2, buyers want only the output at A while sellers want to supply the output at B, so there is excess supply and the price level falls toward P1. It's tempting to pick excess demand, but that happens only when the price level is **below** the equilibrium level P1.", "fig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "d", "label": "AD"}, {"pts": [[20, 20], [85, 85]], "cls": "s", "label": "SRAS"}, {"pts": [[8, 70], [92, 70]], "cls": "m", "label": ""}], "points": [{"at": [50, 50], "label": "E"}, {"at": [30, 70], "label": "A"}, {"at": [70, 70], "label": "B"}], "guides": true, "yticks": [[50, "P1"], [70, "P2"]], "alt": "A downward-sloping AD curve and an upward-sloping SRAS curve cross at point E at price level P1. A horizontal line at the higher price level P2 meets AD at point A on the left and SRAS at point B on the right."}}, {"id": 291, "ch": 9, "q": "The economy is at point E in the graph. Which statement best describes this situation?", "opts": ["Unemployment is below the natural rate, and output Y1 cannot be sustained", "E is a long-run equilibrium, since the AD and SRAS curves intersect there", "Output Y1 is sustainable, because higher prices keep firms' profits high", "Unemployment is above the natural rate, since output differs from YF"], "exp": "E is a short-run equilibrium to the right of LRAS, so output exceeds the economy's sustainable potential and unemployment is below the natural rate. Output beyond YF can be reached temporarily but not sustained, because resource prices rise once contracts expire. It's tempting to call E a long-run equilibrium, but that requires AD, SRAS, **and** LRAS to meet at one point.", "fig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[35, 85], [95, 25]], "cls": "d", "label": "AD"}, {"pts": [[20, 20], [85, 85]], "cls": "s", "label": "SRAS"}, {"pts": [[50, 8], [50, 92]], "cls": "v", "label": "LRAS"}], "points": [{"at": [60, 60], "label": "E"}], "guides": true, "xticks": [[50, "YF"], [60, "Y1"]], "yticks": [[60, "P1"]], "alt": "AD and SRAS cross at point E at output Y1 and price level P1. A vertical LRAS line stands at output YF, to the left of Y1."}}, {"id": 292, "ch": 9, "q": "In the graph, AD, SRAS, and LRAS all pass through point E. Statement I: At E, the actual price level equals the price level people anticipated when they signed their contracts. Statement II: At E, the unemployment rate is zero because output equals YF.", "opts": ["Statement I is true and Statement II is false", "Both Statement I and Statement II are true", "Statement I is false and Statement II is true", "Both Statement I and Statement II are false"], "exp": "Long-run equilibrium requires that people correctly anticipated the price level, so Statement I is true. Statement II is false: at YF the actual unemployment rate equals the natural rate, which still includes frictional and structural unemployment; only cyclical unemployment is absent.", "fig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "d", "label": "AD"}, {"pts": [[20, 20], [85, 85]], "cls": "s", "label": "SRAS"}, {"pts": [[50, 8], [50, 92]], "cls": "v", "label": "LRAS"}], "points": [{"at": [50, 50], "label": "E"}], "guides": true, "xticks": [[50, "YF"]], "yticks": [[50, "P1"]], "alt": "A downward-sloping AD curve, an upward-sloping SRAS curve, and a vertical LRAS line all pass through point E at output YF and price level P1."}}, {"id": 293, "ch": 9, "q": "The graph shows the loanable funds market at E1, when people expect stable prices, and at E2, after borrowers and lenders come to expect 5% annual inflation. At E2, what are the money interest rate and the real interest rate?", "opts": ["Money rate 11%, real rate 6%", "Money rate 6%, real rate 11%", "Money rate 11%, real rate 11%", "Money rate 11%, real rate 5%"], "exp": "The market interest rate on the graph is the money rate, so at E2 it is 11%. Subtracting the 5% inflationary premium gives a real rate of 6%, the same as before, because lenders demand the premium and borrowers are willing to pay it. It's tempting to call 5% the real rate, but 5% is the expected inflation, not the real return.", "fig": {"type": "graph", "x": "Quantity of loanable funds", "y": "Interest rate", "lines": [{"pts": [[15, 75], [80, 10]], "cls": "m", "label": "D1"}, {"pts": [[20, 10], [85, 75]], "cls": "m", "label": "S1"}, {"pts": [[35, 80], [95, 20]], "cls": "d", "label": "D2", "dash": true}, {"pts": [[8, 23], [75, 90]], "cls": "s", "label": "S2", "dash": true}], "points": [{"at": [50, 40], "label": "E1"}, {"at": [50, 65], "label": "E2"}], "guides": true, "yticks": [[40, "6%"], [65, "11%"]], "alt": "Original demand D1 and supply S1 for loanable funds cross at E1 at an interest rate of 6%. New curves D2 and S2, each shifted upward, cross at E2 at an interest rate of 11%, at the same quantity of funds as E1."}}, {"id": 294, "ch": 9, "q": "The graph shows the market for foreign currency from the U.S. point of view. Which transactions lie behind the demand curve D and the supply curve S?", "opts": ["D: U.S. imports and capital outflow; S: U.S. exports and capital inflow", "D: U.S. exports and capital inflow; S: U.S. imports and capital outflow", "D: U.S. imports and capital inflow; S: U.S. exports and capital outflow", "D: U.S. exports and capital outflow; S: U.S. imports and capital inflow"], "exp": "Americans demand foreign currency to buy imports and to invest abroad, which is capital outflow. Foreigners supply foreign currency when they buy U.S. exports and U.S. assets such as bonds, which is capital inflow. It's tempting to put capital inflow on the demand side, but when foreigners buy U.S. assets they are supplying their currency to get dollars.", "fig": {"type": "graph", "x": "Quantity of foreign currency", "y": "Dollar price of foreign currency", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "d", "label": "D"}, {"pts": [[15, 15], [85, 85]], "cls": "s", "label": "S"}], "points": [{"at": [50, 50], "label": "E"}], "guides": true, "xticks": [[50, "Q*"]], "alt": "A downward-sloping demand curve D and an upward-sloping supply curve S for foreign currency cross at point E at quantity Q*."}}, {"id": 295, "ch": 9, "q": "A lender and a borrower agree on a one-year loan at a 9% money interest rate, both expecting 3% inflation. Actual inflation turns out to be 7%. What real interest rate did the lender actually earn, and who gained?", "opts": ["2%, and the borrower gained at the lender's expense", "6%, and neither gained since the rate was agreed upon", "2%, and the lender gained at the borrower's expense", "16%, and the lender gained at the borrower's expense"], "exp": "The expected real rate was 9% − 3% = 6%, but the realized real rate was 9% − 7% = 2%. When actual inflation is greater than anticipated, borrowers repay with dollars worth less than expected, so borrowers gain at the expense of lenders. It's tempting to answer 6%, but that was only the real rate the parties **expected**."}, {"id": 296, "ch": 9, "q": "In 2025 a credit union made five-year fixed-rate car loans that built in an expected inflation rate of 4%. Over the following years, inflation averages only 1%. Which statement is correct?", "opts": ["The credit union gains, because borrowers repay in dollars worth more than expected", "Borrowers gain, because lower inflation reduces the money interest rate they owe", "Neither side gains, because the money interest rate was fixed in the contract", "Borrowers gain, because they repay in dollars with more purchasing power than planned"], "exp": "When actual inflation is less than anticipated, lenders gain at the expense of borrowers: the inflationary premium built into the fixed rate turns out to be too high, so borrowers pay a higher real rate than planned. It's tempting to think a fixed money rate protects both sides, but fixing the money rate is exactly why the real rate changes when inflation surprises."}, {"id": 297, "ch": 9, "q": "A classmate says: \"If market interest rates fall next year, I should sell my bonds now, because their prices will drop.\" What is wrong with this reasoning?", "opts": ["Falling interest rates raise the prices of previously issued bonds", "Falling interest rates lower the fixed rate paid on existing bonds", "Bond prices depend on the issuer's profits rather than interest rates", "Lower interest rates raise inflation, which cuts bonds' real value"], "exp": "Bondholders keep receiving the rate fixed on the bond, so when new bonds pay less, older bonds with higher fixed payments become more valuable and their prices rise. It's tempting to think the payments on old bonds fall along with market rates, but a bond's rate is set when it is issued."}, {"id": 298, "ch": 9, "q": "In a year, a country with a market-determined exchange rate imports $900 billion of goods and services and exports $700 billion. Its residents invest $150 billion abroad. How much capital flowed into the country from foreigners?", "opts": ["$350 billion", "$50 billion", "$200 billion", "$1,050 billion"], "exp": "Imports − exports = capital inflow − capital outflow, so $900 − $700 = $200 billion = inflow − $150 billion, giving an inflow of $350 billion. It's tempting to stop at $200 billion, but that is net capital inflow; the gross inflow must also cover the $150 billion that went out."}, {"id": 299, "ch": 9, "q": "Last year one euro cost $1.20. This year one euro costs $1.05. What happened to the dollar, and how will U.S. net exports tend to respond?", "opts": ["The dollar appreciated, so U.S. net exports tend to fall", "The dollar depreciated, so U.S. net exports tend to rise", "The dollar appreciated, so U.S. net exports tend to rise", "The dollar depreciated, so U.S. net exports tend to fall"], "exp": "Fewer dollars are now needed to buy a euro, so the dollar has appreciated. A stronger dollar makes European goods cheaper for Americans and U.S. goods pricier for Europeans, so imports rise, exports fall, and net exports decline. It's tempting to read the smaller number as a weaker dollar, but it is the price of a euro that fell."}, {"id": 300, "ch": 9, "q": "A classmate argues: \"Since firms expand output when the price level rises unexpectedly, steady inflation can keep output above full employment indefinitely.\" What is the flaw?", "opts": ["Once contracts adjust to the higher prices, profit margins shrink and output returns to YF", "Firms reduce output when the price level rises, because their costs rise right away", "A higher price level shifts LRAS to the left, so output falls below full employment", "Output cannot exceed YF even briefly, since the LRAS curve is a vertical line"], "exp": "An unanticipated rise in the price level expands output only because contracted costs lag behind. When contracts expire, resource prices catch up, profit margins return to normal, and output moves back to YF, which is set by resources, technology, and institutions. It's tempting to say output can never exceed YF, but it can temporarily; it just cannot be sustained."}, {"id": 301, "ch": 9, "q": "Two countries each run trade deficits of the same size. Country A uses the net capital inflow to build factories and modern ports. Country B uses it to finance government budget deficits that support current consumption. Which comparison is most accurate?", "opts": ["A's borrowing is likely to raise future income, while B's is likely to lower it", "Both face lower future income, because a trade deficit drains national wealth", "B gains more, because consumption spending adds to GDP faster than investment", "Both gain equally, because the size of their capital inflows is the same"], "exp": "Whether a trade deficit is harmful depends on how the borrowed funds are used. Productive investment raises future productivity and income; borrowing to fund current consumption, as with recent U.S. federal deficits, reduces capital formation and slows growth. It's tempting to see every trade deficit as a loss, but the deficit simply mirrors an inflow of capital."}, {"id": 302, "ch": 9, "q": "This year's price level turns out higher than buyers and sellers anticipated when they signed their wage contracts. In the short run, which set of outcomes is most likely?", "opts": ["Real wages fall, employment rises, and unemployment drops below the natural rate", "Real wages rise, employment falls, and unemployment climbs above the natural rate", "Real wages fall, employment falls, and unemployment climbs above the natural rate", "Real wages are unchanged, because nominal wages rise with the price level at once"], "exp": "Nominal wages are fixed by the contracts, so a surprise rise in prices cuts real wages and widens profit margins. Firms expand output and hire more, pushing unemployment below the natural rate, but this cannot be sustained once contracts are renegotiated. It's tempting to think the higher cost of living hurts employment, but in the short run lower real labor costs encourage hiring."}, {"id": 303, "ch": 9, "q": "The price level falls. Households and firms now need less money for their purchases, so they lend out more, the real interest rate declines, and firms borrow to buy new equipment. This chain explains which feature of the AD–AS model?", "opts": ["Why the aggregate demand curve slopes downward", "Why the short-run aggregate supply curve slopes up", "Why the aggregate demand curve shifts to the right", "Why the long-run aggregate supply curve is vertical"], "exp": "A lower price level reduces the demand for money and lowers the real interest rate, which stimulates purchases; this is one of the three reasons AD slopes downward, a movement along a given AD curve. It's tempting to call it a rightward shift because a lower real interest rate appears on the list of AD shifters, but that list covers changes in the real interest rate caused by something other than the price level. Here the price level itself started the chain, so the economy moves along AD."}, {"id": 304, "ch": 9, "q": "In Country A, investment opportunities are weak, so domestic demand for loanable funds is low and its real interest rate is below rates abroad. In Country B, strong investment demand has pushed the real interest rate above rates abroad. In a global loanable funds market, which capital flows are expected?", "opts": ["Capital flows out of A and into B, seeking the higher expected rate of return", "Capital flows into A and out of B, since A's low rates make its borrowing cheap", "Capital flows out of both, because each country's real rate differs from abroad", "Capital flows out of B and into A, since B's high real rates signal greater risk"], "exp": "Capital moves toward markets where the expected rate of return is higher: weak domestic demand and a low real interest rate lead to a capital outflow, while strong demand and a high real rate attract an inflow. It's tempting to think cheap borrowing pulls capital in, but lenders decide where funds go, and they seek higher returns."}, {"id": 305, "ch": 10, "q": "The economy starts at E1. Which event could cause the change shown in the graph?", "opts": ["A surge in stock prices that raises households' real wealth", "A rise in the real interest rate that makes borrowing costlier", "A technological advance that raises productivity across firms", "A drop in resource prices that lowers firms' production costs"], "exp": "The graph shows AD shifting right while SRAS and LRAS stay put, and higher real wealth from a stock market boom is an AD shifter. Lower resource prices would also raise output, but they shift SRAS, not AD; a technology gain shifts LRAS and SRAS; and a higher real interest rate shifts AD to the left.", "fig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "m", "label": "AD1"}, {"pts": [[35, 85], [95, 25]], "cls": "d", "label": "AD2", "dash": true}, {"pts": [[20, 20], [85, 85]], "cls": "s", "label": "SRAS"}, {"pts": [[50, 8], [50, 92]], "cls": "v", "label": "LRAS"}], "points": [{"at": [50, 50], "label": "E1"}, {"at": [60, 60], "label": "E2"}], "guides": true, "xticks": [[50, "YF"], [60, "Y2"]], "yticks": [[50, "P1"], [60, "P2"]], "arrows": [{"from": [72, 30], "to": [87, 30]}], "alt": "AD1 and SRAS cross at E1 on the vertical LRAS line at YF and price level P1. A second curve, AD2, lies to the right of AD1 and crosses SRAS at E2, at output Y2 and the higher price level P2. An arrow points from AD1 toward AD2."}}, {"id": 306, "ch": 10, "q": "An unanticipated increase in aggregate demand moves the economy from A to B. If policy does not change, where does the economy settle in the long run, and why?", "opts": ["At C, as rising resource prices shift SRAS to the left", "At B, as the stronger demand keeps output at Y2 for good", "At A, as buyers adjust and AD shifts back to its old position", "Beyond Y2, as LRAS shifts right to meet the higher AD2"], "exp": "At B, output exceeds YF and resource markets are tight. As contracts expire, resource prices, including wages, rise and shift SRAS left until it crosses AD2 at C, with output back at YF and a higher price level. It's tempting to pick B, but the increase in demand expands output only temporarily.", "fig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "m", "label": "AD1"}, {"pts": [[35, 85], [95, 25]], "cls": "d", "label": "AD2"}, {"pts": [[20, 20], [85, 85]], "cls": "s", "label": "SRAS1"}, {"pts": [[50, 8], [50, 92]], "cls": "v", "label": "LRAS"}], "points": [{"at": [50, 50], "label": "A"}, {"at": [60, 60], "label": "B"}, {"at": [50, 70], "label": "C"}], "guides": true, "xticks": [[50, "YF"], [60, "Y2"]], "yticks": [[50, "P1"], [60, "P2"], [70, "P3"]], "alt": "AD1 and SRAS1 cross at point A on the vertical LRAS line at YF and price level P1. AD2, to the right of AD1, crosses SRAS1 at point B at output Y2 and price level P2. Point C lies on AD2 directly above A on the LRAS line, at price level P3."}, "expFig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "m", "label": "AD1"}, {"pts": [[35, 85], [95, 25]], "cls": "d", "label": "AD2"}, {"pts": [[20, 20], [85, 85]], "cls": "s", "label": "SRAS1"}, {"pts": [[50, 8], [50, 92]], "cls": "v", "label": "LRAS"}, {"pts": [[10, 30], [70, 90]], "cls": "s", "label": "SRAS2", "dash": true}], "points": [{"at": [50, 50], "label": "A"}, {"at": [60, 60], "label": "B"}, {"at": [50, 70], "label": "C"}], "guides": true, "xticks": [[50, "YF"], [60, "Y2"]], "yticks": [[50, "P1"], [60, "P2"], [70, "P3"]], "arrows": [{"from": [74, 76], "to": [58, 76]}], "alt": "Same graph with a new curve SRAS2, to the left of SRAS1, crossing AD2 at point C on the LRAS line at price level P3. An arrow points from SRAS1 toward SRAS2."}}, {"id": 307, "ch": 10, "q": "After an unanticipated shift from AD1 to AD2, the economy is at E2. Which statement correctly describes E2 and what happens next if policy does not change?", "opts": ["Unemployment exceeds the natural rate; falling resource prices and real interest rates gradually restore YF", "Unemployment is below the natural rate; falling resource prices and real interest rates gradually restore YF", "Unemployment exceeds the natural rate; rising resource prices shift SRAS to the left and restore YF", "Output Y2 becomes the new full-employment level, since LRAS shifts left to follow AD2"], "exp": "At E2, output is below YF, so unemployment is above the natural rate and many firms incur losses. Over time, weak demand lowers resource prices, shifting SRAS right, and lower real interest rates support AD, returning output to YF at a lower price level, though this can be a lengthy and painful process. It's tempting to say resource prices rise, but that is the adjustment after a boom.", "fig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "m", "label": "AD1"}, {"pts": [[8, 72], [68, 12]], "cls": "d", "label": "AD2", "dash": true}, {"pts": [[20, 20], [85, 85]], "cls": "s", "label": "SRAS1"}, {"pts": [[50, 8], [50, 92]], "cls": "v", "label": "LRAS"}], "points": [{"at": [50, 50], "label": "E1"}, {"at": [40, 40], "label": "E2"}], "guides": true, "xticks": [[40, "Y2"], [50, "YF"]], "yticks": [[40, "P2"], [50, "P1"]], "alt": "AD1 and SRAS1 cross at E1 on the vertical LRAS line at YF and price level P1. AD2, to the left of AD1, crosses SRAS1 at E2 at the lower output Y2 and lower price level P2."}, "expFig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "m", "label": "AD1"}, {"pts": [[8, 72], [68, 12]], "cls": "d", "label": "AD2", "dash": true}, {"pts": [[20, 20], [85, 85]], "cls": "m", "label": "SRAS1"}, {"pts": [[30, 10], [95, 75]], "cls": "s", "label": "SRAS2", "dash": true}, {"pts": [[50, 8], [50, 92]], "cls": "v", "label": "LRAS"}], "points": [{"at": [50, 50], "label": "E1"}, {"at": [40, 40], "label": "E2"}, {"at": [50, 30], "label": "E3"}], "guides": true, "xticks": [[40, "Y2"], [50, "YF"]], "yticks": [[30, "P3"], [40, "P2"], [50, "P1"]], "arrows": [{"from": [72, 70], "to": [86, 70]}], "alt": "Same graph with SRAS2, to the right of SRAS1, crossing AD2 at E3 on the LRAS line at YF and the even lower price level P3."}}, {"id": 308, "ch": 10, "q": "A crop failure raises resource prices and moves the economy from E1 to E2. If the crop failure turns out to be temporary, what is the long-run outcome?", "opts": ["Resource prices fall back, SRAS returns to SRAS1, and the economy returns to E1", "LRAS shifts left to Y2, and E2 becomes the economy's new long-run equilibrium", "The price level stays at P2 while output alone recovers to the YF output rate", "AD shifts left to bring the price level back down to P1 at the lower output rate Y2"], "exp": "Because the shock is temporary, resource prices eventually fall, SRAS shifts back to SRAS1, and the economy returns to E1 with output at YF and price level P1. It's tempting to pick the LRAS shift, but that is the outcome only if the adverse supply shock is **permanent**.", "fig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "d", "label": "AD"}, {"pts": [[20, 20], [85, 85]], "cls": "m", "label": "SRAS1"}, {"pts": [[10, 30], [70, 90]], "cls": "s", "label": "SRAS2", "dash": true}, {"pts": [[50, 8], [50, 92]], "cls": "v", "label": "LRAS"}], "points": [{"at": [50, 50], "label": "E1"}, {"at": [40, 60], "label": "E2"}], "guides": true, "xticks": [[40, "Y2"], [50, "YF"]], "yticks": [[50, "P1"], [60, "P2"]], "alt": "AD crosses SRAS1 at E1 on the vertical LRAS line at YF and price level P1. SRAS2, to the left of SRAS1, crosses AD at E2 at the lower output Y2 and the higher price level P2."}}, {"id": 309, "ch": 10, "q": "The graph shows LRAS1 shifting to LRAS2 and SRAS1 shifting to SRAS2. Which event could cause both shifts?", "opts": ["Capital formation that enlarges the economy's stock of machines", "An unusually favorable growing season that yields a bumper crop", "A reduction in the expected rate of inflation built into contracts", "A temporary drop in the world price of a key imported resource"], "exp": "An increase in the supply of resources such as capital raises the economy's sustainable output, shifting LRAS right, and an LRAS shift moves SRAS in the same direction. Good weather, lower expected inflation, and cheaper imported resources shift only SRAS, because they don't change long-run capacity. It's tempting to pick the bumper crop, but a one-season gain cannot be counted on in the future.", "fig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "d", "label": "AD"}, {"pts": [[20, 20], [85, 85]], "cls": "m", "label": "SRAS1"}, {"pts": [[32, 20], [82, 70]], "cls": "s", "label": "SRAS2", "dash": true}, {"pts": [[50, 8], [50, 92]], "cls": "m", "label": "LRAS1"}, {"pts": [[62, 8], [62, 92]], "cls": "v", "label": "LRAS2", "dash": true}], "points": [{"at": [50, 50], "label": "E1"}], "guides": true, "xticks": [[50, "YF1"], [62, "YF2"]], "yticks": [[50, "P1"]], "arrows": [{"from": [52, 86], "to": [60, 86]}], "alt": "AD crosses SRAS1 at E1 on the vertical line LRAS1 at output YF1. A second vertical line, LRAS2, stands at the larger output YF2, and SRAS2 lies to the right of SRAS1, crossing LRAS2 at the same price level as E1. An arrow points from LRAS1 toward LRAS2."}}, {"id": 310, "ch": 10, "q": "The economy moves from E1 to E2 in the graph. Which event fits this change?", "opts": ["An unexpected fall in the world price of a key imported resource", "A lasting improvement in technology that raises productivity", "An increase in the expected rate of inflation among most businesses", "A depreciation of the dollar that raises U.S. net exports"], "exp": "SRAS shifts right while AD and LRAS stay put, which is a favorable supply shock such as a drop in the world price of a key imported resource; output temporarily exceeds YF and the price level falls. A lasting technology gain would shift LRAS as well, higher expected inflation shifts SRAS left, and a weaker dollar shifts AD.", "fig": {"type": "graph", "x": "Real GDP", "y": "Price level", "lines": [{"pts": [[15, 85], [85, 15]], "cls": "d", "label": "AD"}, {"pts": [[20, 20], [85, 85]], "cls": "m", "label": "SRAS1"}, {"pts": [[30, 10], [95, 75]], "cls": "s", "label": "SRAS2", "dash": true}, {"pts": [[50, 8], [50, 92]], "cls": "v", "label": "LRAS"}], "points": [{"at": [50, 50], "label": "E1"}, {"at": [60, 40], "label": "E2"}], " const QS = DATA.qs, NAMES = DATA.names;
const KEY = "econQuizMissed_v1";

// Retired questions stay in the data so ids never shift (saved weak spots are ids), but are never asked.
const live = i => QS[i] && !QS[i].retired;
const ACTIVE = QS.filter(q=>!q.retired);

function loadMissed(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY)||"[]")); }catch(e){ return new Set(); } }
function saveMissed(s){ try{ localStorage.setItem(KEY, JSON.stringify([...s])); }catch(e){} }

if([...missed].some(i=>!live(i))){ missed = new Set([...missed].filter(live)); saveMissed(missed); }

const chapters = [...new Set(ACTIVE.map(q=>q.ch))].sort((a,b)=>a-b);

/* text: escape everything, then allow **bold** as the only formatting */
const esc = t => String(t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const plain = t => String(t).replace(/\*\*(.+?)\*\*/g, "$1");

/* figures: graphs are drawn on a 0-100 grid; tables are plain rows */
let figN = 0;
function figHTML(f){
  if(!f) return "";
  if(f.type === "table"){
    return `<figure class="fig"><div class="fig-scroll"><table>`
      + `<thead><tr>${f.head.map(h=>`<th scope="col">${esc(h)}</th>`).join("")}</tr></thead>`
      + `<tbody>${f.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>`
      + `</table></div><figcaption class="sr">${esc(f.alt||"")}</figcaption></figure>`;
  }
  const L=52, R=340, T=14, B=232, X=x=>L+x/100*(R-L), Y=y=>B-y/100*(B-T), id="ah"+(++figN);
  const p = pt=>`${X(pt[0]).toFixed(1)},${Y(pt[1]).toFixed(1)}`;
  function path(pts){
    if(pts.length < 3) return `M${p(pts[0])} L${pts.slice(1).map(p).join(" ")}`;
    let d = `M${p(pts[0])}`;   // Catmull-Rom spline through every point, as cubic Beziers
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
      const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
      d += ` C${p(c1)} ${p(c2)} ${p(p2)}`;
    }
    return d;
  }
  let s = `<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arh" d="M0,0 L10,5 L0,10 z"/></marker></defs>`;
  for(const pt of (f.guides ? f.points||[] : [])) s += `<path class="gd" d="M${X(0)},${Y(pt.at[1])} H${X(pt.at[0])} V${Y(0)}"/>`;
  // Labels are placed last, on top, and nudged down if they would overlap one already placed.
  const labels = [], placed = [];
  function label(text, cls, x, y, anchor){
    const w = String(text).length * 6.6 + 2, h = 12;
    const box = yy => anchor === "end" ? [x - w, yy - h, x, yy] : [x, yy - h, x + w, yy];
    const hits = bb => placed.some(o=>bb[0]<o[2] && bb[2]>o[0] && bb[1]<o[3] && bb[3]>o[1]);
    let b = box(y);
    for(const dy of [-13, 13, -26, 26, -39, 39]){   // try just above, then just below, then further out
      if(!hits(b)) break;
      b = box(y + dy); if(!hits(b)){ y += dy; break; }
      b = box(y);
    }
    placed.push(box(y));
    labels.push(`<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${esc(text)}</text>`);
  }
  for(const ln of f.lines||[]){
    const c = ["d","s","v","g","m"].includes(ln.cls) ? ln.cls : "v";
    s += `<path class="ln ${c}${ln.dash?" dash":""}" d="${path(ln.pts)}"/>`;
  }
  for(const a of f.arrows||[]) s += `<path class="ar" d="M${p(a.from)} L${p(a.to)}" marker-end="url(#${id})"/>`;
  for(const pt of f.points||[]){
    s += `<circle class="pt" cx="${X(pt.at[0])}" cy="${Y(pt.at[1])}" r="4"/>`;
    if(pt.label) label(pt.label, "v", X(pt.at[0])+7, Y(pt.at[1])-7, "start");
  }
  for(const ln of f.lines||[]){
    if(!ln.label) continue;
    const c = ["d","s","v","g","m"].includes(ln.cls) ? ln.cls : "v";
    const [lx,ly] = ln.pts[ln.pts.length-1], right = lx > 86;
    label(ln.label, c, X(lx)+(right?-4:5), Y(ly)-5, right ? "end" : "start");
  }
  s += labels.join("");
  for(const [x,t] of f.xticks||[]) s += `<text class="tl" x="${X(x)}" y="${B+15}" text-anchor="middle">${esc(t)}</text>`;
  for(const [y,t] of f.yticks||[]) s += `<text class="tl" x="${L-6}" y="${Y(y)+4}" text-anchor="end">${esc(t)}</text>`;
  s += `<path class="ax" d="M${L},${T-4} V${B} H${R+6}"/>`;
  s += `<text class="tl" x="${(L+R)/2}" y="${B+34}" text-anchor="middle">${esc(f.x||"")}</text>`;
  s += `<text class="tl" transform="translate(14 ${(T+B)/2}) rotate(-90)" text-anchor="middle">${esc(f.y||"")}</text>`;
  return `<figure class="fig"><svg viewBox="0 0 360 275" role="img" aria-label="${esc(f.alt||"Graph")}">${s}</svg></figure>`;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function show(id){ ["home","quiz","results"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }

/* home */
$("chips").innerHTML = chapters.map(c=>{
  const n = ACTIVE.filter(q=>q.ch===c).length;
  return `<label class="chip" title="${NAMES[c]}"><input type="checkbox" value="${c}" checked><span>Ch. ${c} <small>(${n})</small></span></label>`;
}).join("");
function picked(){ return [...document.querySelectorAll("#chips input:checked")].map(i=>+i.value); }
function refreshHome(){
  const p = picked(); const n = ACTIVE.filter(q=>p.includes(q.ch)).length;
  $("count").textContent = n ? `${n} questions selected.` : "Select at least one chapter to start.";
  $("start").disabled = !n;
  const w = missed.size;
  $("weakText").textContent = w ? `${w} question${w===1?"":"s"} you've missed and haven't nailed yet. They're saved in this browser.` : "No weak spots yet. Questions you miss will show up here.";
  $("startWeak").disabled = !w; $("clearWeak").disabled = !w; $("saveWeak").disabled = !w;
  $("saveNote").classList.add("hidden");
}
$("chips").addEventListener("change", refreshHome);
$("selAll").onclick = ()=>{ document.querySelectorAll("#chips input").forEach(i=>i.checked=true); refreshHome(); };
$("selNone").onclick = ()=>{ document.querySelectorAll("#chips input").forEach(i=>i.checked=false); refreshHome(); };
$("start").onclick = ()=> startRound(ACTIVE.filter(q=>picked().includes(q.ch)).map(q=>q.id));
$("startWeak").onclick = ()=> startRound([...missed]);
$("weakAfter").onclick = ()=> startRound([...missed]);
$("clearWeak").onclick = ()=>{ if(confirm("Clear all saved weak spots?")){ missed = new Set(); saveMissed(missed); refreshHome(); } };
$("again").onclick = ()=>{ refreshHome(); show("home"); };

/* save weak spots as a text file for a notes app */
function weakNotes(){
  const date = new Date().toLocaleDateString(undefined, {year:"numeric", month:"long", day:"numeric"});
  const qs = [...missed].filter(live).map(i=>QS[i]).sort((a,b)=>a.ch-b.ch || a.id-b.id);
  let out = `Macro practice quiz: weak spots\nSaved ${date} · ${qs.length} question${qs.length===1?"":"s"}\n`;
  let ch = null, n = 0;
  const figText = f => !f ? "" : f.type === "table"
    ? `   Table: ${[f.head, ...f.rows].map(r=>r.join(" | ")).join(" / ")}\n`
    : `   Graph: ${f.alt}\n`;
  for(const q of qs){
    if(q.ch !== ch){ ch = q.ch; out += `\n=== Ch. ${ch}: ${NAMES[ch]} ===\n`; }
    out += `\n${++n}. ${plain(q.q)}\n${figText(q.fig)}   Answer: ${plain(q.opts[0])}\n   Why: ${plain(q.exp)}\n`;
  }
  return out;
}
async function saveWeak(noteId){
  if(!missed.size) return;
  track("saved-to-notes", "Saved weak spots to notes");
  const text = weakNotes();
  const name = `macro-weak-spots-${new Date().toISOString().slice(0,10)}.txt`;
  const note = $(noteId);
  const say = msg => { note.textContent = msg; note.classList.remove("hidden"); };
  const file = new File([text], name, {type:"text/plain"});
  // On phones and tablets, open the share sheet so it can go straight into Notes.
  if(matchMedia("(pointer: coarse)").matches && navigator.share){
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:"Macro weak spots"});
      else await navigator.share({title:"Macro weak spots", text});
      say("Shared. Pick your notes app from the share menu.");
      return;
    }catch(e){
      if(e.name === "AbortError") return;
    }
  }
  const url = URL.createObjectURL(file);
  const a = Object.assign(document.createElement("a"), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  say(`Downloaded ${name}. Open it or drag it into your notes app.`);
}
$("saveWeak").onclick = ()=> saveWeak("saveNote");
$("saveWeakAfter").onclick = ()=> saveWeak("saveNoteAfter");
$("quit").onclick = finish;

/* quiz state */
let queue=[], firstSeen=new Set(), firstRight=0, perCh={}, answered=false, cur=null, curOpts=[], done=0, total=0;

function startRound(ids){
  ids = ids.filter(live);
  if(!ids.length) return;
  queue = shuffle(ids.slice()); firstSeen = new Set(); firstRight = 0; perCh = {}; done = 0; total = queue.length;
  track("round-started", "Round started");
  show("quiz"); nextQ();
}
function nextQ(){
  if(!queue.length){ finish(); return; }
  cur = QS[queue.shift()]; answered = false;
  curOpts = shuffle(cur.opts.map((t,i)=>({t, right:i===0})));
  $("tag").innerHTML = `<b>Ch. ${cur.ch}</b> ${NAMES[cur.ch]}`;
  $("meter").style.width = (100*done/Math.max(total,1))+"%";
  $("qtext").innerHTML = rich(cur.q);
  $("qfig").innerHTML = figHTML(cur.fig);
  // Options are divs acting as buttons (not <button>s) so their text can be highlighted and copied.
  $("opts").innerHTML = curOpts.map((o,i)=>`<div class="opt" role="button" tabindex="0"><span class="k" aria-hidden="true">${i+1}</span><span>${rich(o.t)}</span></div>`).join("");
  [...$("opts").children].forEach((b,i)=>{
    b.onclick = ()=>{
      const sel = getSelection();
      if(sel && !sel.isCollapsed && b.contains(sel.anchorNode)) return;   // dragging to highlight text isn't an answer
      answer(i);
    };
    b.onkeydown = e=>{ if((e.key==="Enter" || e.key===" ") && !answered){ e.preventDefault(); e.stopPropagation(); answer(i); } };
  });
  $("fb").classList.add("hidden"); $("next").classList.add("hidden");
  $("opts").firstChild.focus({preventScroll:true});
}
function answer(i){
  if(answered) return; answered = true;
  const ok = curOpts[i].right;
  [...$("opts").children].forEach((b,j)=>{
    b.classList.add("done"); b.setAttribute("aria-disabled","true"); b.tabIndex = -1;
    if(curOpts[j].right) b.classList.add("right");
    else if(j===i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const first = !firstSeen.has(cur.id);
  if(first){
    firstSeen.add(cur.id);
    const r = perCh[cur.ch] || [0,0]; perCh[cur.ch] = [r[0]+(ok?1:0), r[1]+1];
    if(ok){ firstRight++; missed.delete(cur.id); }
  }
  if(ok){ done++; } else { missed.add(cur.id); queue.push(cur.id); }
  saveMissed(missed);
  const fb = $("fb");
  fb.className = "feedback" + (ok ? "" : " no");
  fb.innerHTML = `<strong>${ok ? "Correct." : "Not quite."}</strong><span></span>` + (ok ? "" : `<p class="retry-note">This one will come back later in the round.</p>`);
  fb.querySelector("span").innerHTML = rich(cur.exp);
  if(cur.expFig) fb.querySelector("span").insertAdjacentHTML("afterend", figHTML(cur.expFig));
  $("meter").style.width = (100*done/Math.max(total,1))+"%";
  $("next").textContent = queue.length ? "Next question" : "See results";
  $("next").classList.remove("hidden"); $("next").focus({preventScroll:true});
}
$("next").onclick = nextQ;

function finish(){
  const n = firstSeen.size;
  if(!n){ refreshHome(); show("home"); return; }
  if(queue.length) track("round-ended-early", "Round ended early");
  else track("round-finished", "Round finished");
  const pct = Math.round(100*firstRight/n);
  $("score").textContent = pct + "%";
  $("scoreNote").textContent = `${firstRight} of ${n} right on the first try. Chapters under 75% are marked in orange.`;
  $("bars").innerHTML = Object.keys(perCh).map(Number).sort((a,b)=>a-b).map(c=>{
    const [r,s] = perCh[c]; const p = Math.round(100*r/s);
    return `<div class="bar ${p<75?"low":""}" title="${NAMES[c]}"><span>Ch. ${c}</span><div class="track"><div class="fill" style="width:${p}%"></div></div><span class="n">${r}/${s}</span></div>`;
  }).join("");
  $("weakAfter").disabled = !missed.size;
  $("weakAfter").textContent = missed.size ? `Practice weak spots (${missed.size})` : "No weak spots";
  $("saveWeakAfter").disabled = !missed.size;
  $("saveNoteAfter").classList.add("hidden");
  show("results");
}

document.addEventListener("keydown", e=>{
  if($("quiz").classList.contains("hidden")) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;   // leave Ctrl/Cmd+C, select-all, tab switching etc. alone
  const map = {"1":0,"2":1,"3":2,"4":3};
  if(!answered && e.key in map && map[e.key] < curOpts.length){ e.preventDefault(); answer(map[e.key]); }
  else if(answered && e.key==="Enter" && document.activeElement !== $("next")){ e.preventDefault(); nextQ(); }
});

/* anonymous usage stats (GoatCounter): no names, no answers, no scores */
function track(path, title){
  try{ if(window.goatcounter && goatcounter.count) goatcounter.count({path, title, event:true}); }catch(e){}
}
// Time spent: count only while the quiz tab is on screen, and report one bucket
// the first time the visitor leaves (switches tabs, locks the phone, closes it).
let activeMs = 0, shownAt = document.visibilityState === "visible" ? Date.now() : null, timeSent = false;
function sendTime(){
  if(shownAt !== null){ activeMs += Date.now() - shownAt; shownAt = null; }
  if(timeSent) return;
  timeSent = true;
  const min = activeMs / 60000;
  const bucket = min < 2 ? "0-2" : min < 5 ? "2-5" : min < 10 ? "5-10" : min < 20 ? "10-20" : "20-plus";
  track(`time-in-quiz/${bucket}-min`, `Time in quiz: ${bucket.replace("-plus","+")} min`);
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden") sendTime();
  else if(shownAt === null) shownAt = Date.now();
});
addEventListener("pagehide", sendTime);

refreshHome();
</script>
